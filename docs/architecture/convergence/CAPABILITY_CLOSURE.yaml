# Capability Closure Registry
#
# "Merged" is not "done". A capability is done when it is CONNECTED to a real
# consumer, EXERCISED by a named CI job, ENABLED somewhere real, and PROVEN with
# runtime evidence — or when a documented decision explicitly blocks, defers, or
# retires it.
#
# Validated by `tools/capability_closure.py` (CI job: capability-closure).
# Scope note: this is the LIFECYCLE registry for gated product capabilities. It
# is deliberately distinct from:
#   - docs/architecture/convergence/REGISTRY.yaml  — module/directory ownership
#   - docs/env-vars.md                             — what each variable MEANS
#   - factorylm_ai/capability_codes.py             — provider capability codes
#   - printsense/providers/capabilities.json       — vision-provider matrix
# Do not restate those here; reference them.
#
# ---------------------------------------------------------------------------
# HOW `environments:` IS SOURCED, AND WHY THAT MATTERS
# ---------------------------------------------------------------------------
# Values are OBSERVED from Doppler (`doppler secrets --project factorylm
# --config <env>`), which is the deploy-time source of truth: deploy-vps.yml
# runs `doppler run ... -- docker compose up`. They are a snapshot, stamped with
# `observed_on`. They are NOT re-read by the validator, because secret state is
# environment truth, not repository truth.
#
# The 2026-08-19 inventory found the repository CANNOT tell you this on its own,
# and that reading only the repository gives the WRONG answer: code defaults say
# `MIRA_RUN_DIFF_ENABLED` is off, `docker-compose.saas.yml:983` says
# `${MIRA_RUN_DIFF_ENABLED:-0}`, and Doppler prd says `1`. The last one wins.
# An earlier audit (PR #3318) read the first two and concluded, wrongly, that
# six capabilities were "shipped dark". Corrected in the same change as this file.
#
# ---------------------------------------------------------------------------
# STATES
#   implemented_unconnected  code exists, nothing consumes it
#   connected_ci_missing     a consumer exists, no named CI job runs its tests
#   deployed_disabled        shipped, off in every environment
#   staging_enabled          on in staging only
#   production_enabled       on in production
#   blocked | deferred | retired   an explicit decision
# ---------------------------------------------------------------------------

meta:
  observed_on: "2026-08-19"
  observed_by: "capability-closure inventory (Doppler read, dev/stg/prd)"
  doppler_project: factorylm
  note: >-
