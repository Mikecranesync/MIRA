capabilities:
  # =========================================================================
  - id: run_diff_engine
    purpose: >-
      Segment machine runs from tag_events, learn per-tag per-phase baselines,
      diff an observed run against them, and emit typed A0-A12 anomalies.
    customer_outcome: >-
      A technician can be shown what changed between a normal run and the run
      that failed, rather than a snapshot judged against hardcoded thresholds.
    feature_flag: MIRA_RUN_DIFF_ENABLED
    entrypoints:
      - "mira-crawler/run_engine/            # segmentation, baseline, diff, anomaly_rules"
      - mira-crawler/tasks/historize_runs.py:149
    consumers:
      - "mira-historian-worker               # docker-compose.saas.yml:966"
      - "mira-historian-beat                 # docker-compose.saas.yml:1000"
    schema:
      - "mira-hub/db/migrations/038_machine_runs.sql"
    environments:
      dev: unset
      staging: unset
      production: "1"                       # Doppler factorylm/prd, observed 2026-08-19
    state: production_enabled
    owner: null
    owner_missing: >-
      No owner recorded. It is enabled in production and nobody is named for it —
      the single most actionable gap in this registry.
    ci_jobs: []
    required_checks: []
    evidence:
      - path: docs/architecture/convergence/units/evidence/capability-closure/run-diff-pilot-2026-08-19.md
        note: >-
          First reviewed run-diff artifact. The real engine driven offline via
          InMemoryRunStore — no production, staging, PLC or DB access. Segments 7
          runs, learns 2 baselines from the normal ones, writes 10 diffs scoring
          a faulted run. Proves the core is functional and its output legible;
          does NOT prove behaviour on real tag noise, at volume, or through
          NeonRunStore. Raised two questions worth answering before this reaches
          a technician - see the artifact's reviewer notes.
    rollback: >-
      Set MIRA_RUN_DIFF_ENABLED=0 in Doppler factorylm/prd and redeploy the
      historian worker. No schema change to revert; migration 038 tables are
      append-only and harmless when the task early-returns.
    blocker: >-
      Enabled in production but UNPROVEN: its three test suites
      (mira-crawler/tests/test_run_baseline.py, test_machine_memory.py,
      test_historize_runs_integration.py) run in no CI job — mira-crawler/tests/
      is enumerated per-file at ci.yml:906 and none is named (#3089 class) — and
      no run-diff artifact has been reviewed. "Enabled" is not "proven".
    acknowledged_rules: []
    promotion_criteria:
      - "DONE 2026-08-19 - produce and review a run-diff artifact (see evidence)."
      - "Enumerate the three run-engine suites (test_run_baseline, test_machine_memory, test_historize_runs_integration) in a named CI job - they still run nowhere."
      - "Answer the two artifact questions: why anomalous_runs=0 while critical diffs are written, and whether a window-average baseline should be labelled as such in any UI."
      - "Produce one diff from REAL production tag_events through NeonRunStore, not the in-memory store."
    review_by: "2026-09-19"
    notes: >-
      Issue #2341 still describes this engine as not existing. It shipped and is
      enabled. Commented there 2026-08-18; the issue text remains stale.

