    purpose: >-
      Restrict retrieval to rows marked verified, so unapproved crawler or
      upload content cannot be cited as grounded evidence.
    customer_outcome: >-
      A cited source is one a human approved, not merely one that exists.
    feature_flag: MIRA_ENFORCE_APPROVED_RETRIEVAL
    entrypoints:
      - mira-bots/shared/neon_recall.py:136
    consumers:
      - "mira-bot-telegram"
      - "mira-bot-slack"
      - "mira-ask"
      - "mira-pipeline"
    environments:
      dev: unset
      staging: unset
      production: "true"                    # Doppler factorylm/prd; in-container 2026-08-27
    state: production_enabled
    owner: null
    owner_missing: "No owner recorded for a security-relevant control."
    ci_jobs:
      - capability-closure
    required_checks: []
    evidence:
      - path: tests/test_approved_retrieval_plumbing.py
        note: >-
          Every consumer's compose environment forwards the flag; with the
          container-shaped value 'true' recall_knowledge emits 'AND verified = true'
          on every knowledge_entries stream (hermetic, captured SQL). Direction
          check, staging 2026-08-26: 83,540 verified public (OEM corpus
          backfilled), 255 verified private, 711 UNverified private — gate-on
          hides only unapproved uploads, the designed direction.
      - path: docs/architecture/convergence/units/evidence/approved_context_retrieval/2026-08-27-prod-runtime-proof.md
        note: >-
          Production runtime proof 2026-08-27 after #3416 deployed (dd65c57eb):
          MIRA_ENFORCE_APPROVED_RETRIEVAL=true inside all five consumer
          containers; approval_gate_enabled() True in-process; recall_knowledge
          in mira-ask-saas returned 28 verified=false rows across 162 with the
          gate off and 0 with it on.
    rollback: >-
      Unset MIRA_ENFORCE_APPROVED_RETRIEVAL in Doppler factorylm/prd (the compose
      default is 'false'); redeploy the consumers.
    blocker: >-
      Was P0 #3328 (configured ON, enforced OFF: 'true' in Doppler prd, forwarded
      by no compose file). Plumbed in #3416 (merged dd65c57eb, v3.297.5) and
      proven at runtime on prod 2026-08-27 (see evidence). Remaining: no owner.
    acknowledged_rules: []
    promotion_criteria:
      - "DONE 2026-08-27 - variable observed inside all five prod consumer containers; in-process gate True in mira-ask/mira-pipeline/mira-bot-telegram; 28 unverified chunks recalled with the gate off vs 0 with it on (see evidence)."
      - "Record an owner."
    review_by: "2026-09-05"

