schema_version: 1
architecture_id: MIRA-1000
name: "MIRA CLOUD GOLD — The Divergence"
created: "2026-08-19"
last_updated: "2026-08-20"
baseline:
  branch: main
  sha: "5dfcbb8940bc2e724cf2b9b111f1837182f20688"

decision:
  cloud_gold:
    inference: "OpenAI Responses API"
    connectivity: "online"
    role: "reference intelligence / behavioral gold"
  on_prem:
    inference: "local inference stack"
    connectivity: "no cloud inference required"
    role: "privacy/offline deployment line converging toward Gold"
  divergence_boundary: "InferenceProvider"
  product_surfaces:
    factorylm_hub:
      role: "desktop configuration, governance, knowledge, integrations, permissions, telemetry, evals, and control plane"
      primary_technician_chat: false
    mira_native:
      codebase: "mira-mobile"
      role: "primary technician-facing MIRA interface"
      target_ux: "minimal conversation-first ChatGPT/Claude-style shell"
      disposition: "reuse and refactor; do not create a third native/chat client"
    notebook:
      role: "persistent machine/incident/research context primitive"
      mandatory_for_general_mira_chat: false
    alternate_clients:
      - telegram
      - slack
      - ignition
      - future_channels
  shared_contracts:
    - identity_and_scope
    - conversation
    - context
    - approved_retrieval
    - knowledge_graph
    - evidence_and_citations
    - asset_context
    - live_machine_state
    - deterministic_validation
    - cmms_and_work_orders
    - tool_registry
    - tool_policy
    - approvals
    - action_audit
    - client_normalization
    - evals

rules:
  - "Converge before creating parallel infrastructure."
  - "FactoryLM remains canonical for truth, authority, evidence, tools, and audit."
  - "Prompt files are immutable once issued; supersede with a new prompt ID."
  - "Every child PR updates this tracker and HISTORY.md."
  - "No generic autonomous OT write tool under MIRA-1000."
  - "Gold quality is established before model-cost routing."
  - "On-Prem gaps are measured against the same behavioral contract."
  - "FactoryLM Hub is the control plane; MIRA is the technician product."
  - "Reuse mira-mobile for the primary MIRA interface; do not create a third client merely for a new shell."
  - "Conversation is the primary technician interaction; existing browse/workflow screens become secondary surfaces and tools where appropriate."

