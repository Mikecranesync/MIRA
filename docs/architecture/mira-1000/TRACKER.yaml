cost_architecture:
  verified: "2026-08-19"
  interactive:
    service_tier: standard
    optimization:
      - prompt_caching
      - eval_backed_model_routing
  background_low_priority:
    service_tier: flex
  grouped_async:
    service_tier: batch
  guardrail: "Optimize cost per successful trustworthy outcome, never by bypassing FactoryLM evidence/policy."

