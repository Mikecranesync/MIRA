blockers:
  doctrine_adr:
    severity: high
    summary: >
      Cloud Gold puts a PAID frontier model on the chat/diagnosis path, which
      conflicted with root CLAUDE.md Hard Constraint #2 and with
      .claude/rules/zero-token-architecture.md Hard Rule 1.
    raised_by: P0001
    status: RESOLVED
    resolved_by: "ADR-0037 (docs/adr/0037-cloud-gold-paid-inference-edition.md)"
    resolved_on: "2026-08-19"
    note: >
      Both rules were amended IN PLACE, not merely in the ADR, so the carve-out
      cannot be discovered only by reading the ADR. ADR-0037 also makes per-turn
      cost telemetry a PRECONDITION for Cloud Gold traffic - that is P0003 Part B.

budget:
  openai_credit_usd: 9.25
  spent_usd: 0.00
  verified: "2026-08-19"
  note: >
    Verified gpt-5.6-sol pricing $5/Mtok in, $0.50 cached, $30/Mtok out. A
    representative turn (~4k in / ~600 out) costs ~$0.038 uncached, ~$0.029 with a
    2k cached prefix, so the credit funds roughly 240-320 interactive turns: the
    Phase 3 spine proof and one small eval slice, NOT the full section 24 suite
    through both editions. P0001, P0002 and P0003 each spend $0.00.
