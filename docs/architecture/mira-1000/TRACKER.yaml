  P0003:
    title: "First connected caller, cost telemetry, and conversation event contract"
    state: COMPLETE
    file: "prompts/P0003-first-caller-telemetry-conversation-contract.md"
    owner: null
    child_pr: null
    depends_on:
      - 3340
      - 3341
    acceptance:
      - "A real MIRA runtime request flows through InferenceProvider using the existing Cascade provider."
      - "Durable tenant/user/conversation/request/provider/model/token/cost/route/status telemetry exists or a canonical existing ledger is extended."
      - "Provider-independent conversation/event contract supports future text deltas, citations, tools, approvals, attachments, usage, final/error events."
      - "Current Cascade behavior and security invariants are preserved."
      - "No paid OpenAI runtime traffic and no broad UI rewrite in this slice."
    owner_claim: "https://github.com/Mikecranesync/MIRA/pull/3339#issuecomment-5352030428"
    paid_inference_spent_usd: 0.00
    closure:
      built: true
      connected: true            # RAGWorker._call_llm -- the production answer path
      tested: true
      observable: true           # a real turn's usage now REACHES decision_traces (078)
      provider_selectable: true  # get_provider(router=...) governs the real worker path
      regression_free: true      # 56 failing test NAMES byte-identical vs baseline
      proven: true               # a real _call_llm turn flows through seam + telemetry
      default_cascade_preserved: true
      verdict: GREEN
    regression_proof:
      method: "name-level diff of the full mira-bots suite, baseline vs branch"
      baseline_ref: "8c4bf57c7 (P0002 head, #3341)"
      branch_ref: "6adb915c0 (P0003 head, #3342)"
      command: >
        py -3 -m pytest tests/ -q -p no:randomly
        --ignore=tests/test_gchat_adapter.py --ignore=tests/test_slack_relay.py
        --ignore=tests/test_teams_adapter.py -rf --tb=no
      baseline_result: "56 failed, 2483 passed, 17 skipped (30:07)"
      branch_result: "56 failed, 2521 passed, 17 skipped (29:50)"
      names_only_on_branch: []
      names_only_on_baseline: []
      identical_failure_names: true
      passed_reconciliation: "2483 baseline + 38 new P0003 tests = 2521, exact"
      order_dependence: >
        NOT invoked and the earlier hypothesis was WRONG. Both extra failures
        were real regressions with identified causes and fixes (see H0009); no
        appeal to collection-order flakiness was needed or made.
      rollback: "MIRA_INFERENCE_PROVIDER unset (already the default); provider wraps the same router"
    result: |
      Part A: connected at RAGWorker._call_llm -- the primary technician answer
      path, and deliberately NOT engine.py, which has four open PRs against it
      (#3191/#2985/#2984/#2983). Blast radius is one function.
      Part B: REUSED decision_traces rather than creating a second run ledger --
      migration 078 adds provider/route_reason/principal/token counts/
      cached_input_tokens/cost_usd_estimate/tool_call_count/status. The projection
      is an allowlist, so a provider payload cannot inject tenant or smuggle
      columns.
      Part C: mira-bots/shared/inference/events.py -- 17-member EventType,
      TurnEnvelope, no OpenAI wire names, and no fabricated deltas.
      Part D: inspected only; gaps recorded under P0004 inputs.

      CLOSURE PASS (2026-08-20, owner-identified gaps):
      (1) Provider selection was NOT real -- RAGWorker hardcoded
      CascadeProvider(router=...), so MIRA_INFERENCE_PROVIDER never governed the
      connected path. get_provider() now takes the injected router and the worker
      uses it, so an unknown edition fails loudly at construction instead of
      silently serving the free cascade.
      (2) Telemetry was NOT connected -- 078 and build_trace_row existed but no
      real turn reached them; the earlier observable:true was an OVERCLAIM. The
      turn snapshot now flows worker sink -> engine result -> write_trace. It is
      threaded per-turn (state dict), NOT cached on the shared RAGWorker, because
      an instance attribute read after an await is the #1704 cross-tenant bleed
      this module already guards against for _last_sources.

  P0004:
    title: "Conversation-first native MIRA shell convergence"
    state: PLANNED
    inputs_from_p0003:
      current_client_frames: ["sources", "content", "status"]
      client_parser: "mira-mobile/src/lib/sse.ts (sources -> content* -> status -> [DONE])"
      mapped_to_new_contract:
        content: "assistant.text / assistant.text.delta"
        sources: "citation"
        status: "final / error.recoverable / error.fatal"
      client_has_no_equivalent_for:
        - "context.changed"
        - "tool.call.started|progress|completed|failed"
        - "tool.result"
        - "approval.required|accepted|rejected"
        - "attachment"
        - "usage"
      note: >
        sse.ts documents the Hub chat frames as supporting INCREMENTAL content
        delivery ("Phase-4 streamed variant, same frames"). That qualifies the
        P0001 finding, which measured the mira-pipeline /v1/chat/completions SSE
        path (one whole-reply chunk, main.py:1034). Whether the Hub endpoint
        actually emits content incrementally today was NOT verified in P0003 --
        verify before designing the P0004 streaming UX.
    file: null
    owner: null
    child_pr: null
