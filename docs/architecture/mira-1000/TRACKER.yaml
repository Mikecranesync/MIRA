    result: |
      Seam recommendation: InferenceProvider ABOVE InferenceRouter (not a 4th
      cascade provider). 13 client surfaces already converge on
      Supervisor.process(); 26 MCP tools already exist; the OpenAI SDK and
      OPENAI_API_KEY plumbing already ship. Four real gaps: no tools in the
      provider contract, no token streaming anywhere (current SSE is a single
      whole-reply chunk), api_usage missing 9 of the fields section 23 requires,
      and two unresolved doctrine conflicts (see blockers).

