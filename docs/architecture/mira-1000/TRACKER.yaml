blockers:
  doctrine_adr:
    severity: high
    summary: >
      Cloud Gold puts a PAID frontier model on the chat/diagnosis path. Root
      CLAUDE.md Hard Constraint #2 names the cloud cascade as Groq+Cerebras+Together
      (free-tier) and limits the paid carve-out to PrintSynth print-vision,
      "never chat/diagnosis". Separately, .claude/rules/zero-token-architecture.md
      Hard Rule 1 permits metered paid inference ONLY as a budget-declared
      acceptance test, never as a product runtime. Both need an ADR and owner
      ratification before Cloud Gold chat code ships.
    raised_by: P0001
    status: RESOLVED
    resolved_by: "ADR-0037 (docs/adr/0037-cloud-gold-paid-inference-edition.md)"
    resolved_on: "2026-08-19"

budget:
  openai_credit_usd: 9.25
  spent_usd: 0.00
  verified: "2026-08-19"
  note: >
    At verified gpt-5.6-sol pricing ($5/Mtok in, $0.50 cached, $30/Mtok out) a
    representative turn (~4k in / ~600 out) costs ~$0.038 uncached, ~$0.029 with a
    2k cached prefix. The credit therefore funds roughly 240-320 interactive turns:
    enough for the Phase 3 spine proof and one small eval slice, NOT the full
    section 24 behavioral suite run through both editions.

