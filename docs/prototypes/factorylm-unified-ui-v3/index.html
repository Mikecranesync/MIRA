<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FactoryLM V3 — FLM-UI-4000</title>
<style>
:root{
  --bg:#f7f7f5;--panel:#fff;--side:#f4f4f1;--text:#1f2328;--muted:#6b7078;--line:#e3e3dd;
  --accent:#2563eb;--ok:#15803d;--warn:#a16207;--warnbg:#fffbeb;--warnline:#fde68a;
  --stop:#b91c1c;--stopbg:#fef2f2;--radius:14px;
}
[data-theme="dark"]{--bg:#151615;--panel:#1e1f1e;--side:#191a19;--text:#f2f2ef;--muted:#a0a39e;--line:#33352f;--warnbg:#3a311c;--warnline:#8b6a26;--stopbg:#3b1d1d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ── harness (not part of the product) ───────────────────────────── */
.harness{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
.harness b{font-size:13px}
.harness .grp{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--side)}
.harness .grp button{border:0;background:transparent;color:var(--muted);padding:6px 9px;border-radius:6px;min-height:32px}
.harness .grp button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px #0001}
.harness .sp{margin-left:auto}

/* ── shell ───────────────────────────────────────────────────────── */
.stage{padding:16px;display:grid;place-items:start center}
.app{width:min(1180px,100%);height:min(860px,calc(100vh - 90px));display:grid;
  grid-template-columns:250px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;background:var(--panel);position:relative}
.app.mobile{width:min(412px,100%);grid-template-columns:1fr}
.app.mobile .sidebar{position:absolute;inset:0 auto 0 0;width:280px;transform:translateX(-101%);
  transition:transform .18s ease;z-index:30;box-shadow:0 0 40px #0003}
.app.mobile.drawer .sidebar{transform:none}
.scrim{display:none;position:absolute;inset:0;background:#0006;z-index:20}
.app.mobile.drawer .scrim{display:block}

/* sidebar — 5 items then More (recon: 13 → 5) */
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:11px}
.newchat{margin:0 12px 8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel);
  text-align:left;min-height:44px;display:flex;align-items:center;gap:8px;font-size:13px}
.nav{overflow:auto;padding:4px 8px 12px;flex:1}
.navlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:12px 8px 5px}
.item{display:flex;gap:9px;align-items:center;padding:0 9px;border-radius:8px;font-size:13px;color:var(--muted);
  min-height:44px;border:0;background:transparent;width:100%;text-align:left}
.item[aria-current="page"]{background:var(--panel);color:var(--text)}
.profile{border-top:1px solid var(--line);padding:0 14px;font-size:12px;color:var(--muted);min-height:52px;display:flex;align-items:center}

/* main */
.main{min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{min-height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px}
.hamburger{display:none;width:44px;height:44px;border:0;background:transparent;border-radius:9px;
  align-items:center;justify-content:center;flex-direction:column;gap:3px}
.app.mobile .hamburger{display:flex}
.hamburger i{display:block;width:17px;height:2px;background:var(--text);border-radius:2px}
.title{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* scope badge — permanent, tappable, names the machine (recon D-5) */
.scope{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--side);
  border-radius:999px;padding:0 12px;min-height:36px;font-size:12px;max-width:52%}
.scope .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.scope span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.thread{flex:1;overflow:auto;padding:20px max(16px,calc((100% - 720px)/2)) 150px;scroll-behavior:smooth}

/* HOME — the composer is the home screen (recon unblocker 1) */
.home{max-width:640px;margin:0 auto;padding-top:8vh}
.home h1{font-size:23px;margin:0 0 6px;font-weight:650}
.home p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.sugg{display:grid;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;
  text-align:left;font-size:13px;line-height:1.4;min-height:44px}
.sugg small{display:block;color:var(--muted);font-size:11px;margin-top:3px}

/* conversation — speaker encoded by shape, not colour (recon B-2) */
.turn{margin:0 0 22px}
.u{display:flex;justify-content:flex-end}
.u .bubble{max-width:82%;background:var(--side);border-radius:15px 15px 4px 15px;padding:10px 13px;font-size:14px;line-height:1.5}
.a{font-size:14px;line-height:1.62}
.a h3{font-size:14px;margin:16px 0 6px}
.a p{margin:9px 0}
.a ul{margin:9px 0;padding-left:19px}.a li{margin:4px 0}
.a code{background:var(--side);padding:1px 5px;border-radius:5px;font-size:12.5px}
.ahead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mira{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:10px}

/* groundedness — stated positively, never inferred from absence (recon E-2) */
.basis{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11px;border:1px solid}
.basis.cited{color:var(--ok);border-color:#15803d44;background:#15803d0e}
.basis.general{color:var(--warn);border-color:#a1620744;background:#a162070e}

/* citations name the document and page — never an id (recon E-1) */
.cites{display:grid;gap:6px;margin:13px 0 0}
.cite{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  background:var(--panel);font-size:12px;min-height:44px;text-align:left;width:100%}
.cite .kind{font-size:9px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 5px;flex:0 0 auto}
.cite .doc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cite .pg{color:var(--muted);flex:0 0 auto}

/* action row — copy is non-negotiable, always visible (recon B-8) */
.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 11px;
  min-height:38px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.actions button:hover{color:var(--text)}

/* waiting state names the step (recon differentiator 7.2) */
.waiting{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin:6px 0 4px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* errors degrade to the nearest working state — no status codes (recon G-1..G-5) */
.notice{display:grid;grid-template-columns:20px 1fr;gap:10px;border-radius:12px;padding:12px;margin:14px 0;font-size:13px}
.notice.warn{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warn)}
.notice.stop{background:var(--stopbg);border:1px solid #fecaca;color:var(--stop)}
.notice b{display:block;margin-bottom:3px}
.notice .row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.notice .row button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:0 12px;min-height:38px;font-size:12px}

/* offline is a first-class state, not an error (recon differentiator 7.6) */
.offbar{display:none;align-items:center;gap:8px;padding:8px 14px;font-size:12px;background:var(--side);
  border-bottom:1px solid var(--line);color:var(--muted)}
.app.offline .offbar{display:flex}
.offbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* composer — camera promoted out of the + menu (recon differentiator 4.2) */
.cwrap{position:absolute;left:0;right:0;bottom:0;padding:14px max(16px,calc((100% - 720px)/2));
  background:linear-gradient(transparent,var(--panel) 30%)}
.composer{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 6px 22px #0000000f;padding:8px}
.ctx{font-size:10.5px;color:var(--muted);padding:2px 6px 6px}
.crow{display:flex;gap:6px;align-items:flex-end}
.crow textarea{flex:1;resize:none;border:0;outline:0;background:transparent;min-height:44px;max-height:120px;padding:11px 4px;font-size:14px}
.iconbtn{width:44px;height:44px;border:0;border-radius:11px;background:var(--side);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.send{background:var(--accent);color:#fff}
.send[disabled]{opacity:.4}
@media(max-width:820px){.stage{padding:0}.app{height:calc(100vh - 46px);border:0;border-radius:0}}
</style>
</head>
<body>

<!-- Harness only: lets you jump to each state on the phone. Not product chrome. -->
<div class="harness">
  <b>V3</b>
  <div class="grp" id="view">
    <button data-v="mobile" class="on">Mobile</button><button data-v="web">Web</button>
  </div>
  <div class="grp" id="state">
    <button data-s="home" class="on">Home</button><button data-s="waiting">Waiting</button>
    <button data-s="answer">Answer</button><button data-s="general">Ungrounded</button>
    <button data-s="error">Error</button><button data-s="offline">Offline</button>
  </div>
  <button class="grp" id="theme" style="padding:6px 10px;min-height:32px">◐</button>
</div>

<div class="stage">
<div class="app mobile" id="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar">
    <div class="brand"><div class="mark">FL</div><div><b style="font-size:13px">FactoryLM</b></div></div>
    <button class="newchat">＋ New chat</button>
    <nav class="nav">
      <div class="navlabel">Recent</div>
      <button class="item" aria-current="page">G120 F30001 overcurrent</button>
      <button class="item">Conveyor CV-101 grinding</button>
      <div class="navlabel">Workspace</div>
      <button class="item">▣ Projects</button>
      <button class="item">▦ Machines</button>
      <button class="item">▤ Manuals</button>
      <button class="item">✓ Work orders</button>
      <button class="item">More ›</button>
    </nav>
    <div class="profile">MH · Mike Harper</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="ham" aria-label="Open navigation"><i></i><i></i><i></i></button>
      <div class="title" id="title">New chat</div>
      <button class="scope"><span class="dot"></span><span id="scope">No machine — tap to set</span></button>
    </header>
    <div class="offbar"><span class="dot"></span> Offline — you can still read and type. Messages send when you reconnect.</div>

    <div class="thread" id="thread"></div>

    <div class="cwrap">
      <div class="composer">
        <div class="ctx" id="ctx">General question · open a machine to ask about it specifically</div>
        <div class="crow">
          <button class="iconbtn" aria-label="Add attachment">＋</button>
          <button class="iconbtn" aria-label="Take photo">◉</button>
          <textarea id="ta" rows="1" placeholder="Ask MIRA…" aria-label="Ask MIRA"></textarea>
          <button class="iconbtn send" id="send" aria-label="Send" disabled>↑</button>
        </div>
      </div>
    </div>
  </main>
</div>
</div>

<script>
const app=document.getElementById('app'),thread=document.getElementById('thread'),ta=document.getElementById('ta'),
      send=document.getElementById('send'),title=document.getElementById('title'),ctx=document.getElementById('ctx'),
      scope=document.getElementById('scope');

const Q='LSM section hums and the drive shows inhibit — speed reference will not return to zero. What do I check first?';

const userTurn=q=>`<div class="turn u"><div class="bubble">${q}</div></div>`;

const answerBody=`
  <h3>Most likely cause</h3>
  <p>The drive is still seeing a non-zero speed command, or the feedback chain is reporting motion that has stopped. Split those two before opening anything.</p>
  <ul>
    <li>Trend commanded speed, encoder feedback, drive enable and inhibit on one time axis.</li>
    <li>Command stays above zero → trace the reference-generation logic.</li>
    <li>Command reaches zero but feedback oscillates → inspect the speed-sensor chain, alignment and cable.</li>
  </ul>
  <p>Fault <code>F30001</code> latches on overcurrent, so clear the cause before resetting.</p>`;

const actions=`<div class="actions">
    <button>⧉ Copy</button><button>↻ Retry</button><button>▤ Sources</button><button>✓ Save finding</button>
  </div>`;

const cites=`<div class="cites">
    <button class="cite"><span class="kind">MANUAL</span><span class="doc">SINAMICS G120 Function Manual</span><span class="pg">p.418</span></button>
    <button class="cite"><span class="kind">HISTORY</span><span class="doc">Drive A fault window · 23 tag changes</span><span class="pg">14:02</span></button>
  </div>`;

const STATES={
  home:()=>{
    title.textContent='New chat'; ctx.textContent='General question · open a machine to ask about it specifically';
    scope.textContent='No machine — tap to set';
    return `<div class="home">
      <h1>What are you working on?</h1>
      <p class="sub">Ask anything, or start from what changed on the floor today.</p>
      <div class="sugg">
        <button>Drive A is showing F30001 after a restart<small>Launch 2 · LSM Drive System</small></button>
        <button>Conveyor CV-101 is grinding under load<small>Garage · flagged 2 hours ago</small></button>
        <button>What does a PowerFlex 525 F0004 mean?<small>General question</small></button>
      </div></div>`;
  },
  waiting:()=>{
    title.textContent='Drive inhibit at zero speed'; scope.textContent='Launch 2 · Drive A';
    ctx.textContent='Using: Launch 2 / LSM Drive System / Drive A';
    return userTurn(Q)+`<div class="turn a">
      <div class="ahead"><div class="mira">M</div><b>MIRA</b></div>
      <div class="waiting"><span class="spin"></span> Reading the G120 manual…</div>
      <div class="waiting" style="opacity:.55">Checking Drive A fault history…</div>
      <div class="waiting" style="opacity:.3">Comparing against recorded evidence…</div></div>`;
  },
  answer:()=>{
    title.textContent='Drive inhibit at zero speed'; scope.textContent='Launch 2 · Drive A';
    ctx.textContent='Using: Launch 2 / LSM Drive System / Drive A';
    return userTurn(Q)+`<div class="turn a">
      <div class="ahead"><div class="mira">M</div><b>MIRA</b>
        <span class="basis cited">● Grounded in 2 sources</span></div>
      ${answerBody}
      <div class="notice warn"><div>⚠</div><div><b>Before probing the drive</b>
        Follow ride-specific lockout/tagout and verify stored energy is discharged. Read-only observations first.</div></div>
      ${cites}${actions}</div>`;
  },
  general:()=>{
    title.textContent='PowerFlex 525 F0004'; scope.textContent='No machine — tap to set';
    ctx.textContent='General question · open a machine to ask about it specifically';
    return userTurn('What does F0004 mean on a PowerFlex 525?')+`<div class="turn a">
      <div class="ahead"><div class="mira">M</div><b>MIRA</b>
        <span class="basis general">⚠ General guidance — no manual on file</span></div>
      <p>F0004 is an undervoltage fault: the DC bus dropped below the trip threshold. Common causes are input power loss, a loose incoming terminal, or a failing pre-charge circuit.</p>
      <p>I don't have a PowerFlex 525 manual in your library, so I can't cite a page or give the exact threshold for your configuration.</p>
      <div class="notice warn"><div>▤</div><div><b>Upload the manual and I can cite it</b>
        <div class="row"><button>Upload a manual</button><button>Scan the nameplate</button></div></div></div>
      ${actions}</div>`;
  },
  error:()=>{
    title.textContent='Drive inhibit at zero speed'; scope.textContent='Launch 2 · Drive A';
    ctx.textContent='Using: Launch 2 / LSM Drive System / Drive A';
    ta.value=Q; send.disabled=false;
    return userTurn(Q)+`<div class="turn a">
      <div class="notice stop"><div>✕</div><div><b>Couldn't reach MIRA</b>
        Your question is saved and still in the box below — nothing was lost.
        <div class="row"><button>Try again</button><button>Dismiss</button></div></div></div></div>`;
  },
  offline:()=>{ const h=STATES.answer(); return h+`<div class="turn u"><div class="bubble" style="opacity:.6">
      Is the encoder cable routed near the drive output?<div style="font-size:11px;color:var(--muted);margin-top:5px">◷ Queued — sends when you reconnect</div></div></div>`; }
};

function show(s){
  app.classList.toggle('offline',s==='offline');
  if(s!=='error'){ta.value='';send.disabled=true}
  thread.innerHTML=STATES[s]();
  thread.scrollTop=s==='home'?0:thread.scrollHeight;
}
document.querySelectorAll('#state button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#state button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.dataset.s)});
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#view button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  app.className='app '+b.dataset.v+(app.classList.contains('offline')?' offline':'')});
document.getElementById('ham').onclick=()=>app.classList.add('drawer');
document.getElementById('scrim').onclick=()=>app.classList.remove('drawer');
document.getElementById('theme').onclick=()=>{const d=document.documentElement;
  d.hasAttribute('data-theme')?d.removeAttribute('data-theme'):d.setAttribute('data-theme','dark')};
ta.addEventListener('input',()=>{send.disabled=!ta.value.trim();
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'});
send.onclick=()=>{if(ta.value.trim())show('waiting')};
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send.click()}});
show('home');
</script>
</body>
</html>
