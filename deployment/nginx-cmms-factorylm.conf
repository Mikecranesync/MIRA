# nginx vhost for cmms.factorylm.com — the production Atlas CMMS (OVH VPS).
#
# HTTP-only; `certbot --nginx` adds the TLS server block in place once DNS
# points at this host (same flow as deployment/nginx-staging-factorylm.conf /
# .github/workflows/deploy-nginx-stg.yml). Deployed by
# .github/workflows/deploy-atlas.yml to
# /etc/nginx/sites-available/cmms-factorylm.
#
# Upstreams: cmms-backend on 127.0.0.1:8088 (/api/ -> backend root, trailing
# slash on proxy_pass strips the /api prefix — Atlas serves at root paths,
# see mira-hub/src/lib/atlas/client.ts:136,280 and mira-mcp/cmms/atlas.py:65,117),
# cmms-frontend on 127.0.0.1:3100 (/).
#
# Deliberately minimal: no sub_filter branding, no aliases into /opt/mira.
# Branding (as done for the old cmms.factorylm.ai vhost — see
# docs/plans/cmms-nginx.conf.template, nginx-oracle-v2.conf) is a follow-up,
# not part of this cutover.
#
# Must not name any other hostname.

server {
    listen 80;
    server_name cmms.factorylm.com;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
