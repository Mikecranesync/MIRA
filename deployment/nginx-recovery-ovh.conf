# OVH recovery vhosts for #3800 — HTTP-only on purpose.
#
# `certbot --nginx` rewrites these into 443 server blocks and adds the
# certificate directives, so shipping TLS here would make the file fail
# `nginx -t` on a host that has no certificate yet (the state every fresh
# recovery host is in). HTTP first, certbot second, is the only ordering that
# works when DNS has not yet been pointed at the new origin.
#
# Scope: this is the MINIMUM recovery surface — the two services that are
# actually running on the recovery host:
#
#   app.factorylm.com  -> 127.0.0.1:3101   mira-hub   (Next.js app + API)
#   factorylm.com      -> 127.0.0.1:3200   mira-web   (marketing)
#
# It deliberately does NOT reproduce deployment/nginx-app-factorylm.conf, which
# also proxies /api/v1/* -> :9099 (mira-pipeline), /ingest/* -> :8002 and
# /mcp/* -> :8001. Those services are not part of the Hub-only recovery, so
# routing to them would turn a working origin into a wall of 502s. Layer the
# full vhost back in once those containers are restored.

server {
    listen 80;
    listen [::]:80;
    server_name app.factorylm.com;

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: the Hub streams chat over text/event-stream, which dies behind
        # response buffering.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name factorylm.com www.factorylm.com;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
