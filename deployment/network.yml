connectivity:
  - from: alpha
    to: bravo
    transport: tailscale
    lan_fallback: false
  - from: alpha
    to: charlie
    transport: tailscale
    lan_fallback: false
  - from: bravo
    to: charlie
    transport: lan
    lan_fallback: true
  - from: charlie
    to: bravo
    transport: lan
    lan_fallback: true

doppler:
  project: factorylm
  config: prd
  ssh_secrets:
    - SSH_ALPHA_PRIVATE_KEY
    - SSH_ALPHA_PUBLIC_KEY
    - SSH_ALPHA_CONFIG
    - SSH_ALPHA_AUTHORIZED_KEYS
    - SSH_BRAVO_PRIVATE_KEY
    - SSH_BRAVO_PUBLIC_KEY
    - SSH_BRAVO_CONFIG
    - SSH_BRAVO_AUTHORIZED_KEYS
    - SSH_CHARLIE_PRIVATE_KEY
    - SSH_CHARLIE_PUBLIC_KEY
    - SSH_CHARLIE_CONFIG
    - SSH_CHARLIE_AUTHORIZED_KEYS
    - SSH_NETWORK_TOPOLOGY
