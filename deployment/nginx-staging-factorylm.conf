# FactoryLM co-hosted STAGING vhosts (#3930) — installed by
# .github/workflows/deploy-nginx-stg.yml on the host named by STAGING_HOST
# (the production VPS). Two hostnames, both proxied to loopback ports of the
# `factorylm-staging` compose project:
#
#   staging.factorylm.com      → 127.0.0.1:4200  (stg-mira-web)
#   app-staging.factorylm.com  → 127.0.0.1:4101  (stg-mira-hub)
#     … except exactly POST /api/v1/tags/ingest → 127.0.0.1:4765 (stg-mira-relay)
#
# HTTP only as committed. TLS is added in place by certbot on the host
# (`certbot --nginx -d staging.factorylm.com -d app-staging.factorylm.com`),
# which the workflow runs only once both names resolve to this host.
#
# Isolation rule: this file must never declare a production server_name
# (factorylm.com, www.factorylm.com, app.factorylm.com, updates.factorylm.com)
# — the workflow refuses to install it if it does.

server {
    listen 80;
    listen [::]:80;
    server_name staging.factorylm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app-staging.factorylm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # CV-101 tag ingest → stg-mira-relay (loopback 4765). EXACT match, POST only:
    # the relay's historian / websocket / legacy /ingest routes are never exposed.
    # Authentication is the relay's mandatory HMAC (X-MIRA-*); nginx adds none and
    # strips none. Bodies are tag batches — a small cap bounds abuse.
    location = /api/v1/tags/ingest {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:4765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
