# updates.factorylm.com — OTA web-bundle distribution for the FactoryLM Android app.
#
# WHY THIS IS ITS OWN SERVER BLOCK AND NOT A PATH ON app.factorylm.com
# The phone's update channel must not share a failure domain with the Hub. A bad
# Hub deploy, a migration that wedges the app server, or an nginx reload that
# breaks a proxy_pass should leave technicians' update path untouched — and an
# OTA publish must never require deploying the backend. This block serves static
# files off disk: no proxy_pass, no upstream, nothing that can be down because
# an application is down.
#
# It is also the reason nothing here is dynamic. The manifest is a signed file
# written by scripts/ota-publish.mjs and copied into place; nginx only hands it
# over. The security properties live in the signature, not in this server.
#
# Install (VPS):
#   sudo cp nginx-updates-factorylm.conf /etc/nginx/sites-available/updates.factorylm.com
#   sudo ln -sf /etc/nginx/sites-available/updates.factorylm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d updates.factorylm.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: updates.factorylm.com A -> 165.245.138.91

server {
    listen 80;
    listen [::]:80;
    server_name updates.factorylm.com;

    # ACME renewal must keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name updates.factorylm.com;

    ssl_certificate     /etc/letsencrypt/live/updates.factorylm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.factorylm.com/privkey.pem;

    root /srv/factorylm/ota;

    # No directory listing: the artifact store's contents are not a public index,
    # and a listing would advertise every historical bundle for probing.
    autoindex off;

    access_log /var/log/nginx/updates.factorylm.com.access.log;
    error_log  /var/log/nginx/updates.factorylm.com.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The manifest is the mutable pointer — it MUST NOT be cached, or a rollback
    # would take effect only after a CDN/browser cache expired. That delay is
    # exactly when it matters least to be slow.
    location ~ ^/manifest\.(canary|production)\.json$ {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Artifacts are immutable and content-addressed, so they can be cached hard
    # and forever: the same URL can never return different bytes.
    location ^~ /releases/ {
        types { application/zip zip; }
        default_type application/zip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # A cheap liveness probe for the publish tooling; carries no data.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
