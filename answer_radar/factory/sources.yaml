# Benchmark Factory source registry (spec §5). No adapter may collect from a source that is
# not listed here. Collection additionally requires automated_collection_allowed: true AND a
# human-set reviewed_at (YYYY-MM-DD). Every entry ships unreviewed: no crawler is authorized.
# Fixture replay (re-reading already-captured test data) is not collection.
#
# license_or_terms records what the spec or the source states; "unreviewed" means nobody has
# read the terms yet, and every capability then fails closed.
sources:
  - source_id: stackexchange
    name: Stack Exchange network (Electrical Engineering, Engineering)
    source_type: q_and_a
    family: public_qa
    base_url: https://electronics.stackexchange.com/
    license_or_terms: CC BY-SA; the version depends on the contribution date
    attribution_required: true
    automated_collection_allowed: true
    store_full_text: false
    store_derived_case: true
    redistribution_allowed: false
    ground_truth_role: discovery
    reviewed_at: "2026-10-27"
    notes: >-
      Owner approved capture 2026-10-27 (Stack Exchange only). Public API, anonymous quota
      300 requests/day. Captured text stays in a private directory outside git; keep author,
      URL and license version on every case.
  - source_id: control_com
    name: Control.com automation forums
    source_type: forum
    family: industrial_forum
    base_url: https://control.com/forums/
    license_or_terms: unreviewed
    attribution_required: true
    automated_collection_allowed: false
    store_full_text: false
    store_derived_case: true
    redistribution_allowed: false
    ground_truth_role: discovery
    reviewed_at: "2026-10-27"
    notes: Owner approved 2026-10-27, but the forums sit behind a Cloudflare bot challenge for automated clients; not collected.
  - source_id: mrplc
    name: MrPLC forums
    source_type: forum
    family: industrial_forum
    base_url: https://mrplc.com/forums/
    license_or_terms: unreviewed
    attribution_required: true
    automated_collection_allowed: false
    store_full_text: false
    store_derived_case: true
    redistribution_allowed: false
    ground_truth_role: discovery
    reviewed_at: "2026-10-27"
    notes: Owner approved 2026-10-27, but robots.txt disallows AI crawlers (ClaudeBot, GPTBot, ...); not collected. IMIB v0.1 already holds 31 questions.
  - source_id: plctalk
    name: PLCtalk forums
    source_type: forum
    family: industrial_forum
    base_url: https://www.plctalk.net/
    license_or_terms: unreviewed
    attribution_required: true
    automated_collection_allowed: false
    store_full_text: false
    store_derived_case: true
    redistribution_allowed: false
    ground_truth_role: discovery
    reviewed_at: "2026-10-27"
    notes: Owner approved 2026-10-27, but every automated request gets a Cloudflare bot challenge; not collected (no challenge circumvention).
  - source_id: oem_manuals
    name: OEM manuals, fault and alarm tables
    source_type: oem
    family: oem_documentation
    base_url: null
    license_or_terms: per-manufacturer; public availability is not a redistribution grant
    attribution_required: true
    automated_collection_allowed: false
    store_full_text: false
    store_derived_case: true
    redistribution_allowed: false
    ground_truth_role: authoritative
    reviewed_at: "2026-10-27"
    notes: Owner approved 2026-10-27 for locally held copies only; page text stays private (no redistribution). Store doc sha256, page and a short quote.
  - source_id: osha_fatalities
