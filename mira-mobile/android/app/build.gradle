apply plugin: 'com.android.application'

// Release signing (Google Play upload key). Secrets live in android/keystore.properties
// (gitignored) + a keystore file OUTSIDE the repo — see docs/release/android/signing.md.
// Without keystore.properties the release build stays unsigned (CI-safe): Play App
// Signing holds the real app signing key; this keystore is only the upload key.
// Signing credentials come from ONE of two places, never from git:
//   1. android/keystore.properties  — the release machine (gitignored)
//   2. environment variables        — CI, injected from Doppler factorylm/prd
// Env wins when present so a protected workflow never needs a file on disk.
// Absent both, release builds stay UNSIGNED and do not fail (CI-safe).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// ANDROID_KEYSTORE_FILE is a PATH written by CI after base64-decoding the
// keystore from Doppler — the key material itself is never an env var, never
// echoed, and never lands in a log.
def envStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def envStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasEnvSigning = envStoreFile != null && !envStoreFile.isEmpty()
def hasSigning = hasEnvSigning || keystorePropertiesFile.exists()

android {
    namespace = "com.factorylm.mira"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.factorylm.mira"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode bumps by exactly 1 on every Play upload (Play rejects reuse);
        // versionName tracks the mobile release line (docs/release/android/README.md).
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(envStoreFile)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            } else if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
