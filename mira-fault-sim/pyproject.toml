[project]
name = "mira-fault-sim"
version = "0.1.0"
description = "MIRA Conveyor Fault Detective — sensor + vision + fuse simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "aiomqtt==2.3.0",
    "pydantic==2.9.2",
]

[project.optional-dependencies]
# httpx is required by starlette.testclient (used by tests/test_inject_modes.py).
# Its absence made 2 of 13 tests error on collection — invisible while no CI job
# ran this suite at all (#3311).
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "httpx>=0.27"]

[tool.setuptools]
py-modules = ["sim"]
