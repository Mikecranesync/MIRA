    equipment: [get_equipment_status, list_active_faults, get_fault_history, get_maintenance_notes]
    cmms: [diagnostic_record_case, cmms_write_work_order, cmms_create_work_order, cmms_list_work_orders, cmms_complete_work_order, cmms_list_assets, cmms_get_asset, cmms_list_pm_schedules, cmms_health, create_asset_from_nameplate]
    agents: [run_kb_builder, run_prompt_optimizer, run_infra_guardian, get_agent_status]
    knowledge_graph: [kg_maintenance_context, kg_impact_analysis, kg_root_cause_chain, kg_traverse_chain, kg_flag_pm_mismatches, mira_browse_namespace, mira_get_equipment, kg_extract_schematic]

