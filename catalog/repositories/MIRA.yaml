# repositories/MIRA.yaml — the primary FactoryLM/MIRA monorepo
repository: MIRA
classification: production-critical
visibility: public
default_branch: main
primary_language: Python
commit_at_catalog: cde2c418
version: "3.146.0"          # /VERSION at commit cde2c418
last_push: "2026-07-14"
open_prs: 30
open_issues: 30
purpose: >
  The live product. FactoryLM = the maintenance-context layer; MIRA = the grounded diagnostic
  agent proving it by diagnosing with citations. Chat surfaces (Slack/Telegram/Ignition/QR/web)
  render the same approved-context answer over one Supervisor engine.
entry_docs:
  - CLAUDE.md              # build state + repo map
  - CONTEXT-MAP.md         # per-module contexts
  - docs/THEORY_OF_OPERATIONS.md  # primary doctrine
  - docs/ARCHITECTURE.md   # layer map + dependency rules
  - NORTH_STAR.md          # canonical wedge

# --- CI / deploy (confirmed) ---
ci:
  workflow_count: 48
  gates_of_note: [version-gate.yml, staging-gate.yml, beta-gate.yml, smoke-test.yml, ci.yml, code-review.yml, migration-verify.yml]
  detection_method: ls
  evidence_file: catalog/evidence/mira-structure.txt
deploy:
  compose_files: [docker-compose.yml, docker-compose.saas.yml, docker-compose.staging.yml, docker-compose.staging-vps.yml, docker-compose.hub.yml, docker-compose.observability.yml, docker-compose.fault-detective.yml, docker-compose.override.yml, docker-compose.pathb.yml, docker-compose.sync.yml]
  prod_target: "VPS 165.245.138.91 (DigitalOcean) via deploy-vps.yml"
  environments: [dev (CHARLIE local), staging (CHARLIE + Neon staging branch / VPS stg-*), prod (VPS)]
  detection_method: ls

