    and c7, so it is not a regression from CTX-004b — it is the layer underneath.
    Localized, NOT root-caused: it is a RETRIEVAL referent problem, not the pack (the
    PF525 pack has zero fault_entries, zero knowledge and zero keypad_navigation,
    so it cannot answer a reset question and never claims the turn). Working hypothesis,
    with a natural experiment already in the evidence: _prepend_equipment_context
    carries the fault CODE but not the fault NAME, so the enriched query is "... PowerFlex
    525 F004 How do I reset it?" and the strongest lexical match for "reset" in the
    corpus is digital-output content. The control is c6/c7 t1_004 — "how to reset
    a powerflex525 after an UNDERVOLTAGE fault?" retrieves the right answer ("cycle
    power or use the keypad to clear the fault"). The word the corpus indexes is "undervoltage",
    and the pack already maps code 4 -> "UnderVoltage" in live_decode.fault_codes,
    so the name is available deterministically. Fixing it is a RETRIEVAL-layer change:
    it needs the retrieval-diagnostics discipline (measure recall on the production
    path, not a harness), bot-grounding-tests, and a staging gate. Do not patch it
    blind. | RETRIEVAL DIAGNOSIS DONE (2026-08-09, raw recall_knowledge on staging,
