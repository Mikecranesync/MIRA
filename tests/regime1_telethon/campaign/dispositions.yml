  issue: '3160'
  last_seen: c3
  note: 'Root cause: the fresh-thread pivot fires only from ACTIVE_DIAGNOSTIC_STATES,
    and the low-groundedness self-critique clarifier parks the session in DIAGNOSIS_REVISION
    first. Suggested contract CTX-001d: a pivot fires from every state holding a pending
    diagnostic question. | c3: still fails, 1/2 variants this round (2/2 in c2). Unfixed
    on this branch as expected — the partial fix lives in held PR #3153. | Multi-seed:
    STABLE_FAIL — failed under every seed observed. The most reproducible defect in
    the set, and the one to fix next. | ROOT-CAUSE CORRECTION (2026-08-08, from the
    per-turn grades in the frozen ledgers — the note above was written from the turn-3
    reply alone and is incomplete). This fingerprint bundles AT LEAST THREE defects,
    and the recorded root cause is NOT the one that drives the verdict. Across the
    8 failing conversations in c1/c1r2/c1r3/c2/c3: SEVEN fail at TURN 2 and only FIVE
    at turn 3. (A) TURN 2, 5 sightings — "How do I reset it?" is answered with the
