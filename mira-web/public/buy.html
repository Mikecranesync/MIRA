<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk to Mike — FactoryLM</title>
  <meta name="description" content="No self-serve checkout. Talk to Mike at mike@factorylm.com.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://factorylm.com/buy">
  <meta property="og:title" content="Talk to Mike — FactoryLM">
  <meta property="og:description" content="No self-serve checkout. Talk to Mike.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://factorylm.com/buy">
  <link rel="icon" href="/public/icons/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0e11;
      --border: rgba(255,255,255,0.08);
      --text: #f1f3f8;
      --text-dim: rgba(255,255,255,0.62);
      --amber: #f0a000;
      --font: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100dvh;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .topbar a.brand { font-weight: 700; font-size: 16px; color: var(--text); text-decoration: none; }
    .topbar a.signin { font-size: 13px; color: var(--text-dim); text-decoration: none; padding: 6px 10px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 64px 20px; text-align: center; }
    h1 { font-size: 36px; font-weight: 500; margin-bottom: 16px; }
    p { color: var(--text-dim); margin-bottom: 28px; line-height: 1.6; }
    .talk {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 12px 24px; border-radius: 6px;
      background: var(--amber); color: #0a0a08;
      font-weight: 700; text-decoration: none;
    }
    a.talk-link { color: var(--amber); text-decoration: underline; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">FactoryLM</a>
    <a href="/cmms" class="signin">Sign in</a>
  </header>
  <main class="wrap">
    <h1>Talk to Mike</h1>
    <p>MIRA stands alone — a CMMS is optional, never required. There is no self-serve checkout on this page.</p>
    <a href="mailto:mike@factorylm.com" class="talk" data-cta="buy-talk">Talk to Mike</a>
  </main>
</body>
</html>
