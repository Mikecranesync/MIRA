name: Deploy to VPS

# Exact-source production deploy (#3910 + #3911, release-hardening carrier).
#
#   approved_rc_sha == checked-out == built == deployed == reported-at-runtime
#
#   * The ONLY source of the deployed code is the `approved_rc_sha` input — an
#     immutable 40-hex commit. This file never resolves the moving main ref; the
#     workflow definition runs from main (the trusted controller), the deployed
#     source is the input, and the two are deliberately kept separate.
#   * A vX.Y.Z release tag must point AT that SHA (resolved by
#     .github/scripts/resolve_release_tag.sh, which now fails closed).
#   * The Staging Gate must have passed on the PR head that produced the SHA.
#   * A deployed-staging receipt artifact (`staging-receipt-<sha>`, written by
#     deploy-staging.yml) must exist, be unexpired, and verify for the same SHA.
#   * The production migration-drift gate ALWAYS runs and fails closed. There are
#     no skip_* inputs; gate bypasses were removed, not made optional.
#   * Images are built with `--no-cache --pull`; the built image IDs must equal
#     the running container image IDs; /api/version (hub) and /api/health (web)
#     must report gitSha == approved_rc_sha, or the run STOPs naming the prior
#     tag/SHA as the rollback anchor. A `production-receipt-<sha>` artifact
#     records the proof.
#   AUTO-DEPLOY stays DISABLED (#3800): a merge to main must NOT deploy production.

on:
  workflow_dispatch:
    inputs:
      approved_rc_sha:
        description: "Immutable approved release candidate SHA (exactly 40 lowercase hex characters)"
        required: true
        type: string
      approved_release_tag:
        description: "Release tag corresponding to approved_rc_sha (e.g., v1.2.3), or empty to resolve from SHA"
        required: false
        type: string
        default: ""
      services:
        description: "Space-separated services to rebuild (leave blank for all)"
        required: false
        default: ""

concurrency:
  group: deploy-vps
  cancel-in-progress: false  # never cancel a running deploy

# Permissions: contents:read for checkout and artifact access; actions:read for
# artifact list API.
permissions:
  contents: read
  actions: read

jobs:
  # Authorize the immutable source and its Staging Gate result before GitHub
  # creates either production-environment job. This job deliberately has no
  # environment and receives neither the production DB credential nor SSH key.
  authorize-source:
    name: Authorize production source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_rc_sha: ${{ steps.validate.outputs.approved_rc_sha }}
      approved_release_tag: ${{ steps.resolve-tag.outputs.approved_release_tag }}
      services: ${{ steps.validate.outputs.services }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.approved_rc_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject gate-bypass inputs
        env:
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          for key in skip_staging_gate skip_drift_check skip_reason; do
            if echo "$INPUTS_JSON" | grep -q "\"$key\""; then
              echo "::error::Gate-bypass input '$key' is no longer allowed"
              exit 1
            fi
          done
      - name: Validate approved source identity
        id: validate
        env:
          APPROVED_RC_SHA: ${{ inputs.approved_rc_sha }}
          APPROVED_RELEASE_TAG: ${{ inputs.approved_release_tag }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          if ! [[ "$APPROVED_RC_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::approved_rc_sha must be exactly 40 lowercase hex characters"
            exit 1
          fi
          if [ -n "$APPROVED_RELEASE_TAG" ] && ! [[ "$APPROVED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::approved_release_tag must match ^v[0-9]+\.[0-9]+\.[0-9]+$ or be empty"
            exit 1
          fi
          echo "approved_rc_sha=$APPROVED_RC_SHA" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
      - name: Require HEAD == approved_rc_sha
        env:
          APPROVED_RC_SHA: ${{ steps.validate.outputs.approved_rc_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "$APPROVED_RC_SHA" ]; then
            echo "::error::HEAD ($CHECKED_OUT) != approved_rc_sha ($APPROVED_RC_SHA)"
            exit 1
          fi
      - name: Resolve and pin the release tag
        id: resolve-tag
        env:
          APPROVED_RC_SHA: ${{ steps.validate.outputs.approved_rc_sha }}
          APPROVED_RELEASE_TAG: ${{ inputs.approved_release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          RESOLVED="$(DEPLOY_SHA="$APPROVED_RC_SHA" TAG_WAIT_ATTEMPTS=20 bash .github/scripts/resolve_release_tag.sh)"
          if [ -n "$APPROVED_RELEASE_TAG" ] && [ "$APPROVED_RELEASE_TAG" != "$RESOLVED" ]; then
            echo "::error::approved_release_tag ($APPROVED_RELEASE_TAG) != resolved tag ($RESOLVED)"
            exit 1
          fi
          TAGGED_SHA="$(git rev-parse "refs/tags/${RESOLVED}^{commit}")" || {
            echo "::error::Tag $RESOLVED does not resolve to a commit"
            exit 1
          }
          if [ "$TAGGED_SHA" != "$APPROVED_RC_SHA" ]; then
            echo "::error::Tag $RESOLVED points to $TAGGED_SHA, not $APPROVED_RC_SHA"
            exit 1
          fi
          echo "approved_release_tag=$RESOLVED" >> "$GITHUB_OUTPUT"
      - name: Verify Staging Gate passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ steps.validate.outputs.approved_rc_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Resolving PR head for merge commit $DEPLOY_SHA"
          if ! PULLS_JSON=$(gh api "/repos/$REPO/commits/$DEPLOY_SHA/pulls" 2>gh_api_err.txt); then
            echo "::error::GitHub API lookup failed for $DEPLOY_SHA — transient; re-run this workflow. stderr: $(cat gh_api_err.txt)"
            exit 1
          fi
          PR_HEAD_SHA=$(echo "$PULLS_JSON" \
            | jq -r '[.[] | select(.merge_commit_sha == "'"$DEPLOY_SHA"'") | .head.sha] | first // empty')
          if [ -z "$PR_HEAD_SHA" ]; then
            PR_HEAD_SHA=$(echo "$PULLS_JSON" | jq -r '.[0].head.sha // empty')
          fi
          if [ -z "$PR_HEAD_SHA" ]; then
            echo "::error::No PR associated with $DEPLOY_SHA. Direct pushes to main are not authorized for production."
            exit 1
          fi
          echo "PR head SHA: $PR_HEAD_SHA"
          if ! STATUS=$(gh run list \
            --repo "$REPO" \
            --workflow "Staging Gate" \
            --commit "$PR_HEAD_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | "\(.status):\(.conclusion)"' 2>gh_run_err.txt); then
            echo "::error::GitHub API run lookup failed for $PR_HEAD_SHA — transient; re-run this workflow. stderr: $(cat gh_run_err.txt)"
            exit 1
          fi
          echo "Most recent Staging Gate run on $PR_HEAD_SHA: $STATUS"
          case "$STATUS" in
            completed:success)
              echo "✓ source authorized by the Staging Gate"
              ;;
            ""|"null:null")
              echo "::error::No Staging Gate run found for PR head $PR_HEAD_SHA."
              exit 1
              ;;
            *)
              echo "::error::Staging Gate did not pass for PR head $PR_HEAD_SHA (status=$STATUS)."
              exit 1
              ;;
          esac
      - name: Require a deployed-staging receipt for approved_rc_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_RC_SHA: ${{ steps.validate.outputs.approved_rc_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARTIFACTS=$(gh api "/repos/$REPO/actions/artifacts?name=staging-receipt-${APPROVED_RC_SHA}&per_page=20" --jq '.artifacts | sort_by(.created_at) | reverse | .[0]')
          if [ -z "$ARTIFACTS" ] || [ "$ARTIFACTS" = "null" ]; then
            echo "::error::No staging receipt found for $APPROVED_RC_SHA"
            exit 1
          fi
          ARTIFACT_ID=$(echo "$ARTIFACTS" | jq -r '.id')
          EXPIRED=$(echo "$ARTIFACTS" | jq -r '.expired')
          if [ "$EXPIRED" = "true" ]; then
            echo "::error::Staging receipt for $APPROVED_RC_SHA has expired"
            exit 1
          fi
          echo "::group::Download staging receipt"
          gh api "/repos/$REPO/actions/artifacts/${ARTIFACT_ID}/zip" > receipt.zip
          unzip -o receipt.zip
          echo "::endgroup::"
          python3 tools/staging_receipt.py verify --receipt staging-receipt.json --approved-rc-sha "$APPROVED_RC_SHA" --environment staging --max-age-hours 168

  # The migration gate intentionally runs on a separate runner from the VPS
  # deploy. It receives the prod DB URL but never the SSH key; the deploy job
  # receives the SSH key but never the Doppler token or database URL.
  migration-drift:
    name: Verify production migration drift
    needs: authorize-source
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-source.outputs.approved_rc_sha }}
          persist-credentials: false
      - name: Require HEAD == approved_rc_sha
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-source.outputs.approved_rc_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "$APPROVED_RC_SHA" ]; then
            echo "::error::HEAD ($CHECKED_OUT) != approved_rc_sha ($APPROVED_RC_SHA)"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install hash-locked migration driver
        run: |
          python3 -I -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            -r tools/migration-drift-requirements.txt
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4
      - name: Fetch only the production database URL
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          URL_FILE="$RUNNER_TEMP/prod-db-url"
          URL="$(doppler secrets get NEON_DATABASE_URL --project factorylm --config prd --plain)"
          if [ -z "$URL" ]; then
            echo "::error::empty prod DATABASE_URL (factorylm/prd) — cannot verify drift"
            exit 1
          fi
          echo "::add-mask::$URL"
          printf '%s' "$URL" > "$URL_FILE"
      - name: Verify prod migration drift = 0
        run: |
          set -euo pipefail
          URL_FILE="$RUNNER_TEMP/prod-db-url"
          [ -s "$URL_FILE" ] || { echo "::error::production database URL handoff is missing"; exit 1; }
          URL="$(<"$URL_FILE")"
          trap 'rm -f "$URL_FILE"' EXIT
          if env -i PATH="$PATH" NEON_DATABASE_URL="$URL" \
            python3 -I tools/migration_drift.py | tee /tmp/deploy_drift.out; then
            echo "✓ prod migration drift = 0 — deploy-order verified"
          else
            {
              echo "## ⛔ Deploy blocked — prod is missing a merged migration"
              echo '```'
              cat /tmp/deploy_drift.out
              echo '```'
              echo "Apply first:"
              echo '```'
              echo "gh workflow run apply-migrations.yml -f target=prod -f migrations=all -f mode=dry-run"
              echo "gh workflow run apply-migrations.yml -f target=prod -f migrations=all -f mode=apply"
              echo '```'
              echo "Then re-run this deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Prod has unapplied migration(s); see the job summary."
            exit 1
          fi

  deploy:
    name: Deploy MIRA to production VPS
    needs: [authorize-source, migration-drift]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-source.outputs.approved_rc_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require HEAD == approved_rc_sha
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-source.outputs.approved_rc_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "$APPROVED_RC_SHA" ]; then
            echo "::error::HEAD ($CHECKED_OUT) != approved_rc_sha ($APPROVED_RC_SHA)"
            exit 1
          fi

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      # Pre-deploy log preservation (2026-08-04): the recreate below REMOVES
      # the old containers, and with the json-file driver their logs die with
      # them — the E1 production F004 trace was unrecoverable for exactly this
      # reason. Capture + redact the bot's logs into a finite-retention CI
      # artifact BEFORE the recreate (read-only; never restarts the container).
      # Failure policy (deliberate): capture failure WARNS but never blocks —
      # a deploy is the recovery path during an incident; observability must
      # not gate availability. tools/predeploy_log_capture.sh owns redaction
      # (tokens, Telegram ids, message bodies, UUIDs); the unredacted capture
      # never leaves the runner temp dir.
      - name: Preserve pre-deploy bot logs (redacted)
        continue-on-error: true
        run: |
          SSH_CMD="ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes ubuntu@40.160.141.61" \
          OUT_DIR="$RUNNER_TEMP/predeploy-logs" \
          bash tools/predeploy_log_capture.sh

      - name: Upload pre-deploy log artifact (14-day retention)
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predeploy-bot-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/predeploy-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Deploy
        env:
          SERVICES: ${{ needs.authorize-source.outputs.services }}
          APPROVED_RC_SHA: ${{ needs.authorize-source.outputs.approved_rc_sha }}
          APPROVED_RELEASE_TAG: ${{ needs.authorize-source.outputs.approved_release_tag }}
        run: |
          set -euo pipefail
          ALLOWED_SERVICES="factorylm-foreman mira-ask mira-bot-slack mira-bot-telegram mira-cmms-sync mira-historian-beat mira-historian-worker mira-hub mira-ingest mira-mcp mira-pipeline mira-redis mira-relay mira-synthetic-dogfood-beat mira-synthetic-dogfood-worker mira-tika mira-web nango-db nango-server"
          NORMALIZED_SERVICES=""
          for service in $SERVICES; do
            case " $ALLOWED_SERVICES " in
              *" $service "*) NORMALIZED_SERVICES="${NORMALIZED_SERVICES:+$NORMALIZED_SERVICES }$service" ;;
              *) echo "::error::Unknown deploy service: $service"; exit 1 ;;
            esac
          done
          [[ "$APPROVED_RC_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid approved_rc_sha"; exit 1; }
          [[ "$APPROVED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid approved_release_tag"; exit 1; }
          SERVICES_B64="$(printf '%s' "$NORMALIZED_SERVICES" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes \
            ubuntu@40.160.141.61 "sudo bash -s -- '$SERVICES_B64' '$APPROVED_RC_SHA' '$APPROVED_RELEASE_TAG'" << 'ENDSSH' 2>&1 | tee "$RUNNER_TEMP/deploy.out"

          set -euo pipefail
          SERVICES="$(printf '%s' "$1" | base64 -d)"
          APPROVED_RC_SHA="$2"
          APPROVED_RELEASE_TAG="$3"
          cd /opt/mira

          # Signal "deploy in progress" so the heartbeat + self-healer crons stand
          # down instead of racing this deploy's container recreate and firing
          # false 502/container-missing escalations every 15 min (incident
          # 2026-07-08). Removed on exit (success OR failure) via trap; the healer
          # also ages out a stale sentinel after 30 min in case this trap is missed.
          touch /opt/mira/.deploy-in-progress
          trap 'rm -f /opt/mira/.deploy-in-progress' EXIT

          echo "=== Rollback anchor (the code running BEFORE this deploy) ==="
          PRIOR_SHA="$(git rev-parse HEAD)"
          PRIOR_TAG="$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)"
          echo "Prior: sha=${PRIOR_SHA} tag=${PRIOR_TAG:-<none>}"

          echo "=== Pull code — the exact approved RC SHA, never a moving ref (#3910) ==="
          # Deploy ONE immutable commit: the approved RC SHA. The release tag must
          # point AT it; the SHA itself is what gets checked out (the tag is a
          # label for /api/version + rollback, not the anchor). Never a moving ref.
          git fetch origin --tags --force
          git fetch origin "$APPROVED_RC_SHA"
          if ! git cat-file -e "${APPROVED_RC_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Approved SHA ${APPROVED_RC_SHA} not present after fetch — refusing to deploy an unknown ref."
            exit 1
          fi
          git show "${APPROVED_RC_SHA}:.github/scripts/resolve_release_tag.sh" > /tmp/resolve_release_tag.sh \
            || { echo "::error::resolve_release_tag.sh missing at ${APPROVED_RC_SHA} — cannot verify release identity; failing closed."; exit 1; }
          RELEASE_TAG="$(DEPLOY_SHA="$APPROVED_RC_SHA" bash /tmp/resolve_release_tag.sh)"
          if [ "$RELEASE_TAG" != "$APPROVED_RELEASE_TAG" ]; then
            echo "::error::Resolved release tag '${RELEASE_TAG}' != authorized '${APPROVED_RELEASE_TAG}' — failing closed."
            exit 1
          fi
          TAGGED_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$TAGGED_SHA" != "$APPROVED_RC_SHA" ]; then
            echo "::error::Release tag ${RELEASE_TAG} points at ${TAGGED_SHA}, not ${APPROVED_RC_SHA} — failing closed."
            exit 1
          fi
          echo "Deploying ${APPROVED_RC_SHA} (release tag ${RELEASE_TAG})"
          git -c advice.detachedHead=false checkout --force "$APPROVED_RC_SHA"
          if [ "$(git rev-parse HEAD)" != "$APPROVED_RC_SHA" ]; then
            echo "::error::Checkout did not land on ${APPROVED_RC_SHA} — failing closed."
            exit 1
          fi

          echo "=== Host permission setup (chown saas data dirs to UID 1001) ==="
          # PR #1219 dropped root in mira-pipeline/mira-mcp/mira-ingest Dockerfiles.
          # Host bind-mounts must match or containers crash-loop on SQLite WAL.
          # Script is idempotent — safe on every deploy. See incident 2026-05-15.
          bash scripts/host_perm_setup.sh

          echo "=== Reinstall agent crontab (keep host crons in sync with repo) ==="
          # The crontab is a deployed artifact like everything else: install_crons.sh
          # is the source of truth for every agent schedule (and, since 2026-07-08, the
          # -e TELEGRAM_ALERT_* forwards that route the 3 container agents' ops traffic
          # to the alert bot instead of @FactoryLM_Diagnose). Without this step the
          # crontab silently drifts from the repo and every cron change needs a manual
          # SSH. Idempotent — replaces the full crontab cleanly. Non-fatal: a cron
          # hiccup must not block the service deploy (container rebuild is the critical
          # path), so warn-don't-fail, mirroring the hub health check below.
          # install_crons.sh (full agent crontab) intentionally NOT run in the
          # minimal Hub+web production model (#3800) — those crons expect
          # pipeline/bots/etc. that are not deployed. Restored with the full stack.
          echo "skipping install_crons.sh (minimal Hub+web model, #3800)"

          # Resolve the rebuild list once so cleanup + build + up all agree.
          # mira-ask added 2026-06-06 (closes ops gap surfaced by AskMira P0 fix
          # cycle — engine changes shipped to telegram/slack but mira-ask-saas
          # stayed on the old image because it was missing from this default
          # list). See docs/runbooks/kiosk-askmira-deploy-and-verify.md.
          # mira-web added 2026-07-04 - no stated exclusion rationale existed
          # (docs/known-issues.md); marketing-site PRs silently did not auto-deploy.
          TARGETS="${SERVICES:-mira-hub mira-web}"  # #3800 OVH cutover: minimal Hub+web; other services deferred
          echo "Rebuild targets: $TARGETS"

          # NOTE (2026-08-09): the stale-container cleanup that used to run HERE has
          # moved below, into a fallback that only fires if `up` actually fails.
          #
          # It used to `docker rm -f` every target BEFORE `docker compose build`, so
          # the live containers were destroyed and the site stayed dark for
          # build-time + boot-time. With a warm layer cache that is ~15s; on a cold
          # build it is minutes of hard downtime. Measured 2026-08-09: four merges to
          # main inside 40 minutes produced four separate outage windows on BOTH
          # app.factorylm.com (mira-hub, :3101) and factorylm.com (mira-web, :3200) —
          # nginx logging `connect() failed (111: Connection refused)` each time.
          #
          # The old containers now keep serving through the entire build, and are
          # replaced only at the `up` below, which is health-gated via --wait.
          stale_cleanup() {
            echo "=== Removing stale containers that block recreate ==="
            # `docker compose up --force-recreate` only removes containers it considers part
            # of the project; if a previous deploy left a same-named container that compose
            # has lost track of, we hit `Error: container name already in use` and the deploy
            # bails out (exact failure mode of run 25264673954, 2026-05-02). That failure is
            # rare, so it is now a RECOVERY path rather than an unconditional teardown.
            for svc in $TARGETS; do
              # container_name in saas.yml is sometimes bare (mira-hub,
              # mira-bot-telegram), sometimes -saas suffixed. Try both.
              docker rm -f "${svc}-saas" 2>/dev/null || true
              docker rm -f "${svc}" 2>/dev/null || true
            done
          }

          # OW sunset (2026-07-29, v3.226.7): the mira-core (Open WebUI) service was
          # removed from docker-compose.saas.yml; compose no longer manages it, so
          # without this it would linger as a running orphan. `docker rm` does NOT
          # touch the mira-webui-data named volume (kept for feedback_sync ro-mount).
          docker rm -f mira-core-saas 2>/dev/null || true

          # Deploy identity (#2226) — bake the SHA/version/time into the hub image
          # so /api/version + /api/health report which code is live. Exported here
          # so docker-compose build.args pick them up; default "unknown" otherwise.
          export MIRA_GIT_SHA="$APPROVED_RC_SHA"
          # `/VERSION` was retired 2026-08-02 (#3064) — the version is DERIVED from
          # the release tag, which was verified above to point AT the approved SHA.
          export MIRA_APP_VERSION="${RELEASE_TAG#v}"
          export MIRA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploy identity: sha=${MIRA_GIT_SHA} version=${MIRA_APP_VERSION} built=${MIRA_BUILD_TIME}"

          echo "=== Build images (old containers keep serving) ==="
          # Build BEFORE any teardown. Nothing user-facing is interrupted here.
          # --no-cache --pull: no stale local layer and a fresh base image, so the
          # image is built from the approved source (exact source provenance; base
          # images and dependency fallbacks remain mutable inputs — this is NOT a
          # reproducible-build claim).
          DOCKER_BUILDKIT=1 doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml -f docker-compose.production.yml build --no-cache --pull $TARGETS

          echo "=== Built image identities ==="
          BUILT_IDS="$(mktemp)"
          for svc in $TARGETS; do
            img="$(doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml -f docker-compose.production.yml config --images "$svc" | head -1)"
            [ -n "$img" ] || { echo "::error::compose reports no image for ${svc} — failing closed."; exit 1; }
            id="$(docker image inspect --format '{{.Id}}' "$img")"
            [ -n "$id" ] || { echo "::error::no built image id for ${svc} (${img}) — failing closed."; exit 1; }
            echo "${svc}=${id}" | tee -a "$BUILT_IDS"
          done

          echo "=== Swap to new containers (health-gated) ==="
          # --wait blocks until every recreated service is healthy (8 of the 9 targets
          # declare a healthcheck in docker-compose.saas.yml; mira-cmms-sync has none,
          # for which --wait means "running"). This turns the swap into a gate: a
          # container that boots broken now FAILS the deploy loudly instead of being
          # declared deployed and discovered later by a user.
          #
          # Downtime is now bounded by container boot, not boot+build. This is NOT
          # zero-downtime — nginx still proxies to a single fixed port per service
          # (127.0.0.1:3101 hub, :3200 web), so there is a short refused-connection
          # window while the new container binds. Closing that needs a blue/green
          # upstream switch in nginx, which is blocked on cleaning up
          # /etc/nginx/sites-enabled/ first: it is included as a bare wildcard
          # (`include /etc/nginx/sites-enabled/*;`) and currently contains 8 stale
          # `.bak` files that are LIVE config, with nginx logging
          # `conflicting server name "app.factorylm.com" ... ignored`. Editing a
          # server block there before that cleanup risks changing a block that loses
          # to another one — a change that looks applied and isn't.
          # Capability-detect rather than assume: `--wait` landed in compose v2.1.1 and
          # `--wait-timeout` later still. Hard-coding a flag this host might not accept
          # would turn every deploy into an instant failure, so probe once and degrade
          # to a plain up + explicit health poll if it is missing.
          WAIT_FLAGS=""
          if docker compose up --help 2>&1 | grep -q -- '--wait-timeout'; then
            WAIT_FLAGS="--wait --wait-timeout 300"
          elif docker compose up --help 2>&1 | grep -q -- '--wait'; then
            WAIT_FLAGS="--wait"
          fi
          echo "Swap flags: ${WAIT_FLAGS:-<none: compose too old, falling back to health poll below>}"

          # The recovery path is gated on the SPECIFIC failure it exists for — a compose
          # name conflict — and nothing else.
          #
          # `--wait` exits non-zero on health timeout too, and by then compose has ALREADY
          # recreated the containers. So treating any non-zero exit as "run stale_cleanup
          # and retry" would `docker rm -f` all nine live containers and cold-recreate
          # them, turning one slow-to-health service into a longer outage than the bug
          # this PR fixes. Hub health is known-marginal on this host (hence the retry loop
          # below), so that is not a hypothetical.
          #
          # Any other non-zero exit fails the deploy loudly. Red is the correct outcome
          # there: a human needs to look, and the old containers are already gone.
          #
          # `| tee` so the swap STREAMS: each Recreate/Started/Healthy line is timestamped
          # by the runner as it happens. A previous revision redirected to a file and
          # `cat`-ed it afterwards, which stamped all nine containers' lifecycle lines with
          # one identical timestamp (1.7 ms apart in run 31345016124) — destroying the
          # per-line timing of precisely the phase whose duration this work is about, and
          # producing ZERO output at all if the swap ever hangs until the job times out.
          #
          # `tee` is safe for the status read here because `set -o pipefail` is in effect
          # (top of this script), so the pipeline reports compose's non-zero status. What
          # is NOT safe — and was the reason for the earlier redirect — is reading `$?` or
          # `PIPESTATUS` *after* an `if cmd | tee; then ...; fi` block: those reflect the
          # block's last command, not the condition, and silently read 0. Capturing with
          # `|| rc=$?` directly on the pipeline has no such trap.
          swap_out=$(mktemp)
          swap_rc=0
          # shellcheck disable=SC2086  # WAIT_FLAGS and TARGETS are intentionally word-split
          doppler run --project factorylm --config prd -- \
            docker compose -f docker-compose.saas.yml -f docker-compose.production.yml up -d --no-deps --force-recreate \
            $WAIT_FLAGS $TARGETS 2>&1 | tee "$swap_out" || swap_rc=$?

          if [ "$swap_rc" -ne 0 ]; then
            if grep -qiE 'name .* already in use|Conflict\.|container name .* is already in use' "$swap_out"; then
              echo "Swap hit a compose name conflict (rc=$swap_rc) — clearing stale containers and retrying once"
              stale_cleanup
              # shellcheck disable=SC2086
              doppler run --project factorylm --config prd -- \
                docker compose -f docker-compose.saas.yml -f docker-compose.production.yml up -d --no-deps --force-recreate \
                $WAIT_FLAGS $TARGETS
            else
              echo "ERROR: health-gated swap failed (rc=$swap_rc) and it is NOT a name conflict."
              echo "Not tearing down containers — that would deepen the outage, not fix it."
              echo "Container state:"
              # shellcheck disable=SC2086
              docker compose -f docker-compose.saas.yml ps $TARGETS || true
              rm -f "$swap_out"
              exit "$swap_rc"
            fi
          fi
          rm -f "$swap_out"

          echo "=== Running image identities must equal the built ones ==="
          RUNNING_IDS="$(mktemp)"
          for svc in $TARGETS; do
            cid="$(doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml -f docker-compose.production.yml ps -q "$svc")"
            [ -n "$cid" ] || { echo "::error::no running container for ${svc} after the swap — failing closed."; exit 1; }
            running="$(docker inspect --format '{{.Image}}' "$cid")"
            built="$(grep "^${svc}=" "$BUILT_IDS" | cut -d= -f2-)"
            if [ -z "$running" ] || [ "$running" != "$built" ]; then
              echo "::error::built/running image mismatch for ${svc}: built=${built} running=${running} — STOP. Rollback anchor: ${PRIOR_TAG:-<none>} @ ${PRIOR_SHA}"
              exit 1
            fi
            echo "${svc}=${running}" | tee -a "$RUNNING_IDS"
          done

          echo "=== Health check ==="
          # Only check mira-pipeline if it was in the deploy targets (minimal Hub+web does not include it)
          if echo " $TARGETS " | grep -q " mira-pipeline "; then
            sleep 8
            STATUS=$(curl -sf http://localhost:9099/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "mira-pipeline health: $STATUS"
            if [ "$STATUS" != "ok" ]; then
              echo "WARNING: health check returned $STATUS — check container logs"
              doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml logs --tail=20 mira-pipeline
              exit 1
            fi
          else
            echo "mira-pipeline: not in deploy targets, skipping health check"
          fi

          echo "=== mira-hub health check ==="
          # Try empty-basePath path first (current Phase 2 deployment), fall back to /hub
          # path so the check survives a future re-cutover. Mirrors the Dockerfile
          # HEALTHCHECK fallback pattern. Closes #928.
          # Retry rather than single-shot: --wait above already gated on the container
          # healthcheck, so a miss here is almost always "probed a fraction of a second
          # too early", which used to print a scary WARNING on a perfectly good deploy.
          #
          # `-L` is load-bearing (2026-08-09). The hub is a Next.js app with trailing-slash
          # redirects on, so /api/health answers 308 -> /api/health/. Without -L this check
          # reported 308 on all five attempts and printed
          #   WARNING: mira-hub health returned 308
          # on a hub that was perfectly healthy — `curl -L` against the same URL returns
          # 200. The fallback below could not rescue it either: `-f` only fails on >=400,
          # so a 308 exits 0 and the `||` never fires, leaving the /hub path untried. The
          # net effect was a health check that could not pass and a warning nobody could
          # act on — the kind of alarm that trains people to ignore alarms.
          HUB_STATUS="unreachable"
          for attempt in 1 2 3 4 5; do
            HUB_STATUS=$(curl -sfL -o /dev/null -w "%{http_code}" http://127.0.0.1:3101/api/health \
              || curl -sfL -o /dev/null -w "%{http_code}" http://127.0.0.1:3101/hub/api/health \
              || echo "unreachable")
            [ "$HUB_STATUS" = "200" ] && break
            echo "  attempt $attempt: mira-hub health=$HUB_STATUS — retrying in 3s"
            sleep 3
          done
          echo "mira-hub health: $HUB_STATUS"
          HUB_GIT_SHA=""
          if echo " $TARGETS " | grep -q " mira-hub "; then
            if [ "$HUB_STATUS" != "200" ]; then
              echo "::error::mira-hub health returned $HUB_STATUS — STOP. Rollback anchor: ${PRIOR_TAG:-<none>} @ ${PRIOR_SHA}"
              doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml logs --tail=20 mira-hub
              exit 1
            fi
            echo "=== mira-hub runtime identity ==="
            HUB_GIT_SHA="$(curl -sfL http://127.0.0.1:3101/api/version | python3 -c "import sys,json; print(json.load(sys.stdin).get('gitSha',''))")"
            if [ "$HUB_GIT_SHA" != "$APPROVED_RC_SHA" ]; then
              echo "::error::mira-hub runtime gitSha '${HUB_GIT_SHA}' != approved ${APPROVED_RC_SHA} — STOP. Rollback anchor: ${PRIOR_TAG:-<none>} @ ${PRIOR_SHA}"
              exit 1
            fi
            echo "mira-hub reports gitSha=${HUB_GIT_SHA} (== approved)"
          else
            echo "mira-hub: not in deploy targets, skipping identity check"
          fi

          WEB_GIT_SHA=""
          if echo " $TARGETS " | grep -q " mira-web "; then
            echo "=== mira-web runtime identity ==="
            WEB_GIT_SHA="$(curl -sfL http://127.0.0.1:3200/api/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('gitSha',''))")"
            if [ "$WEB_GIT_SHA" != "$APPROVED_RC_SHA" ]; then
              echo "::error::mira-web runtime gitSha '${WEB_GIT_SHA}' != approved ${APPROVED_RC_SHA} — STOP. Rollback anchor: ${PRIOR_TAG:-<none>} @ ${PRIOR_SHA}"
              exit 1
            fi
            echo "mira-web reports gitSha=${WEB_GIT_SHA} (== approved)"
          else
            echo "mira-web: not in deploy targets, skipping identity check"
          fi

          echo "=== Deploy complete ==="
          doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml ps --format "table {{.Name}}\t{{.Status}}"

          # One-line machine-readable receipt; the runner extracts, verifies and
          # uploads it as the durable production-receipt-<sha> artifact.
          BUILT_IDS="$BUILT_IDS" RUNNING_IDS="$RUNNING_IDS" \
          APPROVED_RC_SHA="$APPROVED_RC_SHA" RELEASE_TAG="$RELEASE_TAG" \
          HUB_GIT_SHA="$HUB_GIT_SHA" WEB_GIT_SHA="$WEB_GIT_SHA" \
          PRIOR_SHA="$PRIOR_SHA" PRIOR_TAG="$PRIOR_TAG" \
          python3 - <<'PYRECEIPT'
          import json, os, datetime
          def pairs(path):
              out = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if "=" in line:
                          k, v = line.split("=", 1)
                          out[k] = v
              return out
          receipt = {
              "schema": "factorylm.deploy-receipt/1",
              "environment": "production",
              "approved_rc_sha": os.environ["APPROVED_RC_SHA"],
              "release_tag": os.environ["RELEASE_TAG"],
              # Only surfaces that were deployed AND answered are reported; the
              # verifier treats every reported value as mandatory-equal and never
              # lets one matching surface stand in for a missing one.
              "runtime": {
                  svc: sha
                  for svc, sha in (("mira-hub", os.environ.get("HUB_GIT_SHA", "")), ("mira-web", os.environ.get("WEB_GIT_SHA", "")))
                  if sha
              },
              "built_images": pairs(os.environ["BUILT_IDS"]),
              "running_images": pairs(os.environ["RUNNING_IDS"]),
              "target": {"host": "40.160.141.61", "compose": "docker-compose.saas.yml+docker-compose.production.yml"},
              "prior": {"sha": os.environ["PRIOR_SHA"], "tag": os.environ.get("PRIOR_TAG") or None},
              "deployed_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          print("FACTORYLM_DEPLOY_RECEIPT_JSON=" + json.dumps(receipt, separators=(",", ":"), sort_keys=True))
          PYRECEIPT
          rm -f "$BUILT_IDS" "$RUNNING_IDS"
          ENDSSH

      - name: Extract and verify the production receipt
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-source.outputs.approved_rc_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/staging_receipt.py extract --log "$RUNNER_TEMP/deploy.out" --out production-receipt.json \
            --set "run_url=$RUN_URL" --set "run_id=$RUN_ID"
          python3 tools/staging_receipt.py verify --receipt production-receipt.json \
            --approved-rc-sha "$APPROVED_RC_SHA" --environment production --max-age-hours 1 \
            --require-services ""

      - name: Upload production receipt (90-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-receipt-${{ needs.authorize-source.outputs.approved_rc_sha }}
          path: production-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: nginx sites-enabled hygiene (#3173)
        # READ-ONLY. /etc/nginx/nginx.conf includes sites-enabled/ by a BARE
        # wildcard, so every file there is live production config — a stray
        # `cp mira mira.bak` silently becomes a duplicate server block, and
        # nginx keeps whichever sorts FIRST. The only native signal is a
        # `[warn]` line nobody reads, so this asserts it on every deploy.
        #
        # Default-deny by NAME. Not `*.conf` (no live vhost has that suffix —
        # requiring it would disable all of them) and not "must be a symlink"
        # (`cmms.factorylm.com` and `factorylm-landing` are regular files and
        # are live). Rationale in full: nginx-sites-enabled-hygiene.yml.
        #
        # KNOWN_PENDING is the 10 backups that already existed when this guard
        # shipped (verified on prod 2026-08-10). They warn; anything NOT in that
        # list FAILS the deploy, so the hole is closed for new occurrences today
        # without breaking deploys on pre-existing state. Run
        # nginx-sites-enabled-hygiene.yml (mode=fix) to clear them, then DELETE
        # KNOWN_PENDING here — the guard then becomes strict on its own.
        run: |
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes \
            ubuntu@40.160.141.61 'sudo bash -s' << 'ENDSSH'
          set -uo pipefail
          SE=/etc/nginx/sites-enabled
          ALLOW="cmms.factorylm.com factorylm factorylm-landing factorylm-paths mira plane preview recovery-ovh remoteme stg-factorylm updates.factorylm.com"
          KNOWN_PENDING="factorylm-landing.bak.2026-05-13-csp factorylm-landing.bak.20260509-203650 mira.bak.20260426-082325 mira.bak.20260506-094431 mira.bak.20260509-121505 mira.bak.before-scan-restore-20260518-215310 mira.bak.cra-20260504-024235 mira.bak.inbox mira.bak.phase1 mira.bak.scan-deploy-20260504-224027"

          known=""; unknown=""
          for f in "$SE"/*; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case " $ALLOW " in *" $b "*) continue ;; esac
            case " $KNOWN_PENDING " in
              *" $b "*) known="$known $b" ;;
              *)        unknown="$unknown $b" ;;
            esac
          done
          known=$(echo "$known" | xargs || true)
          unknown=$(echo "$unknown" | xargs || true)

          if [ -n "$unknown" ]; then
            echo "::error::NEW unexpected file(s) in $SE are live nginx config: $unknown"
            echo "::error::A duplicate server block can silently take over a production hostname (#3173)."
            echo "::error::Move it out (or add it to ALLOW if it is a real vhost), then re-run."
            ls -la "$SE"
            exit 1
          fi

          if [ -n "$known" ]; then
            echo "::warning::$(echo "$known" | wc -w) known pre-existing backup(s) still live in $SE (#3173): $known"
            echo "::warning::Clear with nginx-sites-enabled-hygiene.yml (mode=fix), then drop KNOWN_PENDING from deploy-vps.yml."
          else
            echo "✅ $SE is clean — #3173 is done; DELETE KNOWN_PENDING from deploy-vps.yml to make this guard strict."
          fi
          ENDSSH

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::VPS deploy failed — check logs above (the 'Rollback anchor' line names the prior tag/SHA). SSH to 40.160.141.61 (ubuntu) and run:"
          echo "::error::  cd /opt/mira && doppler run --project factorylm --config prd -- docker compose -f docker-compose.saas.yml logs --tail=50"
