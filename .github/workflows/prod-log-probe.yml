# Read-only production diagnostics through a fixed menu of probes (#5205, #5198).
#
# Agents may not run docker or ssh against the VPS directly, and the CMMS failures
# in #5205 are only visible in the mira-hub container log. This workflow is the
# sanctioned read path. It is deliberately narrow because this repository is PUBLIC
# and Actions logs are world-readable:
#
#   - No free-form input. `probe` is a choice; each choice maps to one fixed
#     command below. Nothing from the dispatcher reaches the remote shell.
#   - Log probes return only lines carrying one known log tag plus the
#     stack-frame/cause/code lines directly after it (never arbitrary
#     neighbouring lines), capped at 60 lines from the last 6 hours.
#   - Any line naming a credential is cut from that word to the end of the
#     line (fail-closed), then goes through the shared, tested redactor
#     (tools/qa/redact_ci_log.sh) and then probe-only scrubs for email
#     addresses, IPv4 addresses and long opaque strings.
#   - A failed read fails the run with a fixed message; an empty result says
#     "read OK: no lines" so the two can never be confused.
#   - The backup probe lists file names and sizes only, never contents.
#   - The Atlas error probe returns only exception class names (from anchored
#     header lines) and Atlas (com.grash) stack-frame locations, never
#     exception message text, which can quote stored records. The filter is
#     tested end to end by tests/beta/test_prod_log_probe_atlas_filter.py.
#
# Nothing on the host is changed. Rollback: delete this file.
name: Production log probe (read-only)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which fixed, read-only probe to run"
        type: choice
        options:
          - hub-cmms-stats
          - hub-cmms-dispatch
          - atlas-backups
          - atlas-api-errors
          - stg-atlas-signin
        default: hub-cmms-stats

permissions:
  contents: read

concurrency:
  group: prod-log-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate probe input
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          case "$PROBE" in
            hub-cmms-stats|hub-cmms-dispatch|atlas-backups|atlas-api-errors|stg-atlas-signin) ;;
            *) echo "::error::invalid probe '$PROBE'"; exit 1 ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Run probe (read-only, redacted)
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          # The remote side receives only the validated probe name. A failed
          # read exits nonzero (3) with a fixed message; the run fails AFTER
          # the redacted output is printed, never silently "succeeds".
          rc=0
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            ubuntu@40.160.141.61 "sudo bash -s -- '${PROBE}'" << 'ENDSSH' > "$RUNNER_TEMP/probe.raw" 2>&1 || rc=$?
          set -uo pipefail
          tagged() {  # container, fixed tag
            local all hits
            if ! all="$(docker logs --since 6h "$1" 2>&1)"; then
              echo "PROBE FAILED: could not read the $1 container log"
              exit 3
            fi
            # Only the tagged line itself and the stack-frame / cause / code
            # lines right after it are kept — never arbitrary neighbouring
            # log lines.
            hits="$(printf '%s\n' "$all" | grep -F -A3 -- "$2" \
              | awk -v tag="$2" 'index($0, tag) > 0 || /^[ \t]+at / || /^[ \t]*(\[cause\]|cause:|code:|status:|errno:)/ || $0 == "--"' \
              | tail -n 60 || true)"
            if [ -z "$hits" ]; then echo "read OK: no lines tagged $2 in the last 6h"; else printf '%s\n' "$hits"; fi
          }
          atlas_exceptions() {  # container: exception class names + com.grash frames only
            local all hits
            if ! all="$(docker logs --since 6h "$1" 2>&1)"; then
              echo "PROBE FAILED: could not read the $1 container log"
              exit 3
            fi
            # BEGIN atlas-exception-filter
            hits="$(printf '%s\n' "$all" | sed -nE -e 's/^(Caused by: )?((java|javax|jakarta|org|com|io|net)(\.[a-z][a-z0-9_]*)+\.[A-Z][A-Za-z0-9_$]*(Exception|Error))(: .*)?$/\2/p' -e 's/^[[:space:]]+(at com\.grash\.[A-Za-z0-9_.$]+\([A-Za-z0-9_]+\.java:[0-9]+\))[[:space:]]*$/\1/p' | uniq -c | tail -n 80 || true)"
            # END atlas-exception-filter
            if [ -z "$hits" ]; then echo "read OK: no exception lines in the last 6h"; else printf '%s\n' "$hits"; fi
          }
          case "$1" in
            hub-cmms-stats)    tagged mira-hub '[api/cmms/stats]' ;;
            hub-cmms-dispatch) tagged mira-hub '[cmms-dispatch]' ;;
            atlas-backups)
              dir=/opt/mira-cmms/backups
              [ -d "$dir" ] || { echo "PROBE FAILED: $dir does not exist"; exit 3; }
              names="$(ls -1 "$dir")" || { echo "PROBE FAILED: could not list $dir"; exit 3; }
              latest="$(printf '%s\n' "$names" | sed '/^$/d' | sort | tail -n 1)"
              echo "backup folders: $(printf '%s\n' "$names" | sed '/^$/d' | wc -l)"
              echo "latest: ${latest:-none}"
              if [ -n "$latest" ]; then
                listing="$(ls -l --time-style=+%FT%TZ "$dir/$latest")" || { echo "PROBE FAILED: could not list the latest backup"; exit 3; }
                printf '%s\n' "$listing" | awk 'NR>1 {print $5, $6, $7}'
              fi
              if [ -f /opt/mira-cmms/docker-compose.prod.yml ]; then echo "installed compose present"; else echo "installed compose MISSING"; fi
              if [ -f /opt/mira-cmms/atlas-version-rollback.sh ]; then echo "rollback script present"; else echo "rollback script MISSING"; fi
              ;;
            atlas-api-errors)
              # #5205: Atlas answers some Hub searches with 500. Only two
              # anchored line shapes are kept, and from each only the
              # structural token: an exception header at the start of a line
              # (optionally "Caused by: ") whose class sits under a known
              # package root, and an Atlas (com.grash) stack frame. Message
              # text is never searched, so nothing class-shaped inside a
              # message can surface. Repeat-counted, last 80 lines.
              atlas_exceptions cmms-backend
              ;;
            stg-atlas-signin)
              # #5205 staging half: the staging Hub's Atlas sign-in gets 403,
              # which Atlas returns for an unknown user, a wrong password, a
              # disabled user or a wrong role type alike. Report only
              # container state and row COUNTS from the staging Atlas DB
              # (never an email, name or hash), plus exception class names
              # from the staging Atlas log, using the same anchored filter.
              for c in stg-atlas-api stg-atlas-db; do
                st="$(docker inspect -f '{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}}' "$c" 2>/dev/null)" \
                  || { echo "PROBE FAILED: container $c not found"; exit 3; }
                echo "$c: $st"
              done
              counts="$(docker exec stg-atlas-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " " -c "select count(*), count(*) filter (where enabled), count(*) filter (where not enabled) from own_user"' 2>/dev/null)" \
                || { echo "PROBE FAILED: could not count staging Atlas users"; exit 3; }
              echo "own_user total enabled disabled: $counts"
              atlas_exceptions stg-atlas-api
              ;;
          esac
          ENDSSH
          # Fail-closed first: on any line that names a credential, everything
          # from that word to the end of the line is dropped, so an escaped or
          # truncated quote can never leave part of a value behind. Then the
          # shared, tested credential redactor (tests/beta/test_redact_ci_log.py)
          # and probe-only scrubs: email addresses, IPv4 addresses, and any long
          # opaque run that could be an unlabelled key.
          sed -E 's/(password|passwd|secret|token|api[_-]?key|authorization|bearer|basic|cookie|session).*$/\1 [redacted to end of line]/I' "$RUNNER_TEMP/probe.raw" \
            | bash tools/qa/redact_ci_log.sh \
            | sed -E \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' \
                -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ip]/g' \
                -e 's/[A-Za-z0-9_+=-]{32,}/[redacted]/g'
          if [ "$rc" -ne 0 ]; then echo "::error::probe '$PROBE' failed (exit $rc)"; exit "$rc"; fi
