# Read-only production diagnostics through a fixed menu of probes (#5205, #5198).
#
# Agents may not run docker or ssh against the VPS directly, and the CMMS failures
# in #5205 are only visible in the mira-hub container log. This workflow is the
# sanctioned read path. It is deliberately narrow because this repository is PUBLIC
# and Actions logs are world-readable:
#
#   - No free-form input. `probe` is a choice; each choice maps to one fixed
#     command below. Nothing from the dispatcher reaches the remote shell.
#   - Log probes return only lines carrying one known log tag (plus 3 lines of
#     context for stack frames), capped at 60 lines from the last 6 hours.
#   - Every line is redacted before printing: JWTs, Bearer/Basic credentials,
#     key=value secrets, email addresses and IPv4 addresses.
#   - The backup probe lists file names and sizes only, never contents.
#
# Nothing on the host is changed. Rollback: delete this file.
name: Production log probe (read-only)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which fixed, read-only probe to run"
        type: choice
        options:
          - hub-cmms-stats
          - hub-cmms-dispatch
          - atlas-backups
        default: hub-cmms-stats

permissions:
  contents: read

concurrency:
  group: prod-log-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate probe input
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          case "$PROBE" in
            hub-cmms-stats|hub-cmms-dispatch|atlas-backups) ;;
            *) echo "::error::invalid probe '$PROBE'"; exit 1 ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Run probe (read-only, redacted)
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          # The remote side receives only the validated probe name.
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            ubuntu@40.160.141.61 "sudo bash -s -- '${PROBE}'" << 'ENDSSH' > "$RUNNER_TEMP/probe.raw"
          set -uo pipefail
          tagged() {  # container, fixed tag
            docker logs --since 6h "$1" 2>&1 | grep -F -A3 -- "$2" | tail -n 60
          }
          case "$1" in
            hub-cmms-stats)    tagged mira-hub '[api/cmms/stats]' ;;
            hub-cmms-dispatch) tagged mira-hub '[cmms-dispatch]' ;;
            atlas-backups)
              latest="$(ls -1 /opt/mira-cmms/backups 2>/dev/null | sort | tail -n 1)"
              echo "backups dir entries: $(ls -1 /opt/mira-cmms/backups 2>/dev/null | wc -l)"
              echo "latest: ${latest:-<none>}"
              [ -n "$latest" ] && ls -l --time-style=+%FT%TZ "/opt/mira-cmms/backups/$latest" | awk 'NR>1 {print $5, $6, $7}'
              [ -f /opt/mira-cmms/docker-compose.prod.yml ] && echo "installed compose present" || echo "installed compose MISSING"
              [ -f /opt/mira-cmms/atlas-version-rollback.sh ] && echo "rollback script present" || echo "rollback script MISSING"
              ;;
          esac
          echo "probe exit: done"
          ENDSSH
          sed -E \
            -e 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/[JWT]/g' \
            -e 's/((Bearer|Basic)[[:space:]]+)[A-Za-z0-9._~+\/=-]+/\1[REDACTED]/g' \
            -e 's/((password|passwd|secret|token|apikey|api_key|authorization)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?)[^"'"'"'[:space:],}]+/\1[REDACTED]/Ig' \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g' \
            -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g' \
            "$RUNNER_TEMP/probe.raw"
