name: Version Gate

# Every code PR to main MUST bump the repo-wide /VERSION counter (semver).
# This guarantees the overall version always advances on merge, so every
# merge is uniquely tagged + rollback-able (see .github/workflows/version-tag.yml
# and docs/versioning.md).
#
# Designed to be SAFE as a REQUIRED status check: the job ALWAYS runs and
# reports a status on every PR. It only *requires* a bump when the PR changes
# code — docs/markdown/CHANGELOG/VERSION-only PRs pass without a bump, so a
# required check never deadlocks a docs PR (same pattern as Hub Unit Tests).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bump:
    name: Version Bump Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require /VERSION bump for code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          BASE="origin/$BASE_REF"
          MERGE_BASE="$(git merge-base "$BASE" HEAD)"

          # Files this PR changes vs the merge-base.
          CHANGED="$(git diff --name-only "$MERGE_BASE"...HEAD)"
          echo "Changed files:"; echo "$CHANGED"

          # Docs/config-only changes don't require a version bump.
          # (markdown, text, the changelogs, the VERSION file itself, LICENSE,
          #  promo screenshots, and the wiki/docs trees.)
          CODE="$(echo "$CHANGED" | grep -vE '(^docs/|^wiki/|(^|/)CHANGELOG|\.md$|\.mdx$|\.txt$|^VERSION$|^LICENSE$|^docs/promo-screenshots/)' || true)"

          if [ -z "$CODE" ]; then
            echo "✓ Docs/config-only PR — no VERSION bump required."
            exit 0
          fi

          # A changelog FRAGMENT satisfies the gate as an alternative to bumping
          # /VERSION. Both paths are accepted — no flag day, and the ~30 PRs in
          # flight keep working untouched.
          #
          # Why offer it: /VERSION is one monotonic line and docs/CHANGELOG.md is
          # prepended to at the top, so every PR edits the SAME line of the SAME
          # file. Each merge to main therefore conflicts every other open PR, and
          # a conflicting PR gets NO CI at all (GitHub can't build the merge ref)
          # — so it silently stops being verified while still looking healthy.
          # Observed twice within an hour on 2026-07-29. A fragment is a new file
          # per change, so PRs never collide. See changelog.d/README.md.
          NEW_FRAGMENTS="$(git diff --name-only --diff-filter=A "$MERGE_BASE"...HEAD \
            -- 'changelog.d/*.md' | grep -viE '(^|/)README\.md$' || true)"
          if [ -n "$NEW_FRAGMENTS" ]; then
            echo "✓ Changelog fragment(s) added — VERSION bump not required:"
            echo "$NEW_FRAGMENTS" | sed 's/^/    /'
            exit 0
          fi

          BASE_VER="$(git show "$MERGE_BASE:VERSION" 2>/dev/null | tr -d '[:space:]' || echo '')"
          HEAD_VER="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION  base=$BASE_VER  head=$HEAD_VER"

          if [ -z "$HEAD_VER" ]; then
            echo "::error::/VERSION is empty or missing."
            exit 1
          fi

          if [ "$BASE_VER" = "$HEAD_VER" ]; then
            echo "::error::Code changed but neither /VERSION was bumped (still $HEAD_VER) nor a changelog.d/ fragment was added. EITHER add changelog.d/<slug>.md with 'type: fix|feat|breaking' front matter (preferred — never conflicts with other PRs; see changelog.d/README.md) OR bump /VERSION (semver: feat→minor, fix→patch, breaking→major) and add a CHANGELOG note. See docs/versioning.md."
            exit 1
          fi

          # Monotonic: head must be strictly greater than base.
          GREATER="$(printf '%s\n%s\n' "$BASE_VER" "$HEAD_VER" | sort -V | tail -1)"
          if [ "$GREATER" != "$HEAD_VER" ] || [ "$BASE_VER" = "$HEAD_VER" ]; then
            echo "::error::/VERSION must INCREASE ($BASE_VER → $HEAD_VER is not a forward bump)."
            exit 1
          fi

          echo "✓ /VERSION advanced $BASE_VER → $HEAD_VER"
