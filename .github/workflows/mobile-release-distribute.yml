name: Mobile release — build + distribute

# The NATIVE delivery path. Everything OTA structurally cannot carry — new native
# plugins, Capacitor upgrades, MainActivity/Gradle/manifest changes, permission
# changes, SDK bumps — ships here as a signed APK.
#
# Manual dispatch only. A native release changes what is installed on a
# technician's phone, so it is never a side effect of a merge.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What changed (shown to testers in Firebase)"
        required: true
        type: string
      groups:
        description: "Firebase tester group(s), comma-separated"
        required: false
        default: "technicians"
        type: string
      distribute:
        description: "Actually distribute? 'no' builds and verifies only."
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      publish_download:
        description: "Publish the signed APK to https://updates.factorylm.com/download (direct install, no Play)?"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    # Same production environment + DOPPLER_TOKEN as deploy-vps.yml — the repo
    # has no DOPPLER_TOKEN_PRD secret (this workflow had never run).
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile deps
        working-directory: mira-mobile
        run: bun install --frozen-lockfile

      # Gate the release on the same tests that guard every mobile change. A
      # signed APK that reaches a phone is the most expensive thing to get wrong.
      - name: Mobile unit tests
        working-directory: mira-mobile
        run: bun run test

      - name: Build web bundle (tsc --noEmit + vite build)
        working-directory: mira-mobile
        run: bun run build

      - name: Capacitor sync
        working-directory: mira-mobile
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # The keystore lives in Doppler as base64 and is materialised to a file
      # that exists only for this job. It is never echoed and never an artifact.
      - name: Materialise signing key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          doppler secrets get ANDROID_KEYSTORE_BASE64 --plain \
            --project factorylm --config prd \
            | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks"
          echo "keystore materialised ($(stat -c%s "$RUNNER_TEMP/signing/upload.jks") bytes)"

      - name: Build signed release APK
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        working-directory: mira-mobile/android
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/signing/upload.jks"
          # gradlew was committed without the executable bit; belt and braces.
          chmod +x ./gradlew
          doppler run --project factorylm --config prd -- ./gradlew --no-daemon assembleRelease

      # Fail loudly if the APK came out unsigned. build.gradle deliberately
      # degrades to "unsigned but successful" when credentials are absent, which
      # is right for ordinary CI and catastrophic here — an unsigned APK cannot
      # install, and finding that out on a technician's phone is too late.
      - name: Verify signature
        working-directory: mira-mobile/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs --verbose "$APK" | tee /tmp/signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signing.txt
          grep -q "CN=FactoryLM" /tmp/signing.txt
          echo "signed OK"

      # The signed APK is what testers receive anyway; keeping it as a run
      # artifact lets a release be installed on an emulator/device for proof
      # even when Firebase distribution is off. The keystore is never uploaded.
      # Play accepts only an App Bundle. Same keystore, same run — the APK is for
      # testers/emulators, the AAB is what gets uploaded to Play Console.
      - name: Build signed release AAB (Play)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        working-directory: mira-mobile/android
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/signing/upload.jks"
          doppler run --project factorylm --config prd -- ./gradlew --no-daemon bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-signing.txt | tail -3
          grep -q "jar verified" /tmp/aab-signing.txt
          grep -q "CN=FactoryLM" /tmp/aab-signing.txt
          echo "AAB signed OK"

      - name: Upload signed AAB artifact (upload this to Play Console → Internal testing)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.sha }}
          path: mira-mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.sha }}
          path: mira-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Distribute to testers
        if: inputs.distribute == 'yes'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler secrets get FIREBASE_SERVICE_ACCOUNT_JSON --plain \
            --project factorylm --config prd > "$RUNNER_TEMP/fb.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb.json"
          APP_ID=$(doppler secrets get FIREBASE_ANDROID_APP_ID --plain --project factorylm --config prd)
          npx --yes firebase-tools appdistribution:distribute \
            mira-mobile/android/app/build/outputs/apk/release/app-release.apk \
            --app "$APP_ID" \
            --groups "${{ inputs.groups }}" \
            --release-notes "${{ inputs.release_notes }}"
          rm -f "$RUNNER_TEMP/fb.json"

      - name: Publish direct-install download (updates.factorylm.com/download)
        if: inputs.publish_download == 'yes'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          APK=mira-mobile/android/app/build/outputs/apk/release/app-release.apk
          VN=$(grep -E '^\s*versionName ' mira-mobile/android/app/build.gradle | head -1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          VC=$(grep -E '^\s*versionCode ' mira-mobile/android/app/build.gradle | head -1 | sed -E 's/.*versionCode ([0-9]+).*/\1/')
          test -n "$VN" && test -n "$VC"
          FILE="factorylm-${VN}-vc${VC}.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          STAGE="$RUNNER_TEMP/app"; mkdir -p "$STAGE"
          cp "$APK" "$STAGE/$FILE"
          cp "$APK" "$STAGE/latest.apk"
          cp deployment/ota-download/index.html "$STAGE/index.html"
          printf '{"versionName":"%s","versionCode":%s,"file":"%s","sha256":"%s","sizeBytes":%s,"builtAt":"%s","commit":"%s"}\n' \
            "$VN" "$VC" "$FILE" "$SHA" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" > "$STAGE/latest.json"
          cat "$STAGE/latest.json"
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H 165.245.138.91 >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no root@165.245.138.91"
          $SSH 'mkdir -p /srv/factorylm/ota/app'
          # Versioned APK first (immutable), then the pointers, so a reader never sees
          # latest.json naming a file that is not there yet.
          scp -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no "$STAGE/$FILE" "root@165.245.138.91:/srv/factorylm/ota/app/$FILE"
          scp -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=no "$STAGE/latest.apk" "$STAGE/latest.json" "$STAGE/index.html" root@165.245.138.91:/srv/factorylm/ota/app/
          $SSH "cd /srv/factorylm/ota/app && echo '$SHA  $FILE' | sha256sum -c - && echo '$SHA  latest.apk' | sha256sum -c -"
          echo "=== public probes ==="
          curl -sS -o /dev/null -w "https://updates.factorylm.com/download -> %{http_code} %{redirect_url}\n" https://updates.factorylm.com/download
          curl -sS -o /dev/null -w "https://updates.factorylm.com/app/ -> %{http_code} %{content_type}\n" https://updates.factorylm.com/app/
          curl -sS -o /dev/null -w "https://updates.factorylm.com/app/latest.json -> %{http_code} %{content_type}\n" https://updates.factorylm.com/app/latest.json
          curl -sSI https://updates.factorylm.com/app/latest.apk | grep -i -E '^(HTTP|content-type|content-length)'
          echo "download page: https://updates.factorylm.com/download ($FILE, sha256 $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        run: |
          {
            echo "### Mobile release"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- distributed: \`${{ inputs.distribute }}\`"
            echo "- expected signer: \`CN=FactoryLM\`, cert SHA-256 \`23:95:B9:60:...:92:A9\`"
            echo "  (full value in docs/release/android/signing.md)"
          } >> "$GITHUB_STEP_SUMMARY"
