name: VPS Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEANUP to confirm'
        required: true

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'CLEANUP'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: deployment/known_hosts.factorylm-prod
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require the exact current main source
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT" == "$CURRENT_MAIN" ]] || {
            echo "::error::Refusing stale production cleanup: checked out $CHECKED_OUT, current main is $CURRENT_MAIN"
            exit 1
          }
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Run cleanup
        run: |
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes \
            root@165.245.138.91 "bash -s" << 'ENDSSH'
          set -uo pipefail

          echo "=== BEFORE ==="
          df -h /
          free -h

          echo "=== Docker prune ==="
          docker system prune -a --volumes -f

          echo "=== Log trim ==="
          journalctl --vacuum-size=100M

          echo "=== APT clean ==="
          apt-get clean

          echo "=== Tmp clean ==="
          find /tmp -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find /var/tmp -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true

          echo "=== AFTER ==="
          df -h /
          free -h

          echo "=== Docker stats ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          docker system df
          ENDSSH
