name: Beta Gate (upload → retrieval → citation)

# Proves the ONE beta-readiness gate end-to-end over HTTP:
#   "A stranger uploads their own equipment manual, asks a real troubleshooting
#    question, and MIRA returns a grounded answer with citations from that
#    uploaded manual — without Mike manually fixing anything."
#
# It builds a Hub on the runner against the STAGING Neon branch (NEVER prod;
# staging is "safe to break" and has the factorylm_app INSERT grant from mig
# 049), provisions a real *stranger* run
# (register → tenant FK → next-auth cookie → namespace node), uploads the
# fixture manual through the REAL `/files/` door, and runs
# tests/beta/beta_ready_upload_retrieval_citation.py against it.
#
# This is the DURABLE surface that justifies removing the gate's old xfail: the
# gate now skips when BETA_GATE_* is unset (plain local pytest) and asserts for
# real here, where CI provisions it. Staging rows are cleaned up afterwards.
#
# Secret: DOPPLER_TOKEN (the same one db-inspect.yml uses) — it can read the
# `factorylm/stg` config. The job inherits it via `environment: staging`
# (matching db-inspect's working pattern). It only ever resolves the *stg*
# config — never prod.

#
# Workstream B (PRD docs/prd/2026-08-29-technician-beta-recovery-prd.md §8)
# adds two jobs so that GREEN means the behaviour PRODUCTION depends on:
#   notebook-gate        — the same stranger, through the NOTEBOOK product
#                          contract, with the Hub started EXPLICITLY under
#                          MIRA_ENFORCE_APPROVED_RETRIEVAL=true (the production
#                          gate) + a run-unique document/sentinel. See
#                          tests/beta/_notebook_probe.py.
#   admission-regression — no secrets; disposable postgres:16; the Workstream A
#                          admission suite that goes RED the moment the
#                          verified=false fix is reverted.
# `prove_regression=true` (manual dispatch) reverts the fix in the build and
# REQUIRES the notebook lane to fail — the PRD §8.4 exit-gate demonstration.

on:
  workflow_dispatch:
    inputs:
      prove_regression:
        description: "Reintroduce the Workstream A verified=false defect in the built Hub and require the notebook lane to FAIL (§8.4 exit-gate proof). Never merges anything."
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — weekly beta-readiness re-proof
  pull_request:
    paths:
      - "tests/beta/**"
      - "mira-hub/src/lib/node-knowledge-ingest.ts"
      - "mira-hub/src/lib/manual-rag.ts"
      - "mira-hub/src/app/api/namespace/node/**"
      - "mira-hub/scripts/provision-beta-gate.ts"
      - "mira-hub/src/lib/equipment-notebooks.ts"
      - "mira-hub/src/app/api/equipment-notebooks/**"
      - "mira-hub/src/app/api/health/**"
      - ".github/workflows/beta-gate.yml"

concurrency:
  group: beta-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-gate:
    name: Stranger upload → cited answer (staging Neon)
    runs-on: ubuntu-latest
    environment: staging # only to inherit DOPPLER_TOKEN; resolves the stg config
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dopplerhq/cli-action@v4

      - name: Install mira-hub deps
        working-directory: mira-hub
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install gate python deps
        run: pip install --quiet httpx pytest pyyaml

      - name: Build · provision · run gate · cleanup
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: factorylm
          # staging, not dev: the shared DOPPLER_TOKEN (same one db-inspect.yml uses)
          # can read stg+prd but NOT dev. The gate contract allows dev OR staging
          # (never prod); staging Neon has the factorylm_app INSERT grant (mig 049),
          # the OEM corpus, and is "safe to break". Verified green locally on stg.
          DOPPLER_CONFIG: stg
        run: |
          set -euo pipefail
          [ -n "${DOPPLER_TOKEN:-}" ] || { echo "::error::DOPPLER_TOKEN not set"; exit 1; }

          # 1. Build the Hub at basePath='' (routes at root) against staging.
          echo "::group::next build (staging)"
          ( cd mira-hub && NEXT_PUBLIC_BASE_PATH='' NEXT_PUBLIC_API_BASE='' NODE_ENV=production \
              doppler run -- ./node_modules/.bin/next build )
          echo "::endgroup::"

          # 2. Start the Hub (background) on :3100.
          ( cd mira-hub && NEXT_PUBLIC_BASE_PATH='' NODE_ENV=production \
              doppler run -- env NEXTAUTH_URL=http://localhost:3100 AUTH_TRUST_HOST=true \
              ./node_modules/.bin/next start -p 3100 > /tmp/hub.log 2>&1 & )

          # 3. Wait for readiness (csrf 200 through the trailing-slash door).
          ready=
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/api/auth/csrf/ || true)
            if [ "$code" = "200" ]; then ready=1; echo "Hub ready after ~$((i*3))s"; break; fi
            sleep 3
          done
          if [ -z "$ready" ]; then echo "::error::Hub never became ready"; cat /tmp/hub.log; exit 1; fi

          # 4. Provision a real stranger run → BETA_GATE_* env lines.
          ( cd mira-hub && doppler run -- bun run scripts/provision-beta-gate.ts ) > /tmp/gate-env.out
          set -a
          # shellcheck disable=SC1090
          . <(grep '^ENV:' /tmp/gate-env.out | sed 's/^ENV://')
          set +a
          echo "::notice::provisioned tenant=$BETA_GATE_TENANT node=$BETA_GATE_NODE"

          # 5. Run the gate (pure HTTP — no doppler needed). --confcutdir keeps
          #    pytest from ascending into tests/conftest.py (which imports the
          #    full test harness); the beta gate is self-contained (_gate = httpx).
          set +e
          python -m pytest tests/beta/beta_ready_upload_retrieval_citation.py \
            --confcutdir=tests/beta -v -rs
          GATE_RC=$?
          set -e

          # 6. Clean up the staging rows we created (best-effort, never fail the job).
          ( cd mira-hub && doppler run -- bun run scripts/provision-beta-gate.ts --cleanup "$BETA_GATE_TENANT" ) || true

          # 7. Tear down the server.
          pkill -f "next start -p 3100" || true

          exit $GATE_RC

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: beta-gate-hub-log-${{ github.run_id }}
          path: /tmp/hub.log
          retention-days: 7
          if-no-files-found: ignore

  # ── Workstream B: production-equivalent notebook lane ─────────────────────
  notebook-gate:
    name: Stranger notebook → confirmed source → cited answer (production gate ON)
    runs-on: ubuntu-latest
    environment: staging # only to inherit DOPPLER_TOKEN; resolves the stg config
    timeout-minutes: 30
    env:
      PROVE_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_regression == true && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dopplerhq/cli-action@v4

      - name: Install mira-hub deps
        working-directory: mira-hub
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install probe python deps
        run: pip install --quiet httpx pytest

      - name: Reintroduce the Workstream A defect (prove_regression only)
        if: env.PROVE_REGRESSION == '1'
        run: |
          set -euo pipefail
          # The exact admission predicate Workstream A added (manual-rag.ts).
          # Replacing it with the legacy global rule is the #3437/#3468 defect.
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("mira-hub/src/lib/manual-rag.ts")
          src = p.read_text(encoding="utf-8")
          needle = "return `AND (verified = true OR (is_private = true AND doc_id = ANY($${approvedParam}::uuid[])))`;"
          assert src.count(needle) == 1, "admission predicate not found exactly once — the proof needs updating"
          p.write_text(src.replace(needle, "return approvalFilterSql(); // DEFECT REINTRODUCED FOR THE §8.4 PROOF"), encoding="utf-8")
          print("::warning::Workstream A admission fix REVERTED in this build — the notebook lane is now REQUIRED to fail")
          PY

      - name: Build · start (gate ON) · assert gate · provision · probe · cleanup
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: factorylm
          DOPPLER_CONFIG: stg
        run: |
          set -euo pipefail
          [ -n "${DOPPLER_TOKEN:-}" ] || { echo "::error::DOPPLER_TOKEN not set"; exit 1; }

          echo "::group::next build (staging)"
          ( cd mira-hub && NEXT_PUBLIC_BASE_PATH='' NEXT_PUBLIC_API_BASE='' NODE_ENV=production \
              doppler run -- ./node_modules/.bin/next build )
          echo "::endgroup::"

          # Failure-safe teardown, scoped to THIS run: stop the Hub we started
          # and sweep ONLY the tenant we provisioned (if provisioning got that
          # far). Runs on every exit path — a failed assertion, a failed probe,
          # or a normal finish — so a red lane never leaks staging rows.
          BETA_GATE_TENANT=""
          cleanup_run() {
            if [ -n "${BETA_GATE_TENANT:-}" ]; then
              echo "teardown: sweeping run-owned tenant $BETA_GATE_TENANT"
              ( cd mira-hub && doppler run -- bun run scripts/provision-beta-gate.ts --cleanup "$BETA_GATE_TENANT" ) || \
                echo "::warning::tenant sweep failed for $BETA_GATE_TENANT — inspect staging"
            fi
            pkill -f "next start -p 3100" || true
          }
          trap cleanup_run EXIT

          # Start the Hub with the PRODUCTION gate set EXPLICITLY on the command
          # line — never inherited from an ambiguous staging value (#3328).
          # MIRA_CANONICAL_SEAM=1 matches production so provider/model usage is
          # emitted per turn (the probe asserts it is non-null).
          # INGEST_URL: docker-compose.staging-vps.yml sets the staging Hub to
          # `disabled://staging` (mira-ingest-client.ts honours the scheme); the
          # Doppler stg config alone does not carry it, so /api/health reports
          # 503 `missing: ["INGEST_URL"]` (run 33264432611). Set the SAME
          # staging value explicitly. The notebook upload door ingests
          # in-process (node-knowledge-ingest.ts) and never reads INGEST_URL,
          # so this changes nothing the probe exercises.
          ( cd mira-hub && NEXT_PUBLIC_BASE_PATH='' NODE_ENV=production \
              doppler run -- env NEXTAUTH_URL=http://localhost:3100 AUTH_TRUST_HOST=true \
              MIRA_ENFORCE_APPROVED_RETRIEVAL=true MIRA_CANONICAL_SEAM=1 \
              INGEST_URL="${INGEST_URL:-disabled://staging}" \
              ./node_modules/.bin/next start -p 3100 > /tmp/hub-notebook.log 2>&1 & )

          ready=
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/api/auth/csrf/ || true)
            if [ "$code" = "200" ]; then ready=1; echo "Hub ready after ~$((i*3))s"; break; fi
            sleep 3
          done
          if [ -z "$ready" ]; then echo "::error::Hub never became ready"; cat /tmp/hub-notebook.log; exit 1; fi

          # Non-secret startup assertion: /api/health must be 200 (every
          # required env present) AND report the EFFECTIVE gate as enforced.
          # The body is printed on either failure so a 503 names what is
          # missing instead of dying as a bare curl exit code.
          hcode=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:3100/api/health/ || true)
          echo "health: HTTP $hcode $(cat /tmp/health.json 2>/dev/null)"
          [ "$hcode" = "200" ] || { echo "::error::/api/health is HTTP $hcode — the Hub is not healthy: $(cat /tmp/health.json 2>/dev/null)"; exit 1; }
          enforced=$(python -c 'import json; print(json.load(open("/tmp/health.json")).get("approvedRetrievalEnforced"))')
          [ "$enforced" = "True" ] || { echo "::error::MIRA_ENFORCE_APPROVED_RETRIEVAL is not effective (health.approvedRetrievalEnforced=$enforced)"; exit 1; }
          echo "::notice::effective gate: MIRA_ENFORCE_APPROVED_RETRIEVAL=true (asserted via /api/health, HTTP 200)"

          # Fresh stranger tenant + fresh credentials for THIS run. The tenant
          # id is exported so the EXIT trap can sweep it on any later failure.
          ( cd mira-hub && doppler run -- bun run scripts/provision-beta-gate.ts ) > /tmp/probe-env.out
          set -a
          # shellcheck disable=SC1090
          . <(grep '^ENV:' /tmp/probe-env.out | sed 's/^ENV://')
          set +a
          [ -n "${BETA_GATE_TENANT:-}" ] || { echo "::error::provisioning emitted no BETA_GATE_TENANT"; exit 1; }
          echo "::notice::provisioned tenant=$BETA_GATE_TENANT (run-owned; swept by the EXIT trap)"

          set +e
          BETA_PROBE_POLL_SECONDS=240 python -m pytest tests/beta/beta_ready_notebook_confirmed_source.py \
            --confcutdir=tests/beta -v -rs -s 2>&1 | sed -E 's/next-auth\.session-token=[^ "]+/next-auth.session-token=[redacted]/g' | tee /tmp/probe-report.log
          GATE_RC=${PIPESTATUS[0]}
          set -e

          if [ "$PROVE_REGRESSION" = "1" ]; then
            if [ "$GATE_RC" -eq 0 ]; then
              echo "::error::The notebook lane PASSED with the Workstream A defect reintroduced — the gate is not production-equivalent"; exit 1
            fi
            echo "::notice::§8.4 proof: the notebook lane FAILED under the reintroduced verified=false defect (rc=$GATE_RC), as required"
            exit 0
          fi
          exit "$GATE_RC"

      - name: Redact + upload Hub log and probe evidence on failure
        if: failure() || env.PROVE_REGRESSION == '1'
        run: |
          sed -E -e 's/next-auth\.session-token=[^ ;"]+/next-auth.session-token=[redacted]/g' \
                 -e 's/(Bearer|Authorization:)[^ "]*/\1 [redacted]/g' \
                 -e 's/(password|apiKey|api_key|token)("?\s*[:=]\s*"?)[^",} ]+/\1\2[redacted]/gi' \
                 /tmp/hub-notebook.log > /tmp/hub-notebook.redacted.log 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: failure() || env.PROVE_REGRESSION == '1'
        with:
          name: notebook-gate-evidence-${{ github.run_id }}
          path: |
            /tmp/hub-notebook.redacted.log
            /tmp/probe-report.log
          retention-days: 7
          if-no-files-found: ignore

  # ── Workstream B: deterministic admission regression (no secrets) ─────────
  admission-regression:
    name: Admission fix present (disposable Postgres, gate ON)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: mira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:testpw@127.0.0.1:5432/mira_test
      MIRA_TEST_DB_CONFIRM: DISPOSABLE
      MIRA_INTEGRATION_MIGRATIONS: "001_knowledge_graph.sql,010_kg_uns_path.sql,026_kg_entities_dedupe_and_constraint.sql,027_ai_suggestions.sql,029_kg_approval_state.sql,055_contextualization.sql,056_contextualization_intake.sql,067_ctx_import_batches_approval_cols.sql,027_namespace_direct_uploads.sql,059_namespace_filing_cabinet.sql,068_hub_uploads.sql,072_hub_uploads_content_sha256.sql,073_equipment_notebooks.sql,075_workspace_file_links.sql,076_namespace_uploads_source_reconcile.sql,077_ingest_claim.sql,082_namespace_uploads_node_nullable.sql,084_notebook_turn_basis_and_source_origin.sql,085_notebook_source_canonical_provenance.sql"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      - name: Install mira-hub deps
        working-directory: mira-hub
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply the integration schema
        working-directory: mira-hub
        run: node scripts/setup-integration-db.mjs

      - name: Workstream A admission suite (RED if the verified=false fix is reverted)
        working-directory: mira-hub
        env:
          MIRA_ENFORCE_APPROVED_RETRIEVAL: "true"
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts src/lib/__tests__/approved-source-admission
