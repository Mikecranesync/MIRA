name: Deploy nginx staging vhosts

# Installs deployment/nginx-staging-factorylm.conf on the host named by the
# STAGING_HOST repository variable (the production VPS — co-hosted staging,
# #3930): staging.factorylm.com → stg-mira-web :4200, app-staging.factorylm.com
# → stg-mira-hub :4101. Production vhosts are never touched: the workflow
# refuses a conf that names a production hostname, adds ONE new site file,
# validates with `nginx -t`, and only then reloads. TLS: once both names
# resolve to the host, certbot extends the vhosts in place.
#
# Human-dispatched (touches the production nginx → `production` environment gate).

on:
  workflow_dispatch:

jobs:
  deploy-nginx:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the exact current main source
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT" == "$CURRENT_MAIN" ]] || {
            echo "::error::Refusing stale production nginx change: checked out $CHECKED_OUT, current main is $CURRENT_MAIN"
            exit 1
          }

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Refuse a conf that names a production hostname
        run: |
          set -euo pipefail
          if grep -nE 'server_name[^;]*\b(app\.factorylm\.com|www\.factorylm\.com|updates\.factorylm\.com|factorylm\.com)\b' deployment/nginx-staging-factorylm.conf; then
            echo "::error::staging vhost file names a production hostname — refusing (#3930 safeguard 6)"
            exit 1
          fi
          grep -qE 'server_name staging\.factorylm\.com;' deployment/nginx-staging-factorylm.conf
          grep -qE 'server_name app-staging\.factorylm\.com;' deployment/nginx-staging-factorylm.conf

      - name: Resolve staging host (pinned)
        id: host
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: |
          set -euo pipefail
          [[ "$STAGING_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ || "$STAGING_HOST" =~ ^[a-z0-9]([a-z0-9-]{0,62}\.)+[a-z]{2,}$ ]] || { echo "::error::STAGING_HOST missing/invalid"; exit 1; }
          grep -qE "^${STAGING_HOST//./\\.} " deployment/known_hosts.factorylm-prod || { echo "::error::STAGING_HOST is not pinned in deployment/known_hosts.factorylm-prod"; exit 1; }
          printf 'host=%s\n' "$STAGING_HOST" >> "$GITHUB_OUTPUT"

      - name: SCP vhost to the host
        env:
          STAGING_HOST: ${{ steps.host.outputs.host }}
        run: |
          scp -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            deployment/nginx-staging-factorylm.conf \
            "root@${STAGING_HOST}:/etc/nginx/sites-available/staging-factorylm"

      - name: Enable + test + reload nginx, then certbot if DNS points here
        env:
          STAGING_HOST: ${{ steps.host.outputs.host }}
        run: |
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "root@${STAGING_HOST}" 'bash -s' << 'ENDSSH'
          set -euo pipefail
          # Snapshot every NON-staging enabled site. An unreadable file is an
          # explicit failure (return 1, never errexit-dependent) — a read error must
          # never look like "nothing changed". Only a host whose sole site is
          # staging yields an empty, legitimate snapshot.
          site_hashes() {
            local f h out=""
            for f in /etc/nginx/sites-enabled/*; do
              [ -e "$f" ] || continue
              case "$f" in */staging-factorylm) continue;; esac
              h="$(sha256sum "$f")" || { echo "::error::cannot hash $f — refusing to proceed without a production-site snapshot" >&2; return 1; }
              out+="$h"$'\n'
            done
            printf '%s' "$out" | sort
          }
          PROD_BEFORE="$(site_hashes)" || exit 1
          ln -sfn /etc/nginx/sites-available/staging-factorylm /etc/nginx/sites-enabled/staging-factorylm
          nginx -t
          systemctl reload nginx
          PROD_AFTER="$(site_hashes)" || exit 1
          [ "$PROD_BEFORE" = "$PROD_AFTER" ] || { echo "::error::a non-staging nginx site changed — STOP (#3930 safeguard 6)"; exit 1; }
          MY_IP="$(curl -s --max-time 10 https://api.ipify.org || true)"
          echo "=== host-header probes (independent of DNS) ==="
          curl -s -o /dev/null -w "staging.factorylm.com     -> %{http_code}\n" --max-time 10 -H 'Host: staging.factorylm.com' http://127.0.0.1/ || true
          curl -s -o /dev/null -w "app-staging.factorylm.com -> %{http_code}\n" --max-time 10 -H 'Host: app-staging.factorylm.com' http://127.0.0.1/api/health/ || true
          echo "=== production hostnames still route to production ==="
          curl -s --max-time 10 -H 'Host: app.factorylm.com' http://127.0.0.1/api/version/ | head -c 160 || true; echo
          A1="$(dig +short staging.factorylm.com A | tail -1)"; A2="$(dig +short app-staging.factorylm.com A | tail -1)"
          if [ -n "$MY_IP" ] && [ "$A1" = "$MY_IP" ] && [ "$A2" = "$MY_IP" ]; then
            echo "=== DNS points here — issuing/renewing TLS ==="
            # Reuses the ACME account already registered on this host (production and
            # the preview were issued from it); a host with no account fails loudly here.
            certbot --nginx --non-interactive --agree-tos --keep-until-expiring \
              --cert-name staging-factorylm -d staging.factorylm.com -d app-staging.factorylm.com
            nginx -t && systemctl reload nginx
          else
            echo "::warning::DNS does not (yet) point staging.factorylm.com / app-staging.factorylm.com at this host (${MY_IP}) — vhosts installed on HTTP; re-run after the A records land to get TLS"
          fi
          ENDSSH
