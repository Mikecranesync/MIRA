name: Install amux on VPS (retired)

# This historical root installer is intentionally inert. amux is already
# installed; any future provisioning must use a pinned package and a scoped,
# non-root operator identity through a separately reviewed workflow.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse retired production installer
        run: |
          echo "::error::This production installer is retired; use a reviewed non-root provisioner."
          exit 1
