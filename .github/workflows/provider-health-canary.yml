name: provider-health canary

# Catches a dead LLM cascade provider BEFORE it costs us coverage.
#
# Background: the cascade (Groq -> Cerebras -> Together) is resilient — if a
# provider dies, the next answers. That resilience MASKS a dead provider:
# Gemini's 403 and Cerebras's llama3.1-8b 404 both went unnoticed because Groq
# kept answering. By the time anyone noticed, coverage had silently dropped to
# one provider. This canary probes each provider INDEPENDENTLY and pages when
# coverage degrades — not just on a full outage.
#
# The probe (tools/provider_health_check.py) imports the runtime router's
# _build_providers(), so it always tests the exact url/model/key the cascade
# uses — no duplicated defaults to drift (drift is what hid the Cerebras death).
# It uses a generous max_tokens + one retry so a reasoning model (gpt-oss-120b)
# returning empty content does NOT false-page.
#
# Keys come from Doppler (the shared DOPPLER_TOKEN, factorylm/stg — provider
# keys are account-global, so stg validates the same Groq/Cerebras/Together
# accounts prod uses). Exit codes:
#   0 = all providers UP
#   1 = >=1 provider DOWN (coverage degraded) -> opens/updates a provider-incident issue
#   2 = probe could not run (no keys / import error) -> red, but does NOT page (infra, not a death)
# Runbook: docs/runbooks/provider-health-canary.md

on:
  schedule:
    # Hourly at :23 (was every 6h). OpenAI leads the cascade and the staging acceptance
    # gate depends on it: on 2026-10-18 its prepaid balance ran dry 20:59Z-22:40Z, entirely
    # between two 6-hourly runs, and the first signal was a blocked prod deploy (#4519).
    # One probe per provider per hour costs well under a cent a day.
    - cron: "23 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "mira-bots/shared/inference/router.py"
      - "tools/provider_health_check.py"
      - "docker-compose.saas.yml"
      - ".github/workflows/provider-health-canary.yml"

jobs:
  probe:
    name: Probe LLM cascade providers
    runs-on: ubuntu-latest
    # Inherit the staging-scoped DOPPLER_TOKEN so `doppler --config stg` can read
    # the provider keys (the repo-level token can't read stg). Same mechanism as
    # beta-gate.yml; staging has no required-reviewer protection, so the cron runs
    # unattended. Provider keys are account-global, so stg validates the same
    # Groq/Cerebras/Together accounts prod uses.
    environment: staging
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write          # open / comment the provider-incident issue on exit 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install probe deps
        run: pip install --quiet httpx pyyaml

      - name: Probe providers
        id: probe
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: factorylm
          DOPPLER_CONFIG: stg
          INFERENCE_BACKEND: cloud
          PYTHONPATH: mira-bots
        run: |
          set +e
          doppler run -- python tools/provider_health_check.py
          code=$?
          set -e
          # Single-line GITHUB_OUTPUT writes (no heredoc — avoids the delimiter
          # collision class from #1637). The probe itself appended up_count /
          # down_count / down_providers / summary before exiting.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Keep run status honest: exit 1 (degraded) and exit 2 (probe error)
          # both show red. The page step decides which one alerts a human.
          exit "$code"

      - name: Page separately when OpenAI is down
        # OpenAI is the lead provider AND the dependency of the staging acceptance gate
        # (retrieval-acceptance.yml) and the photo "look" route, which has no failover. Its
        # death must not hide as one more line in the long-running coverage incident (open
        # for weeks because other providers are unpaid). Own issue, own dedup marker.
        # Same guards as the step below: the probe ran (summary set) and found a death.
        if: ${{ always() && steps.probe.outputs.exit_code == '1' && steps.probe.outputs.summary != '' && contains(format(',{0},', steps.probe.outputs.down_providers), ',openai,') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '%s\n' \
            "first_seen: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "deploy_run: none" \
            "deploy_sha: none" \
            "services: mira-hub chat (lead provider), photo look route, staging acceptance gate" \
            "impact: chat falls back to the next provider; photo look fails; the prod deploy gate cannot mint a receipt" \
            "restored_at: open" \
            "restoring_action: none" \
            "" \
            "The provider-health canary found OpenAI DOWN." \
            "Most likely cause: the prepaid credit balance is exhausted (insufficient_quota / credit_balance_exhausted), as on 2026-10-18 (#4519)." \
            "Check: platform.openai.com billing for the key in Doppler factorylm/stg and factorylm/prd (shared key)." \
            "" \
            "Failing run (reason in the log): ${run_url}" \
            "" \
            "canary_marker: openai-down")
          gh label create provider-incident --color B60205 \
            --description "LLM cascade provider coverage incident (canary)" 2>/dev/null || true
          gh label create incident --color B60205 \
            --description "Production failure record; SDLC v1 10.3 fixed fields, see docs/agents/issue-tracker.md" 2>/dev/null || true
          # Dedup on EITHER the fixed body marker OR the creation title, newest match wins: a
          # hand-retitled issue is still found by its marker, and one whose marker line was
          # edited away is still found by its title (Codex F1 r1 and r2, PR #4531). Only an
          # issue that lost both is treated as gone.
          by_marker=$(gh issue list --state open --label provider-incident --search 'in:body "canary_marker: openai-down"' \
            --json number --jq '[.[].number]')
          by_title=$(gh issue list --state open --label provider-incident --search 'in:title "OpenAI DOWN"' \
            --json number --jq '[.[].number]')
          existing=$(jq -rn --argjson a "${by_marker:-[]}" --argjson b "${by_title:-[]}" '($a + $b) | max // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --add-label incident \
              || { echo "::error::could not add the incident label to #$existing; comment withheld"; exit 1; }
            gh issue comment "$existing" --body "$body"
            echo "commented on existing OpenAI incident #$existing"
          else
            gh issue create --title "OpenAI DOWN (lead provider + deploy gate dependency)" --body "$body" \
              --label provider-incident --label incident
          fi

      - name: Page on degraded coverage
        # Only a real provider death opens an incident. Two guards:
        #   exit_code == '1'      -> the probe found >=1 provider DOWN
        #   summary != ''         -> the probe ACTUALLY RAN (it writes summary to
        #                            GITHUB_OUTPUT only after probing). If Doppler
        #                            auth / import / infra fails, the probe never
        #                            runs, the wrapper still exits 1, but summary
        #                            is empty -> do NOT page (run stays red =
        #                            honest, but no false "DEGRADED:" incident).
        # exit 2 (no providers configured) also leaves summary empty -> no page.
        if: ${{ always() && steps.probe.outputs.exit_code == '1' && steps.probe.outputs.summary != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          down="${{ steps.probe.outputs.down_providers }}"
          down_count="${{ steps.probe.outputs.down_count }}"
          summary="${{ steps.probe.outputs.summary }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${down_count:-1}" -ge 2 ]; then
            sev="CRITICAL"
          else
            sev="DEGRADED"
          fi
          title="LLM provider coverage ${sev}: ${summary}"
          # printf so each line has NO leading whitespace (4+ spaces => code block)
          # and NO backticks (avoids bash command substitution in the body).
          # SDLC v1 §10.3 fixed fields first (one per line, exactly these keys; the
          # body is the record of truth). A canary cannot attribute a deploy, so
          # deploy_run/deploy_sha are "none"; restored_at stays "open" until a
          # human edits the body; restoring_action starts as "none".
          first_seen="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body=$(printf '%s\n' \
            "first_seen: ${first_seen}" \
            "deploy_run: none" \
            "deploy_sha: none" \
            "services: mira-bots (LLM cascade providers: ${down})" \
            "impact: reduced LLM provider coverage — ${summary}" \
            "restored_at: open" \
            "restoring_action: none" \
            "" \
            "The provider-health canary found one or more LLM cascade providers DOWN." \
            "" \
            "Status: ${summary}" \
            "Down: ${down}" \
            "" \
            "The cascade may still be serving on the remaining provider(s), but coverage" \
            "is reduced — one more failure moves us toward a full Open WebUI fallback." \
            "" \
            "Failing run (per-provider reasons in the log): ${run_url}" \
            "" \
            "Fix: a DOWN usually means a retired/renamed model or a revoked key." \
            "Check the provider's model catalog and the key in Doppler factorylm/prd," \
            "update the default in mira-bots/shared/inference/router.py + compose," \
            "then redeploy. Runbook: docs/runbooks/provider-health-canary.md" \
            "Health prior deaths: Gemini 403 (replaced by Together), Cerebras llama3.1-8b 404 (-> gpt-oss-120b).")
          gh label create provider-incident --color B60205 \
            --description "LLM cascade provider coverage incident (canary)" 2>/dev/null || true
          # SDLC v1 §10.3: every canary-opened failure record also carries the
          # generic `incident` label so the observation window (§9), the metrics
          # (§12.3) and the regression disposition are counted off ONE label.
          gh label create incident --color B60205 \
            --description "Production failure record; SDLC v1 10.3 fixed fields, see docs/agents/issue-tracker.md" 2>/dev/null || true
          # Dedup by a stable title marker so a multi-cycle outage updates ONE
          # issue instead of opening a new one every 6h.
          # Narrow the dedup target to this canary's own label (Codex F1, PR #4212): a
          # title substring alone could pick a stale or hand-renamed issue.
          matches=$(gh issue list --state open --label provider-incident --search 'in:title "LLM provider coverage"' \
            --json number --jq '[.[].number]')
          count=$(printf '%s' "$matches" | jq 'length')
          # More than one open match is a maintenance state, not an outage of the canary:
          # update the NEWEST (highest number) deterministically and flag the duplicates
          # for cleanup — never strand the live signal, never pick an arbitrary one
          # (Codex rounds 2 and 3, PR #4212).
          if [ "$count" -gt 1 ]; then
            echo "::warning::$count open issues match the incident dedup ($matches); updating the newest, close or retitle the stale ones"
          fi
          existing=$(printf '%s' "$matches" | jq -r 'max // empty')
          if [ -n "$existing" ]; then
            # Label FIRST, then comment (Codex F1, PR #4212): if the label add fails the
            # run goes red without leaving a half-updated record (comment present, label
            # absent). An existing failure record without the `incident` label is an
            # incomplete record; the observation window and metrics key on that label
            # (SDLC v1 §9, §12.3). `--add-label` is idempotent when the label is present.
            gh issue edit "$existing" --add-label incident \
              || { echo "::error::could not add the incident label to #$existing; comment withheld"; exit 1; }
            gh issue comment "$existing" --body "$body"
            echo "commented on existing incident #$existing"
          else
            gh issue create --title "$title" --body "$body" --label provider-incident --label incident
          fi
