name: tmp-apply-4645
on:
  push:
    branches:
      - cursor/fault-reset-factory-guard-00df
    paths:
      - ".github/workflows/tmp-apply-4645.yml"
      - "tools/tmp-apply-4645.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'trigger #4645 production patch apply')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #4645 production edits
        run: python3 tools/tmp-apply-4645.py
      - name: Commit production files and remove trigger
        run: |
          set -euo pipefail
          git config user.name "cursor-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-apply-4645.yml tools/tmp-apply-4645.py
          git add mira-hub/src/lib/notebook-query.ts mira-hub/src/capabilities/answer-validation.ts
          git add -u .github/workflows/tmp-apply-4645.yml tools/tmp-apply-4645.py
          git commit -m "fix(hub): classify fault-reset/ACK and demote factory-restore under fault intent (#4645)"
          git push
