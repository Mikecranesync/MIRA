name: Smoke Test

# Auto-cancel superseded runs on the same PR/branch. cancel-in-progress is gated
# to pull_request only: a push to main (the deploy gate that deploy-vps.yml waits
# on via workflow_run) is NEVER cancelled — only redundant PR re-pushes are.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deploy gate: verifies factorylm.com + app.factorylm.com are healthy before
# deploy-vps.yml is allowed to run. See issue #689.
#
# Triggers:
#   push to main  — fires first; deploy-vps.yml waits for this to succeed, so a failure
#                   here DOES stop the deploy. This is the enforcing path.
#   PR to main    — ADVISORY ONLY. This job is not in the branch's required contexts, so a
#                   red smoke does not block a merge and auto-merge still fires.
#                   (CORRECTED 2026-09-05: this line previously read "blocks merge if smoke
#                   fails (branch protection rule)". That was false — verify the real
#                   required set with `tools/pr-merge-blocker.sh <pr>`. The wrong comment
#                   mattered: on 2026-09-05 `app.factorylm.com/login` 502'd twice, the
#                   check went red both times, and nothing stopped — the failure was nearly
#                   dismissed as flake because everyone believed this line. Issue #3598.
#                   The alert step below exists because of that gap.)
#   workflow_dispatch — manual trigger for ad-hoc checks
#
# deploy-vps.yml listens for workflow_run: ["Smoke Test"] types: [completed]
# and checks conclusion == 'success' before starting the deploy job.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch: {}

jobs:
  smoke:
    name: E2E smoke (factorylm.com + app.factorylm.com)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      # bun is the source-of-truth package manager (bun.lock). CI installed via
      # `npm ci`, which hard-fails when package-lock.json drifts from
      # package.json (graphology #1789 / unpdf were missing) — silently blocking
      # every deploy. bun.lock stays in sync with package.json, so install via
      # bun. --ignore-scripts preserves the prior `npm ci --ignore-scripts`.
      - name: Install mira-hub deps (includes @playwright/test)
        working-directory: mira-hub
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium browser + OS deps
        working-directory: mira-hub
        run: npx playwright install chromium --with-deps

      # NON-BLOCKING checkout gate: the checkout→Stripe assertions in
      # money-path.spec.ts and signup-flow.spec.ts are intentionally SKIPPED
      # until there is a sellable product. There is no live Stripe SKU for
      # anonymous trial entry yet, so /api/checkout/session returns
      # /pricing?checkout=error — gating on it would jam every deploy for a
      # product we can't sell. To re-enable the gate once checkout is live,
      # set SMOKE_CHECKOUT_CHECK to "1" on both steps below.
      # See wayfinder #2577 / Drive Commander money-slice (backlog DC-H/I/J).
      - name: Run smoke tests
        id: smoke
        working-directory: mira-hub
        env:
          WEB_URL: https://factorylm.com
          HUB_URL: https://app.factorylm.com
          SMOKE_CHECKOUT_CHECK: "" # off until a sellable product exists; set "1" to re-enable
        run: npx playwright test --config playwright.smoke.config.ts

      - name: Run signup money-path tests (pricing → trial CTA → checkout → magic link)
        id: signup
        working-directory: mira-hub
        env:
          WEB_URL: https://factorylm.com
          HUB_URL: https://app.factorylm.com
          SMOKE_CHECKOUT_CHECK: "" # off until a sellable product exists; set "1" to re-enable
        run: npx playwright test --config playwright.signup.config.ts

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failures-${{ github.run_id }}
          path: mira-hub/test-results/
          retention-days: 3

      - name: Alert on a real production failure
        # WHY THIS EXISTS. On a pull request this job is NOT a required context (verify
        # with `tools/pr-merge-blocker.sh <pr>`, which lists the required set). So when it
        # goes red on a genuine production fault, nothing blocks, auto-merge still fires,
        # and the only trace is a red line someone has to notice by eye.
        #
        # That is not hypothetical. On 2026-09-05 `app.factorylm.com/login` returned 502
        # twice (runs 33990652852 and 33991277593); both times the check went red, nothing
        # stopped, and it was nearly written off as flake. Filed as issue #3598.
        #
        # A check that runs but cannot fail the merge is not a guard — the same lesson
        # `ci.yml` records on its Ignition step. The fix here is deliberately NOT to make
        # it required: a PR author cannot fix a production outage, and blocking their merge
        # on live-site health only teaches people to ignore this check. Instead the signal
        # is routed to a human who can act on it.
        #
        # Fires ONLY when a test step actually failed. A setup failure (lockfile drift, a
        # Playwright browser flake) never assessed production and must not raise a
        # production alarm — the same distinction the PR annotation below draws.
        #
        # Best-effort and non-fatal: reuses the Telegram path already proven in
        # `dogfood-judge-heartbeat.yml`, and no-ops with a warning if the secrets are
        # absent. It never changes this job's conclusion.
        if: always() && (steps.smoke.outcome == 'failure' || steps.signup.outcome == 'failure')
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_STG }}
          TG_CHAT: ${{ secrets.DOGFOOD_ALERT_CHAT_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SIGNUP_OUTCOME: ${{ steps.signup.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::warning::Production smoke failed but TELEGRAM_BOT_TOKEN_STG / DOGFOOD_ALERT_CHAT_ID are not set — no alert sent."
            exit 0
          fi

          # On push-to-main this job gates deploy-vps.yml (workflow_run on "Smoke Test"),
          # so a failure here has already stopped the deploy. On a PR it blocks nothing.
          if [ "${EVENT}" = "push" ]; then
            impact="deploy is BLOCKED (deploy-vps.yml gates on this workflow)"
          else
            impact="does NOT block this PR — smoke is not a required context"
          fi

          failed=""
          [ "${SMOKE_OUTCOME}" = "failure" ] && failed="${failed} smoke"
          [ "${SIGNUP_OUTCOME}" = "failure" ] && failed="${failed} signup-money-path"

          msg="$(printf 'FactoryLM — PRODUCTION smoke failed\nfailed:%s\nimpact: %s\nrun: https://github.com/%s/actions/runs/%s\ncontext: issue #3598 (intermittent 502 on app.factorylm.com/login)' \
            "${failed}" "${impact}" "${REPO}" "${RUN_ID}")"

          curl -s --max-time 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${msg}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null \
            && echo "Production smoke alert sent." || echo "::warning::Alert dispatch failed (non-fatal)."

      - name: Annotate PR with failure summary
        if: failure() && github.event_name == 'pull_request'
        # The wording is conditioned on which step failed: "broken on production"
        # is only asserted when a TEST step failed. A setup failure (bun install
        # on lockfile drift — the exact class the comment above the install step
        # documents — or a Playwright browser flake) never assessed production
        # and must not claim it is broken.
        run: |
          echo "## ❌ Smoke test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.smoke.outcome }}" = "failure" ] || [ "${{ steps.signup.outcome }}" = "failure" ]; then
            echo "The money path or a critical page is broken on production." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI setup failed (dependency install or browser provisioning) — production was NOT assessed. Fix the setup failure; do not treat this as a production outage." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Download the \`smoke-failures-${{ github.run_id }}\` artifact for screenshots." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | What was verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-----------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| factorylm.com/ | OG tags, FactoryLM title |" >> "$GITHUB_STEP_SUMMARY"
          echo "| factorylm.com/pricing | Pricing cards + Start Free Trial CTA |" >> "$GITHUB_STEP_SUMMARY"
          echo "| factorylm.com/cmms | Magic link email form |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /api/checkout/session | 303 → checkout.stripe.com |" >> "$GITHUB_STEP_SUMMARY"
          echo "| app.factorylm.com/ → /login | Redirect + email/password/Google |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **/quickstart** | **Public grounded chat returns an answer (money path, P1-1)** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **/api/quickstart/ask** | **Flood → HTTP 429 (rate-limit holds, P0-1)** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **/api/documents** | **Unauthenticated → 401, no asset data (tenant gate, P0-2)** |" >> "$GITHUB_STEP_SUMMARY"
