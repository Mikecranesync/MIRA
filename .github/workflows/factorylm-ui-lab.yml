name: Shared UI (factorylm-ui-lab)

# Enforces the FactoryLM unified-UI foundation (FLM-UI-4000 / V2-SHELL-001).
#
# WHY THIS EXISTS
# ---------------
# PR #3625 landed `packages/factorylm-{theme,interaction,ui}` and
# `apps/factorylm-ui-lab` — the theme-token contract, the interaction reducer,
# the immutable fixture contract, the shared shell, and a dependency-license
# audit. NO workflow referenced any of them, so every one of those gates was
# unenforced and shared-shell Tasks 5-8 would have landed into the same blind
# spot. See issue #3626 (comment 5560269014) for the finding.
#
# TWO THINGS THIS JOB DELIBERATELY DOES THAT A NAIVE `bun run verify` DOES NOT
# ----------------------------------------------------------------------------
# 1. It installs the LAB's own devDependencies first.
#    `bun run verify` -> `test` -> `bootstrap:ui`, and bootstrap-ui.ts only runs
#    `bun install --frozen-lockfile` against `packages/factorylm-ui`. The lab's
#    own devDependencies (notably `@happy-dom/global-registrator`, which
#    `src/test-setup.ts` preloads) are never installed by it, so a bare
#    `bun run verify` on a clean checkout dies with
#    `Cannot find module '@happy-dom/global-registrator'` and reports
#    0 pass / 4 fail — four "Unhandled error between tests" with no test bodies
#    executed. The explicit install step below is what makes the suite real.
#
# 2. It asserts the tests were actually COLLECTED, not merely that the job was
#    green. A bun test run whose preload fails still exits non-zero here, but a
#    future refactor that silently stops collecting a file would otherwise pass
#    unnoticed — `ci.yml` in this repo enumerates test paths by name, and that
#    class of drift is exactly how a guard becomes decorative. The assert step
#    greps the captured log for each contract suite by name and for the license
#    audit's success line. Green without those lines is not green.
#
# BUN VERSION
# -----------
# Pinned to the `packageManager` field in `apps/factorylm-ui-lab/package.json`
# (bun 1.4.0). `packages/factorylm-ui/bun.lock` is lockfileVersion 2, which
# bun 1.3.x cannot parse — it fails with `UnknownLockfileVersion` before any
# test runs. The version check below fails loudly if the pin and the installed
# runtime ever drift apart, rather than surfacing as a confusing lockfile error.
#
# SCOPE: unit/contract only. Playwright/browser-matrix, accessibility, and
# performance belong to shared-shell Task 8 and are intentionally NOT run here.

# REQUIRED-CONTEXT RULE
# ---------------------
# "Shared UI contract (bun 1.4.0)" is a required status check on `main`
# (registered 2026-09-06). A required check that is path-filtered never
# reports on PRs outside its paths, and GitHub then waits for it forever —
# #3592 (mira-web only) was blocked within minutes of registration. So the
# pull_request trigger is deliberately UNFILTERED: the job runs on every PR
# (about one minute) and always reports. Keep the path filter on push only.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/factorylm-ui-lab/**"
      - "packages/factorylm-theme/**"
      - "packages/factorylm-interaction/**"
      - "packages/factorylm-ui/**"
      - ".github/workflows/factorylm-ui-lab.yml"

concurrency:
  group: factorylm-ui-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-ui:
    name: Shared UI contract (bun 1.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/factorylm-ui-lab

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Bun version matches the packageManager pin
        run: |
          set -euo pipefail
          pinned="$(bun -e 'console.log(require("./package.json").packageManager.split("@")[1])')"
          actual="$(bun --version)"
          echo "packageManager pin: ${pinned} | runtime: ${actual}"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::bun ${actual} does not match the packageManager pin ${pinned}."
            echo "::error::packages/factorylm-ui/bun.lock is lockfileVersion 2 and needs bun >= 1.4."
            exit 1
          fi

      - name: Install the lab's own dependencies
        run: bun install --frozen-lockfile

      - name: Verify (test + type-check + license audit)
        run: |
          set -o pipefail
          bun run verify 2>&1 | tee /tmp/shared-ui-verify.log

      # Collection proof. `bun test` prints per-file names ONLY on failure — a
      # fully passing run emits just the "N pass / 0 fail" summary — so grepping
      # the console log for suite names can never work (it would fail on a
      # healthy run). The junit reporter is the machine-readable surface that
      # names every suite it actually executed.
      - name: Re-run the suites with the junit reporter
        run: |
          bun test ../../packages \
            --reporter=junit \
            --reporter-outfile=/tmp/shared-ui-junit.xml

      - name: Assert the contract suites actually ran
        run: |
          set -euo pipefail
          xml=/tmp/shared-ui-junit.xml
          log=/tmp/shared-ui-verify.log
          missing=0

          # Every shared-core suite on disk (packages/*/src/__tests__/*.test.*)
          # must appear in the junit xml. Derived from the tree rather than a
          # hand-maintained list: a list is wrong whenever the tree differs from
          # the moment someone typed it, and a suite added without a list edit
          # would silently stop being proven. Any file that never ran is named.
          # (The .tsx suites need the file: deps that `verify` -> bootstrap:ui
          # installed in the previous step — reorder those and this fails loud.)
          find ../../packages -path '*/src/__tests__/*.test.*' -exec basename {} \; | sort > /tmp/suites-on-disk.txt
          grep -oE '[A-Za-z0-9._-]+\.test\.tsx?' "$xml" | sort -u > /tmp/suites-in-junit.txt
          uncollected=$(comm -23 /tmp/suites-on-disk.txt /tmp/suites-in-junit.txt)
          if [ -n "$uncollected" ]; then
            echo "::error::suite file(s) on disk never ran: $(echo "$uncollected" | tr '\n' ' ')"
            missing=1
          else
            echo "ok   every suite on disk ($(wc -l < /tmp/suites-on-disk.txt | tr -d ' ')) is in the junit output"
          fi

          # A junit file naming every suite but running nothing is still a
          # no-op, so read the counts off the root <testsuites> element.
          tests=$(sed -n 's/.*<testsuites[^>]* tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)
          failures=$(sed -n 's/.*<testsuites[^>]* failures="\([0-9]*\)".*/\1/p' "$xml" | head -1)
          echo "junit: tests=${tests:-?} failures=${failures:-?}"
          if [ -z "${tests:-}" ] || [ "$tests" -lt 1 ]; then
            echo "::error::junit reports no executed tests."
            missing=1
          fi
          if [ -n "${failures:-}" ] && [ "$failures" -gt 0 ]; then
            echo "::error::junit reports ${failures} failing test(s)."
            missing=1
          fi

          # The license audit is part of `verify`, not of the test run, so it is
          # asserted against the console log.
          if grep -q "Dependency license audit passed" "$log"; then
            echo "ok   dependency license audit executed"
          else
            echo "::error::the dependency license audit did not report success."
            missing=1
          fi

          exit "$missing"

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-verify-log
          path: /tmp/shared-ui-verify.log
          if-no-files-found: warn

      # The static lab bundle, so a reviewer or a device-proof session can serve
      # dist/ without a local toolchain (Windows cannot `bun install` this lab
      # without Developer Mode, because Bun symlinks inside `file:` mirrors).
      - name: Upload built lab (dist/)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-lab-dist
          path: apps/factorylm-ui-lab/dist
          if-no-files-found: error
          retention-days: 14
