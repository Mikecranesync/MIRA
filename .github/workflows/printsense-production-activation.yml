name: PrintSense Production Activation

# ADR-0031 PR 8: make the staging-proven Together/MiniMax + required-Tesseract
# profile the durable production PrintSense configuration for Telegram + Slack.
#
# Runs ONLY on an explicit workflow_dispatch (#3709). It used to re-run after
# every Deploy to VPS and on every push touching its files, which meant a
# `--force-recreate` of the production Telegram + Slack bots on every merge —
# an operational hazard with no upside once the overlay is applied. Re-applying
# the overlay after a deploy is now a human decision: dispatch this workflow.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  # `gh pr comment` issues the GraphQL `addComment` mutation against a
  # PullRequest, which requires `pull-requests: write` — `issues: write` is
  # neither sufficient (the 2026-07-26 incident failed with "Resource not
  # accessible by integration" while it was granted) nor used by anything else
  # here, so it is deliberately absent: this job runs in the production
  # environment with VPS SSH secrets and carries no scope it does not need.
  pull-requests: write

env:
  ACTIVATION_PR: "2903"

jobs:
  authorize-source:
    name: Authorize exact production source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.authorize.outputs.source_sha }}
    steps:
      - name: Authorize exact current main source
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$*"
            exit 1
          }

          [ "$GITHUB_REF" = "refs/heads/main" ] || \
            fail "production activation controller must run from main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              ;;
            *)
              fail "unsupported production activation event: $GITHUB_EVENT_NAME"
              ;;
          esac

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            fail "activation source must be a lowercase 40-character SHA"
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || \
            fail "refusing a stale production activation controller"
          [ "$SOURCE_SHA" = "$CURRENT_MAIN_SHA" ] || \
            fail "refusing a production activation for anything except current main"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify source PR passed Staging Gate
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.authorize.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_HEAD_SHA=$(gh api "/repos/$REPO/commits/$DEPLOY_SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == "'"$DEPLOY_SHA"'") | .head.sha] | first // empty' \
            2>/dev/null || echo "")
          if [ -z "$PR_HEAD_SHA" ]; then
            PR_HEAD_SHA=$(gh api "/repos/$REPO/commits/$DEPLOY_SHA/pulls" \
              --jq '.[0].head.sha // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$PR_HEAD_SHA" ]; then
            echo "::error::No PR associated with activation SHA $DEPLOY_SHA"
            exit 1
          fi
          STATUS=$(gh run list --repo "$REPO" --workflow "Staging Gate" \
            --commit "$PR_HEAD_SHA" --limit 1 --json status,conclusion \
            --jq '.[0] | "\(.status):\(.conclusion)"' 2>/dev/null || echo "")
          echo "Staging Gate for PR head $PR_HEAD_SHA: $STATUS"
          test "$STATUS" = "completed:success"

  activate:
    name: Activate Together/MiniMax PrintSense in production
    needs: authorize-source
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout activation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-source.outputs.source_sha }}
          persist-credentials: false

      - name: Revalidate exact current main source
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_SHA: ${{ needs.authorize-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::refusing a stale production activation controller"
            exit 1
          }
          [ "$AUTHORIZED_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::refusing a stale authorized production source"
            exit 1
          }

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Apply production profile and verify live
        env:
          ACTIVATION_SHA: ${{ needs.authorize-source.outputs.source_sha }}
        run: |
          ssh -i ~/.ssh/vps_deploy_key -o StrictHostKeyChecking=yes \
            root@165.245.138.91 bash -s -- "$ACTIVATION_SHA" <<'ENDSSH'
          set -euo pipefail
          TARGET_SHA="$1"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd /opt/mira

          touch /opt/mira/.deploy-in-progress
          trap 'rm -f /opt/mira/.deploy-in-progress' EXIT

          echo "=== Pin activation code to the authorized current-main SHA ==="
          git fetch origin main --tags --force
          FETCHED_SHA="$(git rev-parse FETCH_HEAD)"
          test "$FETCHED_SHA" = "$TARGET_SHA"
          git reset --hard "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f docker-compose.printsense-production.yml

          # Deploy identity must be exported HERE too, not only in deploy-vps.yml.
          # This workflow runs AFTER a deploy and rebuilds the two bot images, so
          # whatever it bakes in is what actually runs. Before #3064 the bots read
          # a COPY'd /VERSION file and this path inherited the right answer for
          # free; now the version arrives as a BUILD ARG, so a rebuild without
          # these exports resolves `${MIRA_APP_VERSION:-unknown}` to "unknown" and
          # silently overwrites the identity the deploy just baked. Observed live
          # on 2026-08-03: mira-pipeline reported 3.248.0 while mira-bot-telegram
          # reported "unknown" — same commit, same minute, different build path.
          #
          # Derived from the tag at the immutable authorized SHA. No tag means
          # "unknown", which is the honest answer rather than a plausible wrong one.
          PS_RELEASE_TAG="$(git tag --points-at "$TARGET_SHA" --list 'v[0-9]*' | sort -V | tail -1)"
          export MIRA_APP_VERSION="${PS_RELEASE_TAG#v}"
          export MIRA_APP_VERSION="${MIRA_APP_VERSION:-unknown}"
          export MIRA_GIT_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          export MIRA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploy identity: sha=${MIRA_GIT_SHA} version=${MIRA_APP_VERSION} built=${MIRA_BUILD_TIME}"

          COMPOSE="docker compose -f docker-compose.saas.yml -f docker-compose.printsense-production.yml"

          echo "=== Validate production overlay ==="
          doppler run --project factorylm --config prd -- $COMPOSE config >/tmp/printsense-production-compose.yml

          echo "=== Rebuild and recreate production bot surfaces ==="
          DOCKER_BUILDKIT=1 doppler run --project factorylm --config prd -- \
            $COMPOSE build mira-bot-telegram mira-bot-slack
          doppler run --project factorylm --config prd -- \
            $COMPOSE up -d --no-deps --force-recreate mira-bot-telegram mira-bot-slack

          sleep 12

          echo "=== Assert exact non-secret production configuration ==="
          for container in mira-bot-telegram mira-bot-slack; do
            docker exec "$container" sh -ec '
              test "$PRINT_VISION_PROVIDER" = "together"
              test "$PRINT_VISION_MODEL" = "MiniMaxAI/MiniMax-M3"
              # Assert the RESOLVED vision model, not the raw variable. compose
              # passes ${TOGETHERAI_VISION_MODEL:-}, i.e. an EMPTY STRING by
              # design, and router.py resolves it with the or-form
              #   os.getenv("TOGETHERAI_VISION_MODEL") or "MiniMaxAI/MiniMax-M3"
              # so empty IS the intended production state (docker-compose.saas.yml
              # documents this). Asserting the raw var equalled the model id could
              # never pass and made this gate red for 100+ consecutive runs.
              # ${VAR:-default} mirrors the Python or-form (unset AND empty both take
              # the default), so this still FAILS if someone pins a different model.
              test "${TOGETHERAI_VISION_MODEL:-MiniMaxAI/MiniMax-M3}" = "MiniMaxAI/MiniMax-M3"
              test "$PRINT_PROVIDER_POLICY" = "strict"
              test "$PRINT_ENFORCE_APPROVED_MODELS" = "1"
              test "$FACTORYLM_NETWORK_MODE" = "enabled"
              test "$OCR_REQUIRE_TESSERACT" = "1"
              test -n "$TOGETHERAI_API_KEY"
            '
            HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")
            echo "$container health=$HEALTH"
            test "$HEALTH" = "healthy"

            # The rebuild above must carry the SAME identity the deploy baked —
            # not "unknown", and not a stale earlier version. Compared against the
            # value exported for this build rather than merely asserting non-empty,
            # so a future path that rebuilds without the exports fails HERE instead
            # of shipping a container that lies about which code it is running.
            GOT_VER=$(docker exec "$container" sh -c 'printf %s "$MIRA_APP_VERSION"')
            echo "$container MIRA_APP_VERSION=$GOT_VER (expected $MIRA_APP_VERSION)"
            test "$GOT_VER" = "$MIRA_APP_VERSION"
          done

          echo "=== Run network-free readiness in both containers ==="
          docker exec mira-bot-telegram python -m factorylm_ai.readiness \
            --profile printsense --environment production >/tmp/telegram-printsense-readiness.json
          docker exec mira-bot-slack python -m factorylm_ai.readiness \
            --profile printsense --environment production >/tmp/slack-printsense-readiness.json
          cat /tmp/telegram-printsense-readiness.json
          cat /tmp/slack-printsense-readiness.json

          echo "=== Run live Together/MiniMax known-token canary from production container ==="
          docker cp tools/canary_fixtures/vision_canary.png \
            mira-bot-telegram:/tmp/vision_canary.png
          docker exec mira-bot-telegram python -c '
          import json
          from factorylm_ai import readiness
          readiness._VISION_FIXTURE = "/tmp/vision_canary.png"
          report = readiness.collect("printsense", live=True, environment="production")
          assert report["verdict"] == "ready", report
          assert report["provider"]["resolved"] == "together", report
          assert report["provider"]["model"] == "MiniMaxAI/MiniMax-M3", report
          assert report["provider"]["vision_probe"] == "ok", report
          assert report["ocr"]["available"] is True, report
          print(json.dumps(report, indent=2))
          '

          echo "=== Production activation complete ==="
          doppler run --project factorylm --config prd -- $COMPOSE ps \
            mira-bot-telegram mira-bot-slack
          ENDSSH

      - name: Record rollback control
        # Cosmetic (step-summary text). The last remaining step of the reporting
        # class that could flip the verdict after the activation itself passed —
        # and with pull-requests:write now granted, a flip here would actually
        # POST the false "checks did not complete" comment, not just try to.
        continue-on-error: true
        run: |
          {
            echo "## PrintSense production profile"
            echo ""
            echo "Activated: Together / MiniMaxAI/MiniMax-M3 / strict / required Tesseract"
            echo ""
            echo "Rollback without code removal: set PRINTSENSE_PROD_PROVIDER and"
            echo "PRINTSENSE_PROD_MODEL in Doppler factorylm/prd to an approved pair,"
            echo "then re-run this workflow. The registry, OCR enforcement, provenance,"
            echo "and typed failure behavior remain active."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report activation success
        if: ${{ success() }}
        # Reporting must never decide the verdict. This step failing (a token
        # permission, a GitHub outage, a deleted PR) previously flipped a fully
        # verified activation to `failure`, which then ran the failure reporter,
        # which posted "did not complete all required provider, OCR,
        # container-health, and live-vision checks" — of an activation whose
        # every check had passed. The fail-closed guarantee lives in the
        # verification steps above, and they still fail hard.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTIVATED_SHA: ${{ needs.authorize-source.outputs.source_sha }}
        run: |
          gh pr comment "$ACTIVATION_PR" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ## ✅ Production activation verified

          The production Telegram and Slack containers passed the fail-closed activation checks.

          - Provider: \`together\`
          - Model: \`MiniMaxAI/MiniMax-M3\`
          - Policy: \`strict\`
          - Approved-model enforcement: enabled
          - Tesseract: required and available
          - Together key: present (value never logged)
          - Live known-token vision canary: passed
          - Activated revision: \`$ACTIVATED_SHA\`

          Run: $RUN_URL
          EOF
          )"

      - name: Report activation failure
        if: ${{ failure() }}
        # Same reasoning: a real activation failure must stay visible as a failed
        # run even if the comment cannot be posted. Without this, an unpostable
        # comment masks the reason in noise.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPTED_SHA: ${{ needs.authorize-source.outputs.source_sha }}
        run: |
          gh pr comment "$ACTIVATION_PR" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ## ❌ Production activation failed closed

          The activation workflow did not complete all required provider, OCR, container-health, and live-vision checks. The workflow exited non-zero rather than declaring the profile active.

          Attempted revision: \`$ATTEMPTED_SHA\`

          Run: $RUN_URL
          EOF
          )"
