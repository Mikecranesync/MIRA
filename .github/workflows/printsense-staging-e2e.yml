name: PrintSense OCR staging observer

# Read-only health observation for the staging OCR lane. The former Telegram
# E2E/auto-merge path for PR #2665 is retired because that PR is closed and its
# harness has been superseded.
#
# Deployment HOLD: the `staging-observe` environment must be provisioned with a
# dedicated non-root account and key. The server-side authorized_keys entry must
# restrict that key to a read-only `factorylm-ocr-lane-health` command (no shell,
# forwarding, PTY, agent forwarding, or write-capable Docker access). This
# workflow deliberately does not provision or broaden that external identity.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: printsense-ocr-staging-observer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize-source:
    name: Authorize current main source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source_sha: ${{ steps.authorize.outputs.source_sha }}
    steps:
      - name: Authorize exact current main source
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *)
              echo "::error::unsupported observer event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::the OCR observer may run only from refs/heads/main"
            exit 1
          }

          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::refusing stale source $GITHUB_SHA; current main is $CURRENT_MAIN_SHA"
            exit 1
          }

          printf 'source_sha=%s\n' "$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"

  ocr-lane-health:
    name: OCR-lane health probe (staging bot)
    needs: authorize-source
    runs-on: ubuntu-latest
    environment: staging-observe
    timeout-minutes: 5
    steps:
      - name: Checkout committed SSH host identity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-source.outputs.source_sha }}
          sparse-checkout: deployment/known_hosts.factorylm-prod
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Revalidate source and probe identity
        id: revalidate
        env:
          AUTHORIZED_SOURCE_SHA: ${{ needs.authorize-source.outputs.source_sha }}
          PROBE_USER: ${{ vars.STAGING_OCR_PROBE_USER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::workflow source is no longer current main"
            exit 1
          }
          [ "$AUTHORIZED_SOURCE_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::authorized source is no longer current main"
            exit 1
          }

          [[ "$PROBE_USER" =~ ^[a-z_][a-z0-9_-]{0,30}$ ]] || {
            echo "::error::STAGING_OCR_PROBE_USER is missing or invalid"
            exit 1
          }
          [ "$PROBE_USER" != "root" ] || {
            echo "::error::the OCR probe identity must be non-root"
            exit 1
          }

          printf 'probe_user=%s\n' "$PROBE_USER" >> "$GITHUB_OUTPUT"

      - name: Configure scoped probe credential
        env:
          STAGING_OCR_PROBE_SSH_KEY: ${{ secrets.STAGING_OCR_PROBE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_OCR_PROBE_SSH_KEY" ] || {
            echo "::error::STAGING_OCR_PROBE_SSH_KEY is not configured"
            exit 1
          }

          install -d -m 700 "$RUNNER_TEMP/printsense-ssh"
          printf '%s\n' "$STAGING_OCR_PROBE_SSH_KEY" \
            > "$RUNNER_TEMP/printsense-ssh/probe_key"
          chmod 600 "$RUNNER_TEMP/printsense-ssh/probe_key"
          install -m 600 deployment/known_hosts.factorylm-prod \
            "$RUNNER_TEMP/printsense-ssh/known_hosts"

      - name: Observe OCR-lane health
        env:
          PROBE_USER: ${{ steps.revalidate.outputs.probe_user }}
        run: |
          set -euo pipefail

          SSH_OPTIONS=(
            -i "$RUNNER_TEMP/printsense-ssh/probe_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/printsense-ssh/known_hosts"
            -o ConnectTimeout=10
          )
          REPORT_PATH="$RUNNER_TEMP/ocr-lane-report.json"

          # The dedicated key must be bound server-side to the read-only command
          # documented above. The requested command is an auditable allowlist
          # sentinel; it is never a general shell command.
          ssh "${SSH_OPTIONS[@]}" "$PROBE_USER@165.245.138.91" \
            "factorylm-ocr-lane-health --format=json" > "$REPORT_PATH"

          python3 - "$REPORT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path(sys.argv[1])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid OCR-lane probe response: {exc}") from exc

          print(json.dumps(report, sort_keys=True))
          if not isinstance(report, dict) or report.get("verdict") != "ok":
              raise SystemExit("staging OCR-lane verdict is not ok")
          PY
