name: Deploy to Staging VPS

# Deploys the docker-compose.staging-vps.yml stack to the production VPS
# (165.245.138.91) under a separate Docker network, with stg-* container
# names and offset host ports (4xxx). Production stack on saas.yml is
# never touched — see docs/runbooks/staging-vps.md for isolation rules.

on:
  workflow_dispatch:
    inputs:
      approved_rc_sha:
        description: "Immutable approved release candidate SHA (exactly 40 lowercase hex characters)"
        required: true
        type: string
      services:
        description: "Space-separated services to rebuild (blank = all)"
        required: false
        default: ""
        type: string
      reset_volumes:
        description: "Destroy staging volumes before bringing up (DANGER — wipes staging Atlas DB)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: deploy-staging-vps
  cancel-in-progress: false

jobs:
  authorize-target:
    name: Authorize staging source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_rc_sha: ${{ steps.validate.outputs.approved_rc_sha }}
      services: ${{ steps.validate.outputs.services }}
      reset_volumes: ${{ steps.validate.outputs.reset_volumes }}

    steps:
      - name: Authorize exact staging source and inputs
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RC_SHA: ${{ inputs.approved_rc_sha }}
          SERVICES_INPUT: ${{ inputs.services }}
          RESET_VOLUMES_INPUT: ${{ inputs.reset_volumes }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || \
            fail "staging deploys require a manual workflow_dispatch"
          [ "$GITHUB_REF" = "refs/heads/main" ] || \
            fail "dispatch this trusted workflow from refs/heads/main"
          [[ "$APPROVED_RC_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            fail "approved_rc_sha must be a lowercase 40-character commit SHA"

          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_RC_SHA" --jq '.sha' >/dev/null 2>&1; then
            fail "SHA $APPROVED_RC_SHA not present in the repository"
          fi

          if [ -n "$SERVICES_INPUT" ]; then
            SERVICE_LIST_PATTERN='^[a-z0-9-]+( [a-z0-9-]+)*$'
            [[ "$SERVICES_INPUT" =~ $SERVICE_LIST_PATTERN ]] || \
              fail "services must be a single-space-separated list of service names"

            SEEN_SERVICES=" "
            for service in $SERVICES_INPUT; do
              case "$service" in
                atlas-api|atlas-db|atlas-frontend|atlas-minio|mira-bot-telegram|mira-cmms-sync|mira-hub|mira-mcp|mira-pipeline|mira-tika|mira-web)
                  ;;
                *)
                  fail "service is not in the staging compose allowlist: $service"
                  ;;
              esac
              case "$SEEN_SERVICES" in
                *" $service "*) fail "duplicate staging service: $service" ;;
              esac
              SEEN_SERVICES="${SEEN_SERVICES}${service} "
            done
          fi

          case "$RESET_VOLUMES_INPUT" in
            true|false) ;;
            *) fail "reset_volumes must be exactly true or false" ;;
          esac

          {
            printf 'approved_rc_sha=%s\n' "$APPROVED_RC_SHA"
            printf 'services=%s\n' "$SERVICES_INPUT"
            printf 'reset_volumes=%s\n' "$RESET_VOLUMES_INPUT"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy MIRA staging to VPS
    needs: authorize-target
    runs-on: ubuntu-latest
    environment: staging-deploy
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-target.outputs.approved_rc_sha }}
          persist-credentials: false

      - name: Require HEAD == approved_rc_sha
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-target.outputs.approved_rc_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "$APPROVED_RC_SHA" ]; then
            echo "::error::HEAD ($CHECKED_OUT) != approved_rc_sha ($APPROVED_RC_SHA)"
            exit 1
          fi

      - name: Revalidate deploy user
        id: revalidate
        env:
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            echo "::error::STAGING_DEPLOY_USER is missing or invalid"
            exit 1
          }
          [ "$DEPLOY_USER" != "root" ] || {
            echo "::error::STAGING_DEPLOY_USER must be a scoped non-root account"
            exit 1
          }
          printf 'deploy_user=%s\n' "$DEPLOY_USER" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_DEPLOY_SSH_KEY" ] || {
            echo "::error::STAGING_DEPLOY_SSH_KEY is not configured"
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Deploy exact authorized staging source
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-target.outputs.approved_rc_sha }}
          SERVICES: ${{ needs.authorize-target.outputs.services }}
          RESET_VOLUMES: ${{ needs.authorize-target.outputs.reset_volumes }}
          DEPLOY_USER: ${{ steps.revalidate.outputs.deploy_user }}
        run: |
          set -euo pipefail
          {
            printf 'APPROVED_RC_SHA=%q\n' "$APPROVED_RC_SHA"
            printf 'SERVICES=%q\n' "$SERVICES"
            printf 'RESET_VOLUMES=%q\n' "$RESET_VOLUMES"
            cat <<'ENDSSH'

          set -euo pipefail

          # Staging lives in its own working copy so a force-reset here never
          # touches the production checkout at /opt/mira.
          STG_DIR=/opt/mira-staging
          if [ ! -d "$STG_DIR/.git" ]; then
            echo "=== First-time clone of staging working copy ==="
            git clone --no-checkout https://github.com/Mikecranesync/MIRA.git "$STG_DIR"
          fi

          cd "$STG_DIR"
          mkdir -p data data/sessions data/agent-runs

          echo "=== Fetch exact authorized code ==="
          git remote set-url origin https://github.com/Mikecranesync/MIRA.git
          git fetch --no-tags origin "$APPROVED_RC_SHA"
          FETCHED_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          [ "$FETCHED_SHA" = "$APPROVED_RC_SHA" ] || {
            echo "Refusing deploy: fetched SHA does not match authorized SHA" >&2
            exit 1
          }
          git reset --hard "$APPROVED_RC_SHA"
          [ "$(git rev-parse HEAD)" = "$APPROVED_RC_SHA" ] || {
            echo "Refusing deploy: staging checkout did not reach authorized SHA" >&2
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet
          UNTRACKED_FILES="$(git ls-files --others --exclude-standard)"
          [ -z "$UNTRACKED_FILES" ] || {
            echo "Refusing deploy: staging checkout contains untracked files" >&2
            exit 1
          }

          # mira-bot-telegram MUST be in the default set: the staging Telegram
          # smoke (nameplate photo -> Drive Commander pack answer) runs against
          # stg-mira-bot-telegram, and build/force-recreate below are scoped to
          # $TARGETS, so omitting it leaves the bot on a stale image forever
          # (a `docker compose up -d` alone never rebuilds). NOTE: mira-bot-slack
          # is intentionally NOT here — staging runs no Slack bot (see the
          # header comment in docker-compose.staging-vps.yml; SLACK_BOT_TOKEN is
          # deliberately omitted), so adding it would fail `compose build`.
          TARGETS="${SERVICES:-mira-pipeline mira-mcp mira-hub mira-web mira-bot-telegram}"
          read -r -a TARGET_LIST <<< "$TARGETS"
          echo "Rebuild targets: $TARGETS"

          if [ "${RESET_VOLUMES:-false}" = "true" ]; then
            echo "=== RESET_VOLUMES=true — destroying staging volumes ==="
            doppler run --project factorylm --config stg -- \
              docker compose -f docker-compose.staging-vps.yml down -v
          fi

          echo "=== Pre-deploy cleanup: remove any stale stg-* containers ==="
          for svc in "${TARGET_LIST[@]}" atlas-api atlas-db atlas-minio; do
            docker rm -f "stg-${svc}" 2>/dev/null || true
          done

          # Deploy identity — bake the SHA/version/time into the hub and web images
          # so /api/version + /api/health report which code is live.
          # `/VERSION` was retired 2026-08-02 (#3064); the version is derived from
          # the highest v* tag pointing AT the approved SHA. Missing tag → "unknown".
          export MIRA_GIT_SHA="$APPROVED_RC_SHA"
          git fetch --tags --force origin 2>/dev/null || true
          TAGS_AT_SHA="$(git tag --points-at "$APPROVED_RC_SHA" --list 'v[0-9]*' 2>/dev/null | sort -V | tail -1)"
          export MIRA_APP_VERSION="${TAGS_AT_SHA#v}"
          export MIRA_APP_VERSION="${MIRA_APP_VERSION:-unknown}"
          export MIRA_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Staging deploy identity: sha=${MIRA_GIT_SHA} version=${MIRA_APP_VERSION} built=${MIRA_BUILD_TIME}"

          echo "=== Build staging images (no-cache, fresh base) ==="
          DOCKER_BUILDKIT=1 doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml build --no-cache --pull "${TARGET_LIST[@]}"

          echo "=== Bring up full staging stack ==="
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml up -d --remove-orphans

          # Force-recreate only the rebuilt services so their new images take effect.
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml up -d --no-deps --force-recreate "${TARGET_LIST[@]}"

          echo "=== Built image identities ==="
          BUILT_IDS="$(mktemp)"
          for svc in "${TARGET_LIST[@]}"; do
            img="$(doppler run --project factorylm --config stg -- docker compose -f docker-compose.staging-vps.yml config --images "$svc" | head -1)"
            [ -n "$img" ] || { echo "::error::compose reports no image for ${svc} — failing closed."; exit 1; }
            id="$(docker image inspect --format '{{.Id}}' "$img")"
            [ -n "$id" ] || { echo "::error::no built image id for ${svc} (${img}) — failing closed."; exit 1; }
            echo "${svc}=${id}" | tee -a "$BUILT_IDS"
          done

          echo "=== Running image identities must equal the built ones ==="
          RUNNING_IDS="$(mktemp)"
          for svc in "${TARGET_LIST[@]}"; do
            cid="$(doppler run --project factorylm --config stg -- docker compose -f docker-compose.staging-vps.yml ps -q "$svc")"
            [ -n "$cid" ] || { echo "::error::no running container for ${svc} after the swap — failing closed."; exit 1; }
            running="$(docker inspect --format '{{.Image}}' "$cid")"
            built="$(grep "^${svc}=" "$BUILT_IDS" | cut -d= -f2-)"
            if [ -z "$running" ] || [ "$running" != "$built" ]; then
              echo "::error::built/running image mismatch for ${svc}: built=${built} running=${running} — STOP."
              exit 1
            fi
            echo "${svc}=${running}" | tee -a "$RUNNING_IDS"
          done

          echo "=== Health checks (fail closed) ==="
          sleep 10
          echo "--- stg-mira-hub (4101) ---"
          curl -sfL -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4101/api/health
          echo "--- stg-mira-pipeline (4099) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4099/health
          echo "--- stg-atlas-api (4088) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4088/

          # Runtime identity — for every deployed surface the reported gitSha MUST
          # equal the approved SHA. An unreadable answer is a STOP, not a warning.
          HUB_GIT_SHA=""
          if [[ " $TARGETS " == *" mira-hub "* ]]; then
            echo "=== Staging hub runtime identity ==="
            HUB_GIT_SHA="$(curl -sfL http://127.0.0.1:4101/api/version | python3 -c "import sys,json; print(json.load(sys.stdin).get('gitSha',''))")"
            if [ "$HUB_GIT_SHA" != "$APPROVED_RC_SHA" ]; then
              echo "::error::stg-mira-hub runtime gitSha '${HUB_GIT_SHA}' != approved ${APPROVED_RC_SHA} — STOP."
              exit 1
            fi
            echo "mira-hub reports gitSha=${HUB_GIT_SHA} (== approved)"
          fi

          WEB_GIT_SHA=""
          if [[ " $TARGETS " == *" mira-web "* ]]; then
            echo "=== Staging web runtime identity ==="
            WEB_GIT_SHA="$(curl -sfL http://127.0.0.1:4200/api/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('gitSha',''))")"
            if [ "$WEB_GIT_SHA" != "$APPROVED_RC_SHA" ]; then
              echo "::error::stg-mira-web runtime gitSha '${WEB_GIT_SHA}' != approved ${APPROVED_RC_SHA} — STOP."
              exit 1
            fi
            echo "mira-web reports gitSha=${WEB_GIT_SHA} (== approved)"
          fi

          echo "=== Deploy complete ==="
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

          # One-line machine-readable receipt; the runner extracts, verifies and
          # uploads it as the durable staging-receipt-<sha> artifact.
          BUILT_IDS="$BUILT_IDS" RUNNING_IDS="$RUNNING_IDS" \
          APPROVED_RC_SHA="$APPROVED_RC_SHA" MIRA_APP_VERSION="$MIRA_APP_VERSION" \
          HUB_GIT_SHA="$HUB_GIT_SHA" WEB_GIT_SHA="$WEB_GIT_SHA" \
          python3 - <<'PYRECEIPT'
          import json, os, datetime
          def pairs(path):
              out = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if "=" in line:
                          k, v = line.split("=", 1)
                          out[k] = v
              return out
          receipt = {
              "schema": "factorylm.deploy-receipt/1",
              "environment": "staging",
              "approved_rc_sha": os.environ["APPROVED_RC_SHA"],
              "release_tag": ("v" + os.environ["MIRA_APP_VERSION"]) if os.environ.get("MIRA_APP_VERSION", "unknown") != "unknown" else None,
              # Only surfaces that were deployed AND answered are reported; the
              # verifier treats every reported value as mandatory-equal and never
              # lets one matching surface stand in for a missing one.
              "runtime": {
                  svc: sha
                  for svc, sha in (("mira-hub", os.environ.get("HUB_GIT_SHA", "")), ("mira-web", os.environ.get("WEB_GIT_SHA", "")))
                  if sha
              },
              "built_images": pairs(os.environ["BUILT_IDS"]),
              "running_images": pairs(os.environ["RUNNING_IDS"]),
              "target": {"host": "165.245.138.91", "compose": "docker-compose.staging-vps.yml"},
              "deployed_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          print("FACTORYLM_DEPLOY_RECEIPT_JSON=" + json.dumps(receipt, separators=(",", ":"), sort_keys=True))
          PYRECEIPT
          rm -f "$BUILT_IDS" "$RUNNING_IDS"

          # Hard guard — fail loudly if any production container disappeared.
          PROD_RUNNING=$(docker ps --filter "name=^mira-" --filter "status=running" --format '{{.Names}}' | grep -v '^stg-' | wc -l)
          echo "Production mira-* containers still running: $PROD_RUNNING"
          if [ "$PROD_RUNNING" -lt 3 ]; then
            echo "::error::Production container count looks too low — investigate before declaring success"
            exit 1
          fi
          ENDSSH
          } | ssh \
            -i ~/.ssh/staging_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -l "$DEPLOY_USER" \
            165.245.138.91 \
            'bash -s' 2>&1 | tee "$RUNNER_TEMP/staging-deploy.out"

      - name: Extract and verify the staging receipt
        env:
          APPROVED_RC_SHA: ${{ needs.authorize-target.outputs.approved_rc_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/staging_receipt.py extract --log "$RUNNER_TEMP/staging-deploy.out" --out staging-receipt.json \
            --set "run_url=$RUN_URL" --set "run_id=$RUN_ID"
          python3 tools/staging_receipt.py verify --receipt staging-receipt.json \
            --approved-rc-sha "$APPROVED_RC_SHA" --environment staging --max-age-hours 1 \
            --require-services ""

      - name: Upload staging receipt (90-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-receipt-${{ needs.authorize-target.outputs.approved_rc_sha }}
          path: staging-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Print staging URL
        if: success()
        run: |
          echo "::notice::Staging deployed at ${{ needs.authorize-target.outputs.approved_rc_sha }}"
          echo "::notice::Staging Hub: http://165.245.138.91:4101"
          echo "::notice::Staging Web: http://165.245.138.91:4200"
          echo "::notice::Staging Pipeline: http://165.245.138.91:4099/health"
          echo "::notice::Staging Atlas API: http://165.245.138.91:4088"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed; inspect the protected staging-deploy job logs."
