name: Deploy to Staging VPS

# Deploys the docker-compose.staging-vps.yml stack to the production VPS
# (165.245.138.91) under a separate Docker network, with stg-* container
# names and offset host ports (4xxx). Production stack on saas.yml is
# never touched — see docs/runbooks/staging-vps.md for isolation rules.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact Git ref to deploy (main only)"
        required: true
        type: choice
        options:
          - refs/heads/main
      target_sha:
        description: "Exact 40-character current main commit to deploy"
        required: true
        type: string
      services:
        description: "Space-separated services to rebuild (blank = all)"
        required: false
        default: ""
        type: string
      reset_volumes:
        description: "Destroy staging volumes before bringing up (DANGER — wipes staging Atlas DB)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: deploy-staging-vps
  cancel-in-progress: false

jobs:
  authorize-target:
    name: Authorize exact main staging target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_ref: ${{ steps.authorize.outputs.target_ref }}
      target_sha: ${{ steps.authorize.outputs.target_sha }}
      services: ${{ steps.authorize.outputs.services }}
      reset_volumes: ${{ steps.authorize.outputs.reset_volumes }}

    steps:
      - name: Authorize exact staging source and inputs
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          SERVICES_INPUT: ${{ inputs.services }}
          RESET_VOLUMES_INPUT: ${{ inputs.reset_volumes }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || \
            fail "staging deploys require a manual workflow_dispatch"
          [ "$GITHUB_REF" = "refs/heads/main" ] || \
            fail "dispatch this trusted workflow from refs/heads/main"
          [ "$TARGET_REF_INPUT" = "refs/heads/main" ] || \
            fail "target_ref must be refs/heads/main"
          [[ "$TARGET_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || \
            fail "target_sha must be a lowercase 40-character commit SHA"

          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            fail "GitHub returned an invalid current main SHA"
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || \
            fail "workflow source is stale; dispatch the current main head"
          [ "$TARGET_SHA_INPUT" = "$CURRENT_MAIN_SHA" ] || \
            fail "target_sha is not the current remote main head"

          if [ -n "$SERVICES_INPUT" ]; then
            SERVICE_LIST_PATTERN='^[a-z0-9-]+( [a-z0-9-]+)*$'
            [[ "$SERVICES_INPUT" =~ $SERVICE_LIST_PATTERN ]] || \
              fail "services must be a single-space-separated list of service names"

            SEEN_SERVICES=" "
            for service in $SERVICES_INPUT; do
              case "$service" in
                atlas-api|atlas-db|atlas-frontend|atlas-minio|mira-bot-telegram|mira-cmms-sync|mira-hub|mira-mcp|mira-pipeline|mira-tika|mira-web)
                  ;;
                *)
                  fail "service is not in the staging compose allowlist: $service"
                  ;;
              esac
              case "$SEEN_SERVICES" in
                *" $service "*) fail "duplicate staging service: $service" ;;
              esac
              SEEN_SERVICES="${SEEN_SERVICES}${service} "
            done
          fi

          case "$RESET_VOLUMES_INPUT" in
            true|false) ;;
            *) fail "reset_volumes must be exactly true or false" ;;
          esac

          {
            printf 'target_ref=%s\n' "$TARGET_REF_INPUT"
            printf 'target_sha=%s\n' "$TARGET_SHA_INPUT"
            printf 'services=%s\n' "$SERVICES_INPUT"
            printf 'reset_volumes=%s\n' "$RESET_VOLUMES_INPUT"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy MIRA staging to VPS
    needs: authorize-target
    runs-on: ubuntu-latest
    environment: staging-deploy
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize-target.outputs.target_sha }}
          persist-credentials: false

      - name: Revalidate current main and deploy user
        id: revalidate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_TARGET_REF: ${{ needs.authorize-target.outputs.target_ref }}
          AUTHORIZED_TARGET_SHA: ${{ needs.authorize-target.outputs.target_sha }}
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::staging deploy controller is no longer on main"
            exit 1
          }
          [ "$GITHUB_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::main moved after authorization; dispatch a fresh run"
            exit 1
          }
          [ "$AUTHORIZED_TARGET_REF" = "refs/heads/main" ] || {
            echo "::error::authorized target ref is not main"
            exit 1
          }
          [ "$AUTHORIZED_TARGET_SHA" = "$CURRENT_MAIN_SHA" ] || {
            echo "::error::authorized target is no longer current main"
            exit 1
          }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            echo "::error::STAGING_DEPLOY_USER is missing or invalid"
            exit 1
          }
          [ "$DEPLOY_USER" != "root" ] || {
            echo "::error::STAGING_DEPLOY_USER must be a scoped non-root account"
            exit 1
          }
          printf 'deploy_user=%s\n' "$DEPLOY_USER" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_DEPLOY_SSH_KEY" ] || {
            echo "::error::STAGING_DEPLOY_SSH_KEY is not configured"
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          install -m 600 deployment/known_hosts.factorylm-prod ~/.ssh/known_hosts

      - name: Deploy exact authorized staging source
        env:
          TARGET_REF: ${{ needs.authorize-target.outputs.target_ref }}
          TARGET_SHA: ${{ needs.authorize-target.outputs.target_sha }}
          SERVICES: ${{ needs.authorize-target.outputs.services }}
          RESET_VOLUMES: ${{ needs.authorize-target.outputs.reset_volumes }}
          DEPLOY_USER: ${{ steps.revalidate.outputs.deploy_user }}
        run: |
          set -euo pipefail
          {
            printf 'TARGET_REF=%q\n' "$TARGET_REF"
            printf 'TARGET_SHA=%q\n' "$TARGET_SHA"
            printf 'SERVICES=%q\n' "$SERVICES"
            printf 'RESET_VOLUMES=%q\n' "$RESET_VOLUMES"
            cat <<'ENDSSH'

          set -euo pipefail

          # Staging lives in its own working copy so a force-reset here never
          # touches the production checkout at /opt/mira.
          STG_DIR=/opt/mira-staging
          if [ ! -d "$STG_DIR/.git" ]; then
            echo "=== First-time clone of staging working copy ==="
            git clone --no-checkout https://github.com/Mikecranesync/MIRA.git "$STG_DIR"
          fi

          cd "$STG_DIR"
          mkdir -p data data/sessions data/agent-runs

          echo "=== Fetch exact authorized code ==="
          git remote set-url origin https://github.com/Mikecranesync/MIRA.git
          git fetch --no-tags origin "$TARGET_REF"
          FETCHED_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          [ "$FETCHED_SHA" = "$TARGET_SHA" ] || {
            echo "Refusing deploy: fetched ref no longer matches authorized SHA" >&2
            exit 1
          }
          git reset --hard "$TARGET_SHA"
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ] || {
            echo "Refusing deploy: staging checkout did not reach authorized SHA" >&2
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet
          UNTRACKED_FILES="$(git ls-files --others --exclude-standard)"
          [ -z "$UNTRACKED_FILES" ] || {
            echo "Refusing deploy: staging checkout contains untracked files" >&2
            exit 1
          }

          # mira-bot-telegram MUST be in the default set: the staging Telegram
          # smoke (nameplate photo -> Drive Commander pack answer) runs against
          # stg-mira-bot-telegram, and build/force-recreate below are scoped to
          # $TARGETS, so omitting it leaves the bot on a stale image forever
          # (a `docker compose up -d` alone never rebuilds). NOTE: mira-bot-slack
          # is intentionally NOT here — staging runs no Slack bot (see the
          # header comment in docker-compose.staging-vps.yml; SLACK_BOT_TOKEN is
          # deliberately omitted), so adding it would fail `compose build`.
          TARGETS="${SERVICES:-mira-pipeline mira-mcp mira-hub mira-web mira-bot-telegram}"
          read -r -a TARGET_LIST <<< "$TARGETS"
          echo "Rebuild targets: $TARGETS"

          if [ "${RESET_VOLUMES:-false}" = "true" ]; then
            echo "=== RESET_VOLUMES=true — destroying staging volumes ==="
            doppler run --project factorylm --config stg -- \
              docker compose -f docker-compose.staging-vps.yml down -v
          fi

          echo "=== Pre-deploy cleanup: remove any stale stg-* containers ==="
          for svc in "${TARGET_LIST[@]}" atlas-api atlas-db atlas-minio; do
            docker rm -f "stg-${svc}" 2>/dev/null || true
          done

          # Deploy identity — `/VERSION` was retired 2026-08-02 (#3064); the
          # version is derived from the latest v* tag and baked into the image
          # as MIRA_APP_VERSION (compose build arg -> Dockerfile ARG). Prod does
          # this in deploy-vps.yml; staging was never wired, so every staging
          # image reported "unknown" and the journey-swarm receipt recorded an
          # unusable target revision (PRD §8.2 "the target revision is known").
          # Fetch first: a shallow checkout has no tags, and a missing tag must
          # degrade to "unknown", never fail the deploy.
          git fetch --tags --quiet 2>/dev/null || true
          export MIRA_APP_VERSION="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' | tr -d '[:space:]')"
          export MIRA_APP_VERSION="${MIRA_APP_VERSION:-unknown}"
          echo "Staging deploy identity: version=${MIRA_APP_VERSION}"

          echo "=== Build staging images ==="
          DOCKER_BUILDKIT=1 doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml build "${TARGET_LIST[@]}"

          echo "=== Bring up full staging stack ==="
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml up -d --remove-orphans

          # Force-recreate only the rebuilt services so their new images take effect.
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml up -d --no-deps --force-recreate "${TARGET_LIST[@]}"

          echo "=== Health checks ==="
          sleep 10
          echo "--- stg-mira-hub (4101) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4101/api/health
          echo "--- stg-mira-pipeline (4099) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4099/health
          echo "--- stg-atlas-api (4088) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4088/

          echo "=== Deploy complete ==="
          doppler run --project factorylm --config stg -- \
            docker compose -f docker-compose.staging-vps.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

          # Hard guard — fail loudly if any production container disappeared.
          PROD_RUNNING=$(docker ps --filter "name=^mira-" --filter "status=running" --format '{{.Names}}' | grep -v '^stg-' | wc -l)
          echo "Production mira-* containers still running: $PROD_RUNNING"
          if [ "$PROD_RUNNING" -lt 3 ]; then
            echo "::error::Production container count looks too low — investigate before declaring success"
            exit 1
          fi
          ENDSSH
          } | ssh \
            -i ~/.ssh/staging_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -l "$DEPLOY_USER" \
            165.245.138.91 \
            'bash -s'

      - name: Print staging URL
        if: success()
        run: |
          echo "::notice::Staging Hub: http://165.245.138.91:4101"
          echo "::notice::Staging Pipeline: http://165.245.138.91:4099/health"
          echo "::notice::Staging Web: http://165.245.138.91:4200"
          echo "::notice::Staging Atlas API: http://165.245.138.91:4088"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed; inspect the protected staging-deploy job logs."
