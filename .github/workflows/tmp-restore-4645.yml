name: tmp-restore-4645

on:
  push:
    branches:
      - cursor/fault-reset-factory-guard-00df
    paths:
      - ".github/workflows/tmp-restore-4645.yml"
      - "tools/tmp-restore-4645.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-restore-4645
  cancel-in-progress: false

jobs:
  restore:
    name: restore-4645
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore notebook-query.ts from dbb05d38
        run: python3 tools/tmp-restore-4645.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mira-hub/package-lock.json
      - name: Hub unit tests for #4645
        id: tests
        continue-on-error: true
        working-directory: mira-hub
        run: |
          set -euo pipefail
          npm ci
          echo "=== notebook-query-fault-reset-4645 ==="
          npx vitest run src/lib/__tests__/notebook-query-fault-reset-4645 | tee /tmp/t1.txt
          echo "=== answer-validation-fault-reset-4645 ==="
          npx vitest run src/capabilities/answer-validation-fault-reset-4645 | tee /tmp/t2.txt
          echo "=== notebook-query.test.ts ==="
          npx vitest run src/lib/__tests__/notebook-query.test.ts | tee /tmp/t3.txt
          echo "=== answer-validation + energized ==="
          npx vitest run src/capabilities/answer-validation.test.ts src/capabilities/answer-validation-energized-procedure.test.ts | tee /tmp/t4.txt
      - name: Commit restore and remove trigger
        run: |
          set -euo pipefail
          git config user.name "cursor-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-restore-4645.yml tools/tmp-restore-4645.py
          git add mira-hub/src/lib/notebook-query.ts
          git add -u .github/workflows/tmp-restore-4645.yml tools/tmp-restore-4645.py
          git commit -m "$(cat <<'EOF'
          fix(hub): restore notebook-query.ts; keep acknowledge out of procedureScore (#4645)

          procedureScore is shared by fault and procedure intent. Acknowledge
          vocabulary stays in SYNONYMS, FAULT_ACTION, and the fault-intent
          rerank boost — not in the shared PROC_SIGNALS list.
          EOF
          )"
          git push
      - name: Comment test results on PR 4672
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## #4645 restore + vitest (tmp runner)"
            echo
            echo "Restored \`notebook-query.ts\` from \`dbb05d38\` and removed acknowledge* from shared PROC_SIGNALS."
            echo
            echo "Test step conclusion: ${{ steps.tests.conclusion }}"
            echo
            echo '```'
            for f in /tmp/t1.txt /tmp/t2.txt /tmp/t3.txt /tmp/t4.txt; do
              echo "----- $f -----"
              tail -n 40 "$f" 2>/dev/null || echo "(missing)"
            done
            echo '```'
          } > /tmp/pr-body.md
          gh pr comment 4672 --body-file /tmp/pr-body.md
