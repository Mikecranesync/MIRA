name: QA Tenant Cleanup

# Removes disposable E2E trial tenants (notebook-qa-* / notebook-live-* /
# adversarial-*@factorylm.com) and everything they own, via the guarded
# transaction in tools/qa/cleanup_qa_tenants.sql. Dry-run by default; apply is
# gated on the same environment approvals as db-inspect / apply-migrations.
#
# Why: every prod verification mints a fresh trial account + notebook + PDF
# bytes + chunks; trial_expires_at only gates the UI, nothing ever deletes.
# This is the lightweight cleanup strategy — not an account-lifecycle system.
#
# Blast-radius controls live IN THE SQL (selector regex + all-users-trial +
# no-public-knowledge + age + hard cap) — see tools/qa/cleanup_qa_tenants.sql.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'DB target. staging = factorylm/stg, prod = factorylm/prd.'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      mode:
        description: 'dry-run prints per-table counts and rolls back; apply commits.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      age_days:
        description: 'Only tenants whose QA owner signed up more than N days ago.'
        required: true
        default: '7'
      max_tenants:
        description: 'Abort if the selector matches more than this many tenants.'
        required: true
        default: '50'

concurrency:
  group: qa-cleanup-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: ${{ inputs.mode }} on ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'staging' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version

      - name: Authenticate Doppler + resolve DATABASE_URL
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN secret not set."
            exit 1
          fi
          case "${{ inputs.target }}" in
            staging) DOPPLER_CFG=stg ;;
            prod)    DOPPLER_CFG=prd ;;
            *) echo "::error::Unknown target ${{ inputs.target }}"; exit 1 ;;
          esac
          echo "Doppler config: factorylm/${DOPPLER_CFG}"
          DATABASE_URL="$(doppler secrets get NEON_DATABASE_URL --project factorylm --config "${DOPPLER_CFG}" --plain)"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL empty after Doppler fetch (factorylm/${DOPPLER_CFG})"
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Run cleanup (${{ inputs.mode }})
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          APPLY=false
          if [ "${{ inputs.mode }}" = "apply" ]; then APPLY=true; fi
          # Integer-validate the numeric inputs before they reach SQL.
          case "${{ inputs.age_days }}" in (*[!0-9]*|'') echo "::error::age_days must be an integer"; exit 1 ;; esac
          case "${{ inputs.max_tenants }}" in (*[!0-9]*|'') echo "::error::max_tenants must be an integer"; exit 1 ;; esac
          psql "$DATABASE_URL" --no-psqlrc \
            -v age_days="${{ inputs.age_days }}" \
            -v max_tenants="${{ inputs.max_tenants }}" \
            -v apply="$APPLY" \
            -f tools/qa/cleanup_qa_tenants.sql
