# Mark three named staging Atlas work orders COMPLETE (#5223, owner-approved).
#
# Staging Atlas runs on the free licence (30 incomplete work orders per company).
# Staging cmms-sync filled the one shared staging company with 30 old test orders,
# so no Living Sheet order can be created. The owner approved closing exactly
# Atlas ids 1, 2 and 3. Turn staging CMMS_SYNC_ENABLED off first, or the freed
# slots refill from the unsynced Hub rows.
#
# This dispatch-only job runs tools/stg_atlas_close_three.py ON the staging host
# under `doppler run --config stg`, against staging Atlas on 127.0.0.1:4088. It
# checks all three orders (exist, OPEN or already COMPLETE, expected title prefix)
# before changing any, then sets status COMPLETE with a note that no repair was
# performed. Nothing is deleted; production is never touched. Output is ids, HTTP
# codes and statuses only (logs are PUBLIC).
#
# Same host trust and identity checks as stg-atlas-service-account.yml.
# Rollback: reopen an order in the staging Atlas UI (or change-status OPEN);
# delete this file and the helper once #5223 is resolved.
name: Staging Atlas close three test orders

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stg-atlas-close-three
  cancel-in-progress: false

jobs:
  close:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve deploy user and staging host
        id: target
        env:
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_HOST_KEY: ${{ vars.STAGING_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] && [ "$DEPLOY_USER" != "root" ] || {
            echo "::error::STAGING_DEPLOY_USER is missing, invalid or root"
            exit 1
          }
          [[ "$STAGING_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ || "$STAGING_HOST" =~ ^[a-z0-9]([a-z0-9-]{0,62}\.)+[a-z]{2,}$ ]] || {
            echo "::error::STAGING_HOST repository variable is missing or invalid"
            exit 1
          }
          PINNED="$(grep -E "^${STAGING_HOST//./\\.} " deployment/known_hosts.factorylm-prod | head -1 || true)"
          if [ -n "$PINNED" ]; then
            STAGING_HOST_KEY="$(printf '%s\n' "$PINNED" | awk '{print $2" "$3}')"
          fi
          [[ "$STAGING_HOST_KEY" =~ ^ssh-ed25519\ AAAA[0-9A-Za-z+/]+=*$ ]] || {
            echo "::error::STAGING_HOST_KEY is missing or not an ssh-ed25519 host public key"
            exit 1
          }
          printf '%s\n' "$STAGING_HOST_KEY" | ssh-keygen -lf - >/dev/null
          {
            printf 'deploy_user=%s\n' "$DEPLOY_USER"
            printf 'staging_host=%s\n' "$STAGING_HOST"
            printf 'staging_host_key=%s\n' "$STAGING_HOST_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_HOST: ${{ steps.target.outputs.staging_host }}
          STAGING_HOST_KEY: ${{ steps.target.outputs.staging_host_key }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_DEPLOY_SSH_KEY" ] || { echo "::error::STAGING_DEPLOY_SSH_KEY is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          printf '%s %s\n' "$STAGING_HOST" "$STAGING_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Close Atlas orders 1, 2, 3 (staging only)
        env:
          DEPLOY_USER: ${{ steps.target.outputs.deploy_user }}
          STAGING_HOST: ${{ steps.target.outputs.staging_host }}
        run: |
          set -euo pipefail
          # The helper travels on stdin after a fixed preamble; nothing from the
          # dispatcher reaches the remote shell. The preamble refuses to run if
          # this identity can read factorylm/prd (deploy-staging safeguard 3).
          rc=0
          {
            cat <<'ENDSSH'
          set -euo pipefail
          # The deploy user's Doppler token is scoped to the staging checkout
          # (docs/runbooks/staging-vps.md), so both Doppler calls run from there.
          # Same path guard as deploy-staging.yml safeguard 1.
          STG_DIR=/opt/mira-staging
          case "$(readlink -f "$STG_DIR" 2>/dev/null || echo "$STG_DIR")" in
            /opt/mira|/opt/mira/*) echo "STOP: staging path resolves into /opt/mira"; exit 5;;
          esac
          cd "$STG_DIR" || { echo "STOP: $STG_DIR missing"; exit 5; }
          if doppler secrets --project factorylm --config prd --only-names >/dev/null 2>&1; then
            echo "STOP: this identity can read factorylm/prd"
            exit 5
          fi
          # bash reads a piped script byte by byte, so python3 receives the rest
          # of stdin (the helper source) as its program.
          exec doppler run --project factorylm --config stg -- python3 -
          ENDSSH
            cat tools/stg_atlas_close_three.py
          } | ssh \
            -i ~/.ssh/staging_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -l "$DEPLOY_USER" \
            "$STAGING_HOST" \
            'bash -s' > "$RUNNER_TEMP/out.raw" 2>&1 || rc=$?
          sed -E 's/(password|passwd|secret|token|api[_-]?key|authorization|bearer|cookie|session).*$/\1 [redacted to end of line]/I' "$RUNNER_TEMP/out.raw" \
            | bash tools/qa/redact_ci_log.sh \
            | sed -E -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' -e 's/[A-Za-z0-9_+=-]{32,}/[redacted]/g'
          if [ "$rc" -ne 0 ]; then echo "::error::close-three run failed (exit $rc)"; exit "$rc"; fi
