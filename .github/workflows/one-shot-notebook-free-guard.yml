name: one-shot-notebook-free-guard
# Temporary: wraps legacy notebook providers() with withoutFreeOpenRouterModels,
# commits the route change, then deletes this workflow. Do not keep.
on:
  workflow_dispatch:
  push:
    branches: [cursor/openrouter-free-model-guard-834e]
    paths:
      - .github/workflows/one-shot-notebook-free-guard.yml

concurrency:
  group: one-shot-notebook-free-guard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cursor/openrouter-free-model-guard-834e

      - name: Wrap providers() and remove this workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("mira-hub/src/app/api/equipment-notebooks/[id]/chat/route.ts")
          text = p.read_text(encoding="utf-8")
          old_imp = """import {\n  buildRequestBody,\n  canonicalProviders,\n  canonicalSeamEnabled,"""
          new_imp = """import {\n  buildRequestBody,\n  canonicalProviders,\n  withoutFreeOpenRouterModels,\n  canonicalSeamEnabled,"""
          if "withoutFreeOpenRouterModels" in text and "return withoutFreeOpenRouterModels" in text:
              print("already wrapped")
          else:
              if old_imp not in text:
                  raise SystemExit("import block not found")
              text = text.replace(old_imp, new_imp, 1)
              old_fn = "function providers(): CascadeProvider[] {\n  return ["
              new_fn = "function providers(): CascadeProvider[] {\n  return withoutFreeOpenRouterModels(["
              if old_fn not in text:
                  raise SystemExit("providers() open not found")
              text = text.replace(old_fn, new_fn, 1)
              old_close = '''      model: process.env.GEMINI_MODEL ?? "gemini-2.5-flash",\n    },\n  ];\n}'''
              new_close = '''      model: process.env.GEMINI_MODEL ?? "gemini-2.5-flash",\n    },\n  ]);\n}'''
              if old_close not in text:
                  raise SystemExit("providers() close not found")
              text = text.replace(old_close, new_close, 1)
              if "return withoutFreeOpenRouterModels([" not in text:
                  raise SystemExit("wrap missing after edit")
              p.write_text(text, encoding="utf-8")
              print("wrapped providers()")
          PY
          rm -f .github/workflows/one-shot-notebook-free-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "mira-hub/src/app/api/equipment-notebooks/[id]/chat/route.ts"
          git add -u .github/workflows/one-shot-notebook-free-guard.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "security(hub): filter :free models from legacy notebook providers()"
          git push
