name: Version Tag

# Every merge to main gets a unique save point: an annotated `v<X.Y.Z>` tag, a
# paired `rollback/<date>-v<X.Y.Z>` checkpoint, and a GitHub Release whose notes
# GitHub generates from the merged pull requests.
#
# THE VERSION IS DERIVED FROM TAGS, NOT FROM A COMMITTED FILE.
#
# Why that changed (2026-07-29): `/VERSION` was one monotonic line in a tracked
# file and `docs/CHANGELOG.md` was prepended to at the top, so EVERY PR edited the
# SAME line of the SAME file. Each merge therefore conflicted every other open PR
# — and a conflicting PR receives NO CI at all, because GitHub cannot build the
# merge ref, so it silently stops being verified while still looking healthy. That
# happened four times in a single session.
#
# GitHub's documented model removes the shared line entirely:
#   - releases are built on TAGS
#     (docs/repositories/releasing-projects-on-github/about-releases) and the docs
#     carry no guidance about storing a version in a repository file;
#   - release notes are generated from merged PRs
#     (…/automatically-generated-release-notes), configured in .github/release.yml.
#
# And critically: this repo's `main-branch-protection` ruleset targets `branch`
# only, so TAGS ARE UNPROTECTED. This workflow creates tags without pushing to
# `main`, so it needs no bot write access to the protected branch and no
# branch-protection accommodation.
#
# `/VERSION` is still honoured as a FLOOR during the transition (the derived
# version can never go backwards relative to it), so this is safe to land while
# PRs still bump the file. See docs/versioning.md for the retirement steps.
#
# Note: release.yml triggers on `mira-*-v*` tags (component releases) — a
# different pattern — so the `v<X.Y.Z>` tags created here do not double-fire it.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag overall version + rollback checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: the version is derived from the tag list.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derive the next version from tags
        id: derive
        run: |
          set -euo pipefail
          # Tags are needed explicitly: actions/checkout fetches them with
          # fetch-depth:0, but a re-run against a shallow cache may not have them.
          git fetch --tags --force --quiet || true

          SUBJECT="$(git log -1 --pretty=%s)"
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1 || true)"
          echo "latest tag : ${LATEST:-<none>}"
          echo "subject    : $SUBJECT"

          VER="$(python3 tools/release/next_version.py \
                   --latest-tag "${LATEST:-}" --subject "$SUBJECT")"
          if [ -z "$VER" ]; then
            echo "::error::could not derive a version — refusing to skip the save point."
            exit 1
          fi
          echo "derived    : $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Tag + rollback checkpoint + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.derive.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VER"

          # Derivation always advances past the latest tag, so a collision here
          # means something is wrong (a concurrent run, or a hand-made tag).
          # Warn and stop rather than silently doing nothing.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::$TAG already exists — another run may have tagged this commit. No-op."
            exit 0
          fi

          SHORT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%d)"
          ROLLBACK="rollback/$DATE-$TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG"      -m "$TAG — auto-tagged on merge $SHORT"
          git tag -a "$ROLLBACK" -m "Rollback checkpoint at $TAG (merge $SHORT)"
          git push origin "$TAG" "$ROLLBACK"
          echo "Tagged $TAG + $ROLLBACK at $SHORT"

          # --generate-notes: GitHub composes the notes from the merged PRs in
          # this release, grouped per .github/release.yml. Nothing to hand-write.
          # Best-effort: a release hiccup must never lose the tag, which is the
          # actual save point.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "$(git tag --list 'v*' --sort=-v:refname | sed -n 2p)" \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || echo "::warning::Release creation failed for $TAG (tag still pushed — the save point exists)."
