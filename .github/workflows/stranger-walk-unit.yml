name: Stranger Walk unit tests

# The Stranger Walk scorer, budget and spend-ledger unit tests (#4460, #5081, #5095): no secrets,
# no staging, no paid inference, $0. Split out of stranger-walk.yml (2026-11-01) so these run on
# every PR that touches the harness while the paid walk workflow stays disabled. This workflow has
# no schedule and never walks; the paid walk lives only in stranger-walk.yml.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "mira-hub/tests/stranger-walk/**"
      - "mira-hub/tests/fidelity/surfaces.ts"
      - "mira-hub/tests/fidelity/harness.ts"
      - ".github/workflows/stranger-walk.yml"
      - ".github/workflows/stranger-walk-unit.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Stranger walk scorer + budget tests
    runs-on: ubuntu-24.04 # ubuntu-latest became 26.04, where Playwright ships no chromium (run 41240904294)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install mira-hub deps
        working-directory: mira-hub
        run: bun install --frozen-lockfile --ignore-scripts

      # A count floor, not just a green line: a collection that silently finds no tests (a moved
      # file, a broken include) must fail here, never pass (.claude/rules/prove-the-test-fails.md).
      - name: Scorer and budget tests (count asserted)
        working-directory: mira-hub
        run: |
          npx vitest run --config tests/stranger-walk/vitest.stranger-walk.config.ts --reporter=default --reporter=json --outputFile=/tmp/sw-vitest.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/sw-vitest.json"))
          total, passed, failed = r["numTotalTests"], r["numPassedTests"], r["numFailedTests"]
          print(f"stranger-walk unit tests: {passed}/{total} passed, {failed} failed")
          if failed or total < 28 or passed != total:
              sys.exit(f"::error::expected >= 28 collected and all passing, got {passed}/{total} ({failed} failed)")
          PY
