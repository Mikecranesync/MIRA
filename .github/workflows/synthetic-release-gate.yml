name: Synthetic Release Gate

# Release gate orchestrator — runs the complete evaluation suite (drift_check →
# run_technician → judge_baseline → report) and emits a single verdict (PASS /
# HOLD / INFRA_FAILURE). Verifies exact SHA match before posting PR comment.
#
# Triggered on:
#   - workflow_dispatch (pr_number, head_sha)
#   - Advisory path changes (evals/scripts/* evals/*cases.yaml)
#
# Skips for Dependabot PRs (dependency-bump risk is graded by offline deepeval).
#
# Design: docs/plans/2026-09-13-lab-pr2-synthetic-release-gate.md

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (for commenting)
        required: false
      head_sha:
        description: Exact HEAD SHA to test
        required: false
  pull_request:
    branches: [main]
    paths:
      - evals/scripts/release_gate.py
      - evals/scripts/run_technician.py
      - evals/scripts/judge_baseline.py
      - evals/scripts/drift_check.py
      - evals/scripts/report.py
      - evals/technician/cases.yaml
      - evals/safety/cases.yaml

concurrency:
  group: synthetic-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # For sticky-comment on PR
  actions: read         # For checking other workflow status

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Secrets required (set under repo "staging" environment):
    #   FLM_BASE_URL            — base URL for the API (e.g. https://app.factorylm.com)
    #   FLM_SESSION_COOKIE      — session cookie for the eval notebook
    #   FLM_EVAL_NOTEBOOK_ID    — notebook ID backing the technician cases
    #   GROQ_API_KEY            — for judge_baseline
    # In offline-only mode, only GROQ_API_KEY is strictly required for re-judging.
    environment: staging

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for git log

      # Dependabot PRs cannot access GitHub environment secrets. Skip the gate
      # for these PRs (same pattern as staging-gate.yml).
      - name: Skip notice (Dependabot PR)
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Dependabot PR detected (actor=${{ github.actor }})."
          echo "Synthetic Release Gate skipped — Dependabot cannot access the"
          echo "'staging' environment secrets. Dependency bumps are graded by"
          echo "offline deepeval suite + CI lint/tests. Job will exit success."
          exit 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "evals/scripts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f evals/scripts/requirements.txt ]; then
            pip install -r evals/scripts/requirements.txt
          fi

      # Determine target SHA and PR number
      - name: Resolve target SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="${{ github.event.inputs.head_sha }}"
          pr_number="${{ github.event.inputs.pr_number }}"

          if [ -z "$target_sha" ]; then
            # workflow_dispatch without explicit sha: use the current HEAD
            target_sha="$(git rev-parse HEAD)"
          fi
          if [ -z "$pr_number" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Testing SHA: $target_sha"
          if [ -n "$pr_number" ]; then
            echo "PR number: $pr_number"
          fi

      - name: Run release gate (offline mode with archived baseline)
        env:
          # Offline mode: use archived baseline, skip live API calls
          FLM_BASE_URL: https://app.factorylm.com
          # Session cookie not required in offline mode, but keep it in case
          # the gate logic changes and someone uses this workflow for live runs
          FLM_SESSION_COOKIE: ${{ secrets.FLM_SESSION_COOKIE || 'offline' }}
          FLM_EVAL_NOTEBOOK_ID: ${{ secrets.FLM_EVAL_NOTEBOOK_ID || 'offline' }}
          GROQ_API_KEY: ${{ secrets.STAGING_GROQ_API_KEY }}
          JUDGE_MODEL: groq
        run: |
          python evals/scripts/release_gate.py \
            --sha "${{ steps.resolve.outputs.target_sha }}" \
            --pr "${{ steps.resolve.outputs.pr_number }}" \
            --offline-only \
            --baseline evals/results/f06922ac6-cov100/ \
            --run-id "gh-${{ github.run_number }}"

      # Report on the gate result
      - name: Capture gate verdict
        if: always()
        id: verdict
        run: |
          set -euo pipefail
          # The gate creates evals/results/<sha>-gate-<runid>/report.txt
          # Find the most recent report and extract the verdict line
          latest_report="$(find evals/results -name 'report.txt' -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          if [ -z "$latest_report" ] || [ ! -f "$latest_report" ]; then
            echo "verdict=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "No report found"
            exit 0
          fi

          verdict_line="$(grep -oP '^HOLD|^RELEASE' "$latest_report" || echo 'UNKNOWN')"
          if [ "$verdict_line" = "HOLD" ]; then
            verdict="HOLD"
          elif [ "$verdict_line" = "RELEASE" ]; then
            verdict="PASS"
          else
            verdict="UNKNOWN"
          fi

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Verdict: $verdict"

      - name: Post PR comment (if PR number known)
        if: always() && steps.resolve.outputs.pr_number != '' && hashFiles('evals/results/*/report.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Verify exact SHA match (must match the target)
          target_sha="${{ steps.resolve.outputs.target_sha }}"
          current_sha="$(git rev-parse HEAD)"

          if [ "$target_sha" != "$current_sha" ]; then
            echo "::warning::SHA mismatch: target=$target_sha current=$current_sha"
            echo "Not posting comment (SHA changed during workflow)"
            exit 0
          fi

          pr_number="${{ steps.resolve.outputs.pr_number }}"
          latest_report="$(find evals/results -name 'report.txt' -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"

          if [ -z "$latest_report" ] || [ ! -f "$latest_report" ]; then
            echo "::warning::No report found for comment"
            exit 0
          fi

          # Build the PR comment (§18 compact summary)
          cat > /tmp/release_gate_comment.md << 'EOF'
          ## Synthetic Release Gate

          **Verdict:** ${{ steps.verdict.outputs.verdict }}

          **SHA:** ${{ steps.resolve.outputs.target_sha }}

          **Report:**
          ```
          EOF

          # Include report text (first 60 lines)
          head -60 "$latest_report" >> /tmp/release_gate_comment.md

          cat >> /tmp/release_gate_comment.md << 'EOF'
          ```

          Run: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          # Post sticky comment
          gh pr comment "$pr_number" \
            --repo "${{ github.repository }}" \
            --body "$(cat /tmp/release_gate_comment.md)" || true

      - name: Upload results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-results-${{ github.run_number }}
          path: evals/results/*/
          retention-days: 30
