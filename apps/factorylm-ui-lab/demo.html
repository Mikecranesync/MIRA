<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The public demo's own entry, with its own CSP.

      index.html keeps `connect-src 'none'` because the lab's whole guarantee is
      that the fixture harness reaches no network — widening it would have
      retired that guarantee for every other lab mode to serve this one. This
      page instead names exactly the two local services the demo talks to:
      SimLab (8099, or 8098 when a developer machine already has one running)
      and a local Hub (3000). A real deployment sets its own CSP
      for its own origins; nothing here is a production policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8099 http://localhost:8099 http://127.0.0.1:8098 http://localhost:8098 http://127.0.0.1:3000 http://localhost:3000; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>FactoryLM — public demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
