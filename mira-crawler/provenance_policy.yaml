# Canonical provenance policy — the ONE place that decides whether a source may
# enter the shared corpus. (CU-03a / CU-03 Gate 6.)
#
# WHY THIS EXISTS
# The curation gate authorized shared-corpus writes from `sources.yaml` (18
# hosts) while the crawler feeders kept their own manifests. Structural
# discovery found **17 URL manifests across tasks/*.py** and **38 distinct
# feeder origins, 31 of them absent from the gate** — every one a source the
# crawler is configured to fetch and the gate is configured to refuse. Two lists
# that disagree is not a gate; it is a coin flip.
#
# HOW IT IS ENFORCED
# `ingest/provenance.py` reads this file; `tasks/ingest.py::shared_corpus_source_allowed`
# consults it. `tests/test_provenance_policy.py` re-derives every configured
# origin from the real module constants (`ingest/origins.py`) and FAILS if any
# origin has no entry here — so a new feeder, a new URL, or a renamed manifest
# cannot ship unclassified.
#
# CLASSIFICATIONS
#   curated        may enter the shared corpus every tenant reads
#   private        may be ingested, but tenant-scoped only
#   blocked        refused; ingested from here at all
#   infrastructure not a content origin (API endpoint, namespace URI, local
#                  service) — never reaches ingest_url; recorded so it cannot be
#                  mistaken for an unclassified content source
#
# `confirmed_by` records WHO decided, so a promotion cannot masquerade as
# pre-existing curation. **`PENDING-HUMAN` entries were promoted by CU-03a to
# reconcile the feeders with the gate and require @Mikecranesync's
# confirmation** — they are listed in the PR body. Widening the gate to make
# tests pass is exactly what this file exists to prevent; every promotion is
# therefore attributed and reviewable.

