      description: "GS20 AC Drive user manual — parameters, wiring, fault codes"

    automationdirect_gs10:
      # AutomationDirect split gs10m.pdf into per-chapter files; gs10usermanual.pdf
      # is the current combined manual (old gs10m.pdf now 404s). Verified 2026-07-27.
      url: "https://cdn.automationdirect.com/static/manuals/gs10m/gs10usermanual.pdf"
      type: equipment_manual
      format: pdf
      manufacturer: AutomationDirect
      equipment_id: GS10
