      # (old 75008202e.pdf now 404s). Verified 2026-07-27.
      url: "https://www.wago.com/wagoweb/documentation/750/eng_manu/coupler_controller/m07508202_xxxxxxxx_0en.pdf"
      type: equipment_manual
      format: pdf
