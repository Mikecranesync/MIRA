    # ── Siemens (SINAMICS drives) — cache.industry.siemens.com/dl/files/ is public,
    # zero-login (robots.txt disallows only /dl/dl-media/ + /dl/media/, not /dl/files/).
    # List Manuals carry the full fault/alarm/parameter reference. Verified 2026-07-27.
    siemens_sinamics_g120c_list:
      url: "https://cache.industry.siemens.com/dl/files/922/109817922/att_1133717/v1/G120C_list_man_0223_en-US.pdf"
