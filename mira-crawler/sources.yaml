      format: pdf
      manufacturer: Siemens
      equipment_id: SINAMICS-G120C
      crawl_pattern: direct
      description: "SINAMICS G120C List Manual (02/2023) — parameters, faults (Fxxxxx), alarms (Axxxxx)"

    siemens_sinamics_g120_cu240:
      url: "https://cache.industry.siemens.com/dl/files/919/109817919/att_1133702/v1/G120_CU240BE-2_list_man_0223_en-US.pdf"
      type: equipment_manual
      format: pdf
      manufacturer: Siemens
      equipment_id: SINAMICS-G120-CU240
      crawl_pattern: direct
      description: "SINAMICS G120 CU240B-2/CU240E-2 List Manual (02/2023) — parameters, fault/alarm codes"

    # ── ABB: no tier-3 equipment manual added here — the ABB reference PDFs under
    # 5_reference (nameplate/softstarter/VFD guides) are already crawled by the
    # --filter abb nightly job (#2959 broadened it to scan every tier).

    # ── FANUC & KUKA (industrial robots): NO zero-login, publicly-hosted official
    # manuals exist. Both publish exclusively via authenticated dealer/customer
    # portals (my.kuka.com, FANUC CRC/partner portal); every public copy found is a
    # third-party re-host (Scribd/ManualsLib/PDFCoffee) that is login-walled and/or
    # copyright-infringing — disqualified by the zero-login + license rules above.
    # Intentionally omitted (searched + verified 2026-07-27). Re-add only if an
    # official, login-free fanuc.*/kuka.* PDF surfaces.

    # ── Re-acquisition (2026-07-29) — CSVCrawler had discovered these on official
    # OEM domains but wrote them untrusted (manual_scrape_targets.csv never persists
    # the resolved PDF URL, so those rows can't be audited after the fact — see
    # .claude/rules/oem-crawler-trusted.md). Re-added here so they are fetched by the
    # trusted ManufacturerCrawler path instead, with a re-fetchable source_url on
    # record. Each verified live + valid PDF (%PDF- header + intact %%EOF trailer) by
    # the 2026-07-29 link-health audit. Only official-OEM hosts with a stable, direct
    # static-file URL qualified — distributor/reseller hosts (rs-online.com,
    # hoosiercrane.com, tsoverheadcrane.com), portal roots, and dynamic
    # document-ID endpoints (Siemens, Yaskawa) were excluded; see
    # docs/CHANGELOG.md for the full exclusion list.
    interroll_multicontrol:
      url: "https://www.interroll.com/fileadmin/Downloads/User_Manuals/Controls/MultiControl/User_Manual_MultiControl_EN.pdf"
      type: equipment_manual
      format: pdf
      manufacturer: Interroll
      equipment_id: MultiControl Analog Interface
      crawl_pattern: direct
      description: "Interroll MultiControl Analog Interface user manual — conveyor drum-motor controller wiring, configuration, diagnostics"

    demag_other:
      url: "https://www.demagcranes.com/sites/default/files/media/documents/21115144_100331_2.pdf"
      type: equipment_manual
      format: pdf
      manufacturer: Demag
      crawl_pattern: direct
      description: "Demag crane/hoist equipment manual (no specific model recorded in the source CSV row)"

    magnetek_impulse_g_mini:
